name: Validar contrato y preparar importación a Swagger Studio

on:
  pull_request:
    branches: [master]
    paths: ['swagger/**', 'contratos/**', 'tests/contratos/**', '.github/workflows/swagger-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato:
    name: Validar contrato y exportación para Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swagger
    steps:
      - name: Descargar fuentes
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: swagger/package-lock.json
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias fijadas
        run: |
          npm ci --ignore-scripts
          python -m pip install PyYAML==6.0.3 jsonschema==4.25.1
      - name: Validar contrato estricto
        run: npm run validate
      - name: Preparar definición derivada para Studio
        run: npm run export
      - name: Comprobar equivalencia y referencias
        run: npm test
      - name: Ejecutar regresión contractual existente
        working-directory: .
        run: python -m unittest discover -s tests/contratos -v
      - name: Adjuntar artefacto y evidencias para auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-studio-revision
          path: |
            swagger/reports
          retention-days: 7
