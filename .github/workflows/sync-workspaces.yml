name: Sincronizar ramas de trabajo

on:
  push:
    branches: [castilla, poma, cueva, lopez, taco, vera]
  workflow_run:
    workflows: [Sincronizar ramas con master]
    types: [completed]
    branches: [master]
  schedule:
    - cron: '7/15 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Origen oficial (solo se ejecutan pares habilitados)
        type: choice
        default: cueva
        options: [cueva, todos, castilla, poma, lopez, taco, vera]
      dry_run:
        description: Preparar y comprobar sin publicar
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.repository == 'Taller-SW-Web/Productos-y-Ofertas-docs' &&
      (github.event_name == 'workflow_dispatch' || vars.SYNC_WORKSPACES_ENABLED == 'true') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - name: Descargar ejecutor revisado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Seleccionar pares habilitados
        id: plan
        env:
          SYNC_EVENT: ${{ github.event_name }}
          SYNC_REF: ${{ github.ref_name }}
          SYNC_SELECTION: ${{ inputs.source }}
        run: python3 scripts/sync_workspaces.py plan --config .github/sync-config.json

  sync:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: sync-workspace-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - name: Descargar ejecutor revisado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Incorporar cambios oficiales
        env:
          SYNC_SOURCE: ${{ matrix.source }}
          SYNC_GITHUB_TOKEN: ${{ github.token }}
          SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          args=()
          if [ "$SYNC_DRY_RUN" = "false" ]; then args+=(--apply); fi
          python3 scripts/sync_workspaces.py run --config .github/sync-config.json --source "$SYNC_SOURCE" "${args[@]}"
