<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de cupones de descuento</title><style>
:root{--s:#fff;--a:#f3f4f6;--b:#D1D5DB;--c:#d1d5db;--m:#6b7280;--d:#6B7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--k);outline-offset:2px}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.head p{margin:4px 0;color:var(--m)}.btn{border:1px solid var(--k);background:#fff;border-radius:4px;padding:10px 14px;cursor:pointer}.primary{background:var(--k);color:#fff}.panel{border:1px solid var(--c);padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.wide{grid-column:1/-1}label{font-weight:600;display:block;margin-bottom:5px}.input,select{width:100%;border:1px solid var(--c);padding:10px 12px;background:#fff}.error{font-size:13px;font-weight:700}.tablewrap{overflow:auto}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:left}th{background:var(--a)}.code{font-family:monospace;font-weight:700}.status{border:1px solid var(--d);border-radius:999px;padding:2px 8px}.cards{display:none}.card,.notice{border:1px solid var(--c);padding:14px;margin:10px 0}.notice{border-width:2px}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--k);width:min(560px,calc(100vw - 32px));padding:20px}.toast{position:fixed;right:16px;bottom:16px;background:#fff;border:2px solid var(--k);padding:12px;display:none}.toast.show{display:block}@media(max-width:900px){.desktop{display:none}.cards{display:block}.grid{grid-template-columns:1fr}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.head .row{margin-top:12px}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}}
</style></head><body><header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Productos / Cupones</div></div></header><main class="wrap" id="app"></main><div class="overlay" id="modal"><section class="dialog" role="dialog" aria-modal="true"><h2 id="mt"></h2><p id="mc"></p><div class="row"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="apply">Confirmar</button></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
const promos={P1:{name:'10 % en zapatillas',comb:'Exclusiva salvo combinaciones habilitadas.'},P2:{name:'S/ 25 en running',comb:'Combinabilidad definida por la promoción.'}};
let coupons=[{code:'DEPORTE10',promo:'P1',state:'ACTIVO',min:150,used:38,limit:100,maxClient:1,restitution:'RESTAURAR_EN_CANCELACION'},{code:'RUNNING_25',promo:'P2',state:'ACTIVO',min:null,used:72,limit:80,maxClient:null,restitution:'RESTAURAR_EN_CANCELACION'}];
const st={view:'list',i:null,form:null},app=document.getElementById('app'),toast=document.getElementById('toast');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}function head(t,c,a=''){return `<div class="head"><div><h1>${t}</h1><p>${c}</p></div><div class="row">${a}</div></div>`}
function render(){st.view==='list'?list():st.view==='form'?form():detail()}function list(){const rows=coupons.map((c,i)=>`<tr><td class="code">${c.code}</td><td>${esc(promos[c.promo].name)}</td><td>${c.state==='ACTIVO'?'Activo':'Inactivo'}</td><td>${c.used} / ${c.limit??'Sin límite'}</td><td>${c.maxClient??'Sin límite'}</td><td><button class="btn" data-a="detail" data-i="${i}">Ver</button></td></tr>`).join('');app.innerHTML=head('Cupones de descuento','Administra códigos asociados a promociones.','<button class="btn primary" data-a="new">Crear cupón</button>')+`<div class="desktop tablewrap"><table><thead><tr><th>Código</th><th>Promoción</th><th>Estado</th><th>Uso global</th><th>Límite cliente</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="cards">${coupons.map((c,i)=>`<article class="card"><strong class="code">${c.code}</strong><p>Límite cliente: ${c.maxClient??'Sin límite'}</p><button class="btn" data-a="detail" data-i="${i}">Ver</button></article>`).join('')}</div>`;bind()}
function blank(){return{code:'',promo:'',state:'ACTIVO',min:'',limit:'',maxClient:'',restitution:'RESTAURAR_EN_CANCELACION'}}function form(){const c=st.form;app.innerHTML=head(st.i===null?'Crear cupón':'Editar cupón','El beneficio y la vigencia provienen de la promoción asociada.')+`<form id="f" class="panel"><div class="grid"><div><label>Código</label><input class="input code" id="code" value="${esc(c.code)}"><div class="error" id="ec"></div></div><div><label>Promoción</label><select id="promo"><option value="">Seleccionar</option>${Object.entries(promos).map(([k,p])=>`<option value="${k}" ${c.promo===k?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>Monto mínimo</label><input class="input" id="min" type="number" value="${esc(c.min)}" placeholder="Sin mínimo"></div><div><label>Límite global</label><input class="input" id="limit" type="number" value="${esc(c.limit)}" placeholder="Sin límite"></div><div><label>Límite por cliente</label><input class="input" id="client" type="number" value="${esc(c.maxClient)}" placeholder="Sin límite"><div class="muted">Opcional; vacío significa sin límite.</div><div class="error" id="ecl"></div></div><div><label>Restitución</label><select id="rest"><option value="RESTAURAR_EN_CANCELACION">Restaurar uso</option><option value="NO_RESTAURAR">No restaurar</option></select></div><div class="wide"><strong>Política de combinación</strong><p>${c.promo?esc(promos[c.promo].comb):'Selecciona una promoción.'}</p></div></div><div class="row"><button type="button" class="btn" data-a="back">Cancelar</button><button class="btn primary">Guardar</button></div></form>`;bind();document.getElementById('f').onsubmit=save}
function save(e){e.preventDefault();const norm=document.getElementById('code').value.trim().toUpperCase(),promo=document.getElementById('promo').value,lim=document.getElementById('limit').value===''?null:Number(document.getElementById('limit').value),cli=document.getElementById('client').value===''?null:Number(document.getElementById('client').value);document.getElementById('ec').textContent='';document.getElementById('ecl').textContent='';if(!/^[A-Z0-9_-]+$/.test(norm)){document.getElementById('ec').textContent='Ingresa un código válido.';return}if(coupons.some((x,i)=>x.code===norm&&i!==st.i)){document.getElementById('ec').textContent='Este código ya existe. Prueba con uno diferente.';return}if(!promo)return;if(cli!==null&&(!Number.isInteger(cli)||cli<1)){document.getElementById('ecl').textContent='Usa un entero positivo o deja vacío.';return}if(lim!==null&&cli!==null&&cli>lim){document.getElementById('ecl').textContent='No puede superar el límite global.';return}const x={code:norm,promo,state:'ACTIVO',min:document.getElementById('min').value===''?null:Number(document.getElementById('min').value),used:st.i===null?0:coupons[st.i].used,limit:lim,maxClient:cli,restitution:document.getElementById('rest').value};if(st.i===null)coupons.unshift(x);else coupons[st.i]=x;st.view='list';note('Cupón guardado.');render()}
function detail(){const c=coupons[st.i];app.innerHTML=head(c.code,'Detalle del cupón.','<button class="btn" data-a="edit">Editar</button>')+`<section class="panel"><p><strong>Promoción:</strong> ${esc(promos[c.promo].name)}</p><p><strong>Uso global:</strong> ${c.used} / ${c.limit??'Sin límite'}</p><p><strong>Límite por cliente:</strong> ${c.maxClient??'Sin límite'}</p><div class="notice"><strong>La validación de una compra no consume usos.</strong></div><div class="row"><button class="btn" data-a="back">Volver</button><button class="btn primary" data-a="toggle">${c.state==='ACTIVO'?'Desactivar':'Activar'} cupón</button></div></section>`;bind()}
function bind(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,i=b.dataset.i!==undefined?Number(b.dataset.i):null;if(a==='new'){st.i=null;st.form=blank();st.view='form';render()}if(a==='detail'){st.i=i;st.view='detail';render()}if(a==='edit'){const c=coupons[st.i];st.form={...c,min:c.min??'',limit:c.limit??'',maxClient:c.maxClient??''};st.view='form';render()}if(a==='back'){st.view='list';render()}if(a==='toggle'){const c=coupons[st.i];mt.textContent=c.state==='ACTIVO'?'Desactivar cupón':'Activar cupón';mc.textContent=c.state==='ACTIVO'?'Dejará de participar en nuevas validaciones.':'Volverá a participar cuando corresponda.';modal.classList.add('open')}})}
cancel.onclick=()=>modal.classList.remove('open');apply.onclick=()=>{const c=coupons[st.i];c.state=c.state==='ACTIVO'?'INACTIVO':'ACTIVO';modal.classList.remove('open');render()};render();
</script></body></html>
