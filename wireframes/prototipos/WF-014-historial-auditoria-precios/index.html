<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historial de auditoría de precios</title><style>
:root{--a:#f3f4f6;--b:#d1d5db;--c:#d1d5db;--m:#6b7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit;min-height:44px}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.btn{border:1px solid var(--k);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--k);color:#fff}.panel{border:1px solid var(--c);padding:16px;margin:14px 0}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.input,select{width:100%;border:1px solid var(--c);padding:10px;background:#fff}.tablewrap{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{background:var(--a)}.notice{border:2px solid var(--k);padding:14px}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--k);width:min(720px,calc(100vw - 32px));padding:20px}.mono{font-family:monospace}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.filters{grid-template-columns:1fr}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}}
</style></head><body><header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Control interno / Auditoría de precios</div></div></header><main class="wrap" id="app"></main><div class="overlay" id="detail"><section class="dialog"><h2>Detalle de auditoría</h2><div id="db"></div><button class="btn" id="dc">Cerrar</button></section></div><script>
const rows=[{id:'A1',sku:'RUN-42',type:'Precio regular',op:'Modificación de precio',old:349.9,newp:319.9,varp:-8.57,user:'gestor@tienda.com',ip:'190.10.10.1',channel:'Gestión interna',batch:null,reason:'Ajuste comercial',ts:'2026-09-28T14:00:00Z'},{id:'A2',sku:'NUEVO-01',type:'Precio regular',op:'Creación de precio',old:null,newp:129.9,varp:null,user:'gestor@tienda.com',ip:'190.10.10.1',channel:'Gestión interna',batch:null,reason:'Alta de producto',ts:'2026-09-28T13:00:00Z'},{id:'A3',sku:'RUN-41',type:'Oferta',op:'Retiro de oferta',old:170,newp:null,varp:null,user:'admin@tienda.com',ip:'190.10.10.2',channel:'Carga masiva',batch:'B-44',reason:'Fin de oferta',ts:'2026-09-28T12:00:00Z'}];const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const price=(v,kind)=>v==null?(kind==='old'?'Sin precio anterior':'Sin oferta'):`S/ ${v.toFixed(2)}`;const variation=v=>v==null?'No aplicable':`${v>0?'+':''}${v.toFixed(2)} %`;function render(){const noPerm=new URLSearchParams(location.search).get('state')==='no-permission';if(noPerm){app.innerHTML='<h1>Historial de auditoría de precios</h1><div class="notice">No tienes permiso para consultar esta información.</div>';return}app.innerHTML=`<div class="head"><div><h1>Historial de auditoría de precios</h1><p class="muted">Bitácora inmutable de cambios confirmados.</p></div><div class="row"><button class="btn">Exportar CSV</button><button class="btn primary">Exportar PDF</button></div></div><section class="panel filters"><input class="input" placeholder="SKU"><input class="input" placeholder="Usuario"><select><option>Todos los canales</option><option>Gestión interna</option><option>Carga masiva</option><option>Integración externa</option></select></section><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>SKU</th><th>Operación</th><th>Precio anterior</th><th>Precio nuevo</th><th>Variación</th><th>Usuario</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.ts}</td><td class="mono">${r.sku}</td><td>${r.op}</td><td>${price(r.old,'old')}</td><td>${price(r.newp,'new')}</td><td>${variation(r.varp)}</td><td>${r.user}</td><td><button class="btn" data-id="${r.id}">Ver detalle</button></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id))}function open(id){const r=rows.find(x=>x.id===id);db.innerHTML=`<dl><dt>SKU</dt><dd class="mono">${esc(r.sku)}</dd><dt>Tipo de precio / cambio</dt><dd>${r.type} / ${r.op}</dd><dt>Precio anterior</dt><dd>${price(r.old,'old')}</dd><dt>Precio nuevo</dt><dd>${price(r.newp,'new')}</dd><dt>Variación</dt><dd>${variation(r.varp)}</dd><dt>Usuario</dt><dd>${esc(r.user)}</dd><dt>IP de origen</dt><dd class="mono">${esc(r.ip)}</dd><dt>Origen del cambio</dt><dd>${r.channel}</dd><dt>Lote</dt><dd>${r.batch??'No aplica'}</dd><dt>Motivo</dt><dd>${esc(r.reason)}</dd></dl><div class="notice">Este registro es de solo lectura y no puede editarse desde esta interfaz.</div>`;detail.classList.add('open')}dc.onclick=()=>detail.classList.remove('open');render();
</script></body></html>
