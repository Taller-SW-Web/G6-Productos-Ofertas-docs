<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de productos</title>
  <style>
    :root{
      --surface:#FFFFFF;
      --neutral-10:#F3F4F6;
      --neutral-20:#D1D5DB;
      --neutral-30:#D1D5DB;
      --neutral-50:#6B7280;
      --neutral-70:#6B7280;
      --neutral-90:#111827;
      --radius:4px;
      --content:1200px;
      --gutter:24px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--neutral-90);
      background:var(--surface);
    }

    *{box-sizing:border-box}
    html{min-width:320px;color-scheme:light}
    body{margin:0;background:var(--surface);font-size:16px;line-height:1.5}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
      outline:3px solid var(--neutral-90);outline-offset:2px
    }
    [hidden]{display:none!important}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin-bottom:8px}
    h2{font-size:23px;line-height:1.2;margin-bottom:12px}
    h3{font-size:18px;line-height:1.3;margin-bottom:8px}
    .muted{color:var(--neutral-50)}
    .small{font-size:14px}
    .mono{font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

    .app-header{border-bottom:1px solid var(--neutral-30)}
    .header-inner{
      max-width:var(--content);margin:auto;padding:14px var(--gutter);
      display:flex;align-items:center;justify-content:space-between;gap:18px
    }
    .brand{display:flex;align-items:center;gap:12px;font-weight:700;min-width:0}
    .brand-mark{
      width:34px;height:34px;border:2px solid var(--neutral-90);
      display:grid;place-items:center;flex:0 0 auto;
      font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px
    }
    .brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-nav{display:flex;gap:18px;color:var(--neutral-50);font-size:14px}
    .header-nav [aria-current="page"]{color:var(--neutral-90);font-weight:700}
    .user-chip{border:1px solid var(--neutral-30);border-radius:999px;padding:6px 12px}
    .offline-banner{
      border-bottom:1px solid var(--neutral-90);background:var(--neutral-10);
      padding:10px var(--gutter);text-align:center;font-weight:700
    }

    main{max-width:var(--content);margin:auto;padding:32px var(--gutter) 64px;outline:none}
    .breadcrumbs{margin-bottom:22px;color:var(--neutral-50);font-size:14px}
    .breadcrumb-button{
      border:0;padding:0;background:transparent;color:inherit;text-decoration:underline;cursor:pointer
    }
    .page-heading{margin-bottom:24px}
    .heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
    .lede{margin:0;max-width:780px;color:var(--neutral-50)}

    .btn{
      min-height:44px;border:1px solid var(--neutral-90);border-radius:var(--radius);
      background:var(--surface);padding:10px 16px;font-weight:650;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none
    }
    .btn:hover:not(:disabled){background:var(--neutral-10)}
    .btn-primary{background:var(--neutral-90);color:var(--surface)}
    .btn-primary:hover:not(:disabled){background:var(--neutral-70)}
    .btn-quiet{border-color:var(--neutral-30);font-weight:500}
    .btn-danger{border-width:2px}
    .btn:disabled{cursor:not-allowed;background:var(--neutral-10);color:var(--neutral-50);border-color:var(--neutral-30)}
    .button-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}

    .filters{
      border:1px solid var(--neutral-30);padding:18px;margin-bottom:18px;
      display:grid;grid-template-columns:repeat(3,minmax(170px,1fr)) auto;gap:14px;align-items:end
    }
    .field{min-width:0}
    .field label,.field-label{display:block;margin-bottom:6px;font-size:14px;font-weight:700}
    .required::after{content:" *"}
    .control{
      width:100%;min-height:44px;border:1px solid var(--neutral-30);
      border-radius:var(--radius);background:var(--surface);padding:10px 12px
    }
    textarea.control{min-height:110px;resize:vertical}
    .control[readonly]{background:var(--neutral-10);color:var(--neutral-70)}
    .control[aria-invalid="true"]{border:2px solid var(--neutral-90)}
    .field-help{margin:6px 0 0;color:var(--neutral-50);font-size:13px}
    .field-error{margin:6px 0 0;font-size:13px;font-weight:700}
    .unit-wrap{position:relative}
    .unit-wrap .control{padding-right:52px}
    .unit-label{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      color:var(--neutral-50);font-size:13px;font-weight:700;pointer-events:none
    }

    .results-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
    .table-wrap{border:1px solid var(--neutral-30);overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--neutral-30);vertical-align:middle}
    th{
      background:var(--neutral-10);color:var(--neutral-70);
      font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;
      text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap
    }
    tbody tr:last-child td{border-bottom:0}
    .product-link{
      border:0;padding:0;background:transparent;color:var(--neutral-90);
      font-weight:700;text-align:left;text-decoration:underline;cursor:pointer
    }
    .status{
      display:inline-flex;align-items:center;gap:7px;border:1px solid var(--neutral-90);
      border-radius:999px;padding:4px 9px;font-size:13px;font-weight:700;white-space:nowrap
    }
    .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--neutral-90)}
    .status.draft::before{background:var(--neutral-50)}
    .status.inactive{border-style:dashed}
    .row-actions{display:flex;gap:8px;justify-content:flex-end}
    .row-actions .btn{min-height:36px;padding:6px 10px;font-size:13px}
    .mobile-list{display:none}
    .product-card{border:1px solid var(--neutral-30);padding:16px;margin-bottom:12px}
    .product-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
    .compact-box{border:1px solid var(--neutral-30);background:var(--neutral-10);padding:10px}
    .compact-label{display:block;color:var(--neutral-50);font-size:12px;margin-bottom:2px}
    .compact-value{font-weight:700}

    .panel{border:1px solid var(--neutral-30);padding:22px;background:var(--surface)}
    .panel+.panel{margin-top:16px}
    .panel-heading{margin-bottom:18px}
    .panel-heading p{margin:6px 0 0;color:var(--neutral-50)}
    .form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px 22px}
    .span-12{grid-column:span 12}
    .span-8{grid-column:span 8}
    .span-6{grid-column:span 6}
    .span-4{grid-column:span 4}
    .span-3{grid-column:span 3}

    .radio-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .radio-card{
      min-height:86px;border:1px solid var(--neutral-30);padding:14px;
      display:flex;align-items:flex-start;gap:10px;cursor:pointer
    }
    .radio-card:has(input:checked){border:2px solid var(--neutral-90)}
    .radio-card input{margin-top:4px}

    .readonly-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .readonly-box{border:1px solid var(--neutral-30);background:var(--neutral-10);padding:12px;min-height:72px}
    .readonly-label{display:block;color:var(--neutral-50);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .readonly-value{display:block;margin-top:5px;font-weight:700;overflow-wrap:anywhere}

    .tag{display:inline-block;border:1px solid var(--neutral-30);padding:2px 7px;font-size:12px}
    .upload-box{border:1px dashed var(--neutral-50);background:var(--neutral-10);padding:18px}
    .image-preview{display:flex;align-items:center;gap:12px;margin-top:14px}
    .image-placeholder{
      width:76px;height:58px;border:1px solid var(--neutral-50);background:var(--surface);position:relative
    }
    .image-placeholder::before,.image-placeholder::after{
      content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:var(--neutral-50)
    }
    .image-placeholder::before{transform:rotate(31deg)}
    .image-placeholder::after{transform:rotate(-31deg)}

    .physical-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .physical-card{border:1px solid var(--neutral-30);background:var(--neutral-10);padding:12px}
    .physical-label{display:block;color:var(--neutral-50);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
    .physical-value{display:block;font-family:"Roboto Mono",ui-monospace,monospace;font-size:17px;font-weight:700}

    .notice{
      border:1px solid var(--neutral-90);padding:16px;display:flex;
      align-items:flex-start;gap:12px;background:var(--surface);margin-bottom:16px
    }
    .notice.error{border-width:2px}
    .notice-icon{
      width:26px;height:26px;min-width:26px;border:1px solid var(--neutral-90);
      border-radius:50%;display:grid;place-items:center;font-weight:800
    }
    .notice-title{margin:0 0 4px;font-weight:800}
    .notice p{margin-bottom:0}

    .actions-bar{
      margin-top:22px;padding-top:18px;border-top:1px solid var(--neutral-30);
      display:flex;align-items:center;justify-content:space-between;gap:12px
    }
    .detail-header{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--neutral-30)}
    .title-with-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .detail-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:22px;align-items:start}
    .definition-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
    .definition{padding:14px 0;border-bottom:1px solid var(--neutral-30)}
    .definition-label{color:var(--neutral-50);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .definition-value{margin-top:5px;font-weight:650;overflow-wrap:anywhere}
    .requirements,.meta-list{margin:0;padding:0;list-style:none}
    .requirements li,.meta-list li{padding:10px 0;border-bottom:1px solid var(--neutral-30)}
    .requirements li::before{display:inline-block;width:18px;margin-right:6px;font-weight:800}
    .requirements .met::before{content:"✓"}
    .requirements .missing::before{content:"—"}

    .empty-state,.global-state{
      border:1px solid var(--neutral-30);padding:50px 24px;text-align:center;background:var(--surface)
    }
    .empty-symbol{
      width:52px;height:52px;margin:0 auto 18px;border:2px solid var(--neutral-90);
      display:grid;place-items:center;font-weight:800
    }
    .empty-state p,.global-state p{max-width:620px;margin:12px auto 20px;color:var(--neutral-50)}
    .skeleton{height:16px;background:var(--neutral-10);margin:10px 0}
    .w30{width:30%}.w50{width:50%}.w80{width:80%}

    .error-summary{border:2px solid var(--neutral-90);padding:16px;margin-bottom:18px}
    .error-summary h2{font-size:20px}
    .error-summary ul{margin-bottom:0}

    .modal-backdrop{
      position:fixed;inset:0;z-index:50;display:grid;place-items:center;
      padding:20px;background:rgba(17,24,39,.5)
    }
    .modal{
      width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;
      border:2px solid var(--neutral-90);background:var(--surface);padding:24px
    }
    .modal-actions{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
    .toast{
      position:fixed;right:24px;bottom:24px;z-index:70;max-width:430px;
      border:1px solid var(--neutral-90);background:var(--surface);padding:14px 16px
    }
    .sr-only{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0,0,0,0);white-space:nowrap;border:0
    }

    @media(max-width:900px){
      .header-nav{display:none}
      .filters{grid-template-columns:1fr 1fr}
      .filters .button-row{grid-column:1/-1}
      .desktop-table{display:none}
      .mobile-list{display:block}
      .detail-grid{grid-template-columns:1fr}
      .span-8,.span-6,.span-4,.span-3{grid-column:span 12}
      .readonly-grid{grid-template-columns:1fr}
      .physical-grid{grid-template-columns:1fr 1fr}
    }

    @media(max-width:600px){
      :root{--gutter:16px}
      main{padding-top:24px}
      .user-chip{display:none}
      .heading-row,.actions-bar{flex-direction:column;align-items:stretch}
      .heading-row .btn,.actions-bar .btn{width:100%}
      .filters{grid-template-columns:1fr}
      .filters .button-row{grid-column:auto}
      .radio-group{grid-template-columns:1fr}
      .definition-grid,.physical-grid,.card-grid{grid-template-columns:1fr}
      .button-row,.row-actions{display:grid;grid-template-columns:1fr;width:100%}
      .button-row .btn,.row-actions .btn{width:100%;min-height:44px}
      .panel{padding:16px}
      .modal{padding:18px}
      .modal-actions{flex-direction:column-reverse}
      .modal-actions .btn{width:100%}
      .toast{left:16px;right:16px;bottom:16px}
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">PO</div>
        <span class="brand-text">PO Productos y ofertas</span>
      </div>
      <nav class="header-nav" aria-label="Navegación principal">
        <span>Inicio</span>
        <span aria-current="page">Productos</span>
        <span>Ofertas</span>
      </nav>
      <span class="user-chip">Gestor comercial</span>
    </div>
  </header>

  <div id="offline-banner" class="offline-banner" role="status" hidden>
    Sin conexión. Los cambios no se guardarán hasta recuperar la conexión.
  </div>

  <main id="main" tabindex="-1"></main>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script>
  (() => {
    'use strict';

    const productTypes = [
      {
        id:'TP-01',
        name:'Calzado',
        attrs:[
          {name:'Material',type:'LISTA',mandatory:true,options:['Malla técnica','Cuero sintético','Textil']},
          {name:'Uso recomendado',type:'LISTA',mandatory:false,options:['Running','Entrenamiento','Casual']}
        ]
      },
      {
        id:'TP-02',
        name:'Accesorio',
        attrs:[
          {name:'Material',type:'LISTA',mandatory:false,options:['Acero','Plástico','Textil']}
        ]
      },
      {
        id:'TP-03',
        name:'Equipamiento',
        attrs:[]
      }
    ];

    const initialProducts = [
      {
        id:'p-001',
        name:'Zapatillas Running ProSpeed X',
        description:'Zapatillas deportivas para entrenamiento y carrera.',
        category:'Calzado',
        productTypeId:'TP-01',
        brand:'ProSpeed',
        price:329.90,
        sku:'ZAP-PSX',
        variants:true,
        status:'Activo',
        slug:'zapatillas-running-prospeed-x',
        attributes:{Material:'Malla técnica','Uso recomendado':'Running'},
        images:2,
        activeVariants:3,
        validRelations:true,
        pricingReady:true,
        inventoryReady:true,
        updated:'28/09/2026, 16:05',
        physical:null
      },
      {
        id:'p-002',
        name:'Botella térmica 750 ml',
        description:'Botella térmica deportiva de acero para hidratación.',
        category:'Accesorios',
        productTypeId:'TP-02',
        brand:'UrbanFit',
        price:79.90,
        sku:'BOT-750',
        variants:false,
        status:'Activo',
        slug:'botella-termica-750-ml',
        attributes:{Material:'Acero'},
        images:1,
        activeVariants:0,
        validRelations:true,
        pricingReady:true,
        inventoryReady:true,
        updated:'28/09/2026, 15:58',
        physical:{weight:0.42,length:8,width:8,height:27}
      },
      {
        id:'p-003',
        name:'Camiseta Training Core',
        description:'Camiseta deportiva para entrenamiento.',
        category:'Ropa deportiva',
        productTypeId:'TP-03',
        brand:'NorthPeak',
        price:69.90,
        sku:'CAM-CORE',
        variants:false,
        status:'Borrador',
        slug:'camiseta-training-core',
        attributes:{},
        images:0,
        activeVariants:0,
        validRelations:true,
        pricingReady:false,
        inventoryReady:true,
        updated:'28/09/2026, 15:41',
        physical:{weight:0.18,length:null,width:null,height:null}
      }
    ];

    const state = {
      products:initialProducts.map(p => ({
        ...p,
        attributes:{...p.attributes},
        physical:p.physical ? {...p.physical} : null
      })),
      screen:'list',
      selectedId:null,
      filters:{category:'',brand:'',status:''},
      listMode:'normal',
      errors:{},
      formDirty:false,
      saving:false,
      formDraft:null,
      formSelectedTypeId:'TP-01',
      duplicateConfirmed:false,
      modalReturn:null,
      toastTimer:null
    };

    const main = document.getElementById('main');
    const modalRoot = document.getElementById('modal-root');
    const toastEl = document.getElementById('toast');
    const announcer = document.getElementById('announcer');
    const offlineBanner = document.getElementById('offline-banner');

    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g,ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
    }[ch]));

    function announce(message){
      announcer.textContent='';
      setTimeout(() => announcer.textContent=message,20);
    }

    function toast(message){
      clearTimeout(state.toastTimer);
      toastEl.textContent=message;
      toastEl.hidden=false;
      state.toastTimer=setTimeout(() => toastEl.hidden=true,3400);
    }

    function getProductType(id){
      return productTypes.find(t => t.id === id) || null;
    }

    function currentProduct(){
      return state.products.find(p => p.id === state.selectedId) || null;
    }

    function statusClass(status){
      if(status === 'Borrador') return 'draft';
      if(status === 'Inactivo') return 'inactive';
      return 'active';
    }

    function statusBadge(status){
      return `<span class="status ${statusClass(status)}">${escapeHtml(status)}</span>`;
    }

    function breadcrumbs(items){
      return `<nav class="breadcrumbs" aria-label="Ruta de navegación">${
        items.map((item,index) => index === items.length-1
          ? `<span aria-current="page">${escapeHtml(item.label)}</span>`
          : `<button class="breadcrumb-button" type="button" data-action="${escapeHtml(item.action)}">${escapeHtml(item.label)}</button><span aria-hidden="true"> / </span>`
        ).join('')
      }</nav>`;
    }

    function pageHeading(title,description,action=''){
      return `<div class="page-heading">
        <div class="heading-row">
          <div>
            <h1>${escapeHtml(title)}</h1>
            <p class="lede">${escapeHtml(description)}</p>
          </div>
          ${action}
        </div>
      </div>`;
    }

    function navigate(screen,id=null){
      state.screen=screen;
      if(id !== null) state.selectedId=id;
      state.errors={};
      closeModal(false);
      render();
      main.focus();
    }

    function filteredProducts(){
      return state.products.filter(p =>
        (!state.filters.category || p.category === state.filters.category) &&
        (!state.filters.brand || p.brand === state.filters.brand) &&
        (!state.filters.status || p.status === state.filters.status)
      );
    }

    function render(){
      modalRoot.innerHTML='';

      if(state.screen === 'list') renderList();
      else if(state.screen === 'create') renderForm('create');
      else if(state.screen === 'edit') renderForm('edit');
      else if(state.screen === 'detail') renderDetail();
      else if(state.screen === 'no-permission') renderNoPermission();
      else if(state.screen === 'session-expired') renderSessionExpired();
      else if(state.screen === 'conflict') renderConflict();
      else renderNotFound();
    }

    function renderList(){
      const products=filteredProducts();

      main.innerHTML=`
        ${breadcrumbs([{label:'Productos'}])}
        ${pageHeading(
          'Productos',
          'Administra el ciclo de vida del catálogo y prepara cada producto para su publicación.',
          '<button class="btn btn-primary" type="button" data-action="new-product">Nuevo producto</button>'
        )}

        ${state.listMode === 'loading' ? renderLoadingList() :
          state.listMode === 'error' ? renderListError() :
          `
            <section class="filters" aria-label="Filtros de productos">
              <div class="field">
                <label for="filter-category">Categoría</label>
                <select id="filter-category" class="control" data-filter="category">
                  <option value="">Todas</option>
                  ${['Calzado','Ropa deportiva','Accesorios','Equipamiento'].map(v =>
                    `<option ${state.filters.category===v?'selected':''}>${escapeHtml(v)}</option>`
                  ).join('')}
                </select>
              </div>

              <div class="field">
                <label for="filter-brand">Marca</label>
                <select id="filter-brand" class="control" data-filter="brand">
                  <option value="">Todas</option>
                  ${['ProSpeed','NorthPeak','UrbanFit','Arena'].map(v =>
                    `<option ${state.filters.brand===v?'selected':''}>${escapeHtml(v)}</option>`
                  ).join('')}
                </select>
              </div>

              <div class="field">
                <label for="filter-status">Estado</label>
                <select id="filter-status" class="control" data-filter="status">
                  <option value="">Todos</option>
                  ${['Borrador','Activo','Inactivo'].map(v =>
                    `<option ${state.filters.status===v?'selected':''}>${escapeHtml(v)}</option>`
                  ).join('')}
                </select>
              </div>

              <div class="button-row">
                <button class="btn btn-quiet" type="button" data-action="clear-filters"
                  ${Object.values(state.filters).some(Boolean)?'':'disabled'}>
                  Limpiar filtros
                </button>
              </div>
            </section>

            ${state.products.length === 0
              ? renderEmptyList(false)
              : products.length === 0
                ? renderEmptyList(true)
                : renderProductList(products)
            }
          `
        }
      `;

      bindFilters();
    }

    function renderLoadingList(){
      return `<section class="panel" aria-label="Cargando productos">
        <div class="skeleton w30"></div>
        <div class="skeleton w80"></div>
        <div class="skeleton w50"></div>
        <div class="skeleton w80"></div>
      </section>`;
    }

    function renderListError(){
      return `<section class="global-state">
        <div class="empty-symbol" aria-hidden="true">!</div>
        <h2>No pudimos cargar los productos</h2>
        <p>La información no está disponible en este momento.</p>
        <button class="btn btn-primary" type="button" data-action="retry-list">Reintentar</button>
      </section>`;
    }

    function renderEmptyList(filtered){
      return `<section class="empty-state">
        <div class="empty-symbol" aria-hidden="true">${filtered?'0':'+'}</div>
        <h2>${filtered?'No hay productos que coincidan con estos filtros':'Aún no hay productos registrados'}</h2>
        <p>${filtered?'Prueba otra combinación o limpia los filtros.':'Registra el primer producto para comenzar el catálogo.'}</p>
        <button class="btn btn-primary" type="button" data-action="${filtered?'clear-filters':'new-product'}">
          ${filtered?'Limpiar filtros':'Nuevo producto'}
        </button>
      </section>`;
    }

    function renderProductList(products){
      const desktopRows=products.map(p => {
        const type=getProductType(p.productTypeId);
        return `<tr>
          <td><button class="product-link" type="button" data-action="view-product" data-id="${p.id}">${escapeHtml(p.name)}</button></td>
          <td class="mono">${escapeHtml(p.sku)}</td>
          <td>${escapeHtml(p.category)}</td>
          <td>${escapeHtml(type?.name || 'No disponible')}</td>
          <td>${escapeHtml(p.brand)}</td>
          <td>${p.variants?'Con variantes':'Simple'}</td>
          <td>${statusBadge(p.status)}</td>
          <td>
            <div class="row-actions">
              <button class="btn btn-quiet" type="button" data-action="view-product" data-id="${p.id}">Ver</button>
              <button class="btn btn-quiet" type="button" data-action="edit-product" data-id="${p.id}">Editar</button>
            </div>
          </td>
        </tr>`;
      }).join('');

      const mobileCards=products.map(p => `
        <article class="product-card">
          <div class="product-card-head">
            <div>
              <strong>${escapeHtml(p.name)}</strong>
              <div class="mono small">${escapeHtml(p.sku)}</div>
            </div>
            ${statusBadge(p.status)}
          </div>
          <div class="card-grid">
            <div class="compact-box">
              <span class="compact-label">Categoría</span>
              <span class="compact-value">${escapeHtml(p.category)}</span>
            </div>
            <div class="compact-box">
              <span class="compact-label">Modelo</span>
              <span class="compact-value">${p.variants?'Con variantes':'Simple'}</span>
            </div>
          </div>
          <div class="row-actions">
            <button class="btn btn-quiet" type="button" data-action="view-product" data-id="${p.id}">Ver</button>
            <button class="btn btn-quiet" type="button" data-action="edit-product" data-id="${p.id}">Editar</button>
          </div>
        </article>
      `).join('');

      return `
        <section aria-labelledby="results-title">
          <div class="results-head">
            <h2 id="results-title">Resultados</h2>
            <span class="muted small" aria-live="polite">${products.length} ${products.length===1?'producto':'productos'}</span>
          </div>

          <div class="desktop-table table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Producto</th>
                  <th scope="col">SKU base</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">Tipo</th>
                  <th scope="col">Marca</th>
                  <th scope="col">Modelo</th>
                  <th scope="col">Estado</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
              <tbody>${desktopRows}</tbody>
            </table>
          </div>

          <div class="mobile-list">${mobileCards}</div>
        </section>
      `;
    }

    function bindFilters(){
      main.querySelectorAll('[data-filter]').forEach(control => {
        control.addEventListener('change',() => {
          state.filters[control.dataset.filter]=control.value;
          renderList();
          announce(`${filteredProducts().length} productos encontrados.`);
        });
      });
    }

    function emptyPhysical(){
      return {weight:'',length:'',width:'',height:''};
    }

    function formDataFor(product){
      if(!product){
        return {
          name:'',description:'',category:'',productTypeId:state.formSelectedTypeId,
          brand:'',price:'',sku:'',variants:null,attributes:{},images:0,physical:emptyPhysical()
        };
      }

      return {
        name:product.name,
        description:product.description,
        category:product.category,
        productTypeId:product.productTypeId,
        brand:product.brand,
        price:product.price,
        sku:product.sku,
        variants:product.variants,
        attributes:{...product.attributes},
        images:product.images,
        physical:product.physical ? {
          weight:product.physical.weight ?? '',
          length:product.physical.length ?? '',
          width:product.physical.width ?? '',
          height:product.physical.height ?? ''
        } : emptyPhysical()
      };
    }

    function renderForm(mode){
      const editing=mode === 'edit';
      const product=editing ? currentProduct() : null;
      if(editing && !product) return renderNotFound();

      const data=state.formDraft || formDataFor(product);
      state.formDraft=data;

      const selectedTypeId=editing ? product.productTypeId : (data.productTypeId || state.formSelectedTypeId);
      const pType=getProductType(selectedTypeId);
      const errors=state.errors;

      main.innerHTML=`
        ${breadcrumbs([
          {label:'Productos',action:'back-list'},
          {label:editing?'Editar producto':'Nuevo producto'}
        ])}

        ${pageHeading(
          editing?'Editar producto':'Nuevo producto',
          editing
            ? 'Actualiza los datos permitidos. La identidad estructural se conserva.'
            : 'Completa los datos mínimos para guardar el producto como borrador.'
        )}

        ${Object.keys(errors).length ? renderErrorSummary(errors) : ''}

        <form id="product-form" novalidate>
          <section class="panel" aria-labelledby="general-title">
            <div class="panel-heading">
              <h2 id="general-title">Datos generales</h2>
              <p>Los campos con * son necesarios para guardar el borrador.</p>
            </div>

            <div class="form-grid">
              ${field('name','Nombre del producto','text',data.name,errors.name,'span-8',true)}
              ${field(
                'sku','SKU base','text',data.sku,errors.sku,'span-4',true,
                editing
                  ? 'Identificador comercial estable.'
                  : 'Para un producto simple, identifica directamente la unidad vendible.',
                editing
              )}

              <div class="field span-12">
                <label class="required" for="description">Descripción</label>
                <textarea class="control" id="description" name="description" aria-invalid="${errors.description?'true':'false'}">${escapeHtml(data.description)}</textarea>
                ${errorText('description',errors.description)}
              </div>

              ${field(
                'price','Precio base inicial','number',data.price,errors.price,'span-4',true,
                editing
                  ? 'Los cambios posteriores se administran desde Precios.'
                  : 'Se utilizará para preparar el precio inicial.',
                editing
              )}

              <div class="field span-4">
                <label class="required" for="category">Categoría</label>
                <select class="control" id="category" name="category" aria-invalid="${errors.category?'true':'false'}">
                  <option value="">Selecciona</option>
                  ${['Calzado','Ropa deportiva','Accesorios','Equipamiento'].map(v =>
                    `<option ${data.category===v?'selected':''}>${escapeHtml(v)}</option>`
                  ).join('')}
                  <option disabled>Outdoor — no disponible</option>
                </select>
                ${errorText('category',errors.category)}
              </div>

              <div class="field span-4">
                <label class="required" for="brand">Marca</label>
                <select class="control" id="brand" name="brand" aria-invalid="${errors.brand?'true':'false'}">
                  <option value="">Selecciona</option>
                  ${['ProSpeed','NorthPeak','UrbanFit','Arena'].map(v =>
                    `<option ${data.brand===v?'selected':''}>${escapeHtml(v)}</option>`
                  ).join('')}
                </select>
                ${errorText('brand',errors.brand)}
              </div>
            </div>
          </section>

          <section class="panel" aria-labelledby="classification-title">
            <div class="panel-heading">
              <h2 id="classification-title">Tipo de producto</h2>
              <p>Define las características disponibles para este producto.</p>
            </div>

            ${editing ? `
              <div class="readonly-box">
                <span class="readonly-label">Tipo de producto</span>
                <span class="readonly-value">${escapeHtml(pType?.name || 'No disponible')}</span>
                <input type="hidden" id="productTypeId" name="productTypeId" value="${escapeHtml(product.productTypeId)}">
                <p class="field-help">Un cambio estructural de tipo requiere un proceso específico y no se realiza desde esta edición.</p>
              </div>
            ` : `
              <div class="field">
                <label class="required" for="productTypeId">Tipo de producto</label>
                <select class="control" id="productTypeId" name="productTypeId" aria-invalid="${errors.productTypeId?'true':'false'}">
                  ${productTypes.map(t =>
                    `<option value="${t.id}" ${selectedTypeId===t.id?'selected':''}>${escapeHtml(t.name)}</option>`
                  ).join('')}
                </select>
                ${errorText('productTypeId',errors.productTypeId)}
              </div>
            `}
          </section>

          <section class="panel" aria-labelledby="model-title">
            <div class="panel-heading">
              <h2 id="model-title">Modelo de venta</h2>
            </div>

            ${editing ? `
              <div class="readonly-box">
                <span class="readonly-label">Modelo</span>
                <span class="readonly-value">${data.variants?'Producto con variantes':'Producto simple'}</span>
                <p class="field-help">Esta configuración no se modifica desde la edición ordinaria.</p>
              </div>
            ` : `
              <div class="radio-group" role="radiogroup" aria-describedby="model-help">
                <label class="radio-card">
                  <input type="radio" name="variants" value="false" ${data.variants===false?'checked':''}>
                  <span>
                    <strong>Producto simple</strong><br>
                    <span class="muted small">Se vende directamente mediante su SKU base.</span>
                  </span>
                </label>

                <label class="radio-card">
                  <input type="radio" name="variants" value="true" ${data.variants===true?'checked':''}>
                  <span>
                    <strong>Producto con variantes</strong><br>
                    <span class="muted small">Las unidades vendibles se administran como variantes.</span>
                  </span>
                </label>
              </div>
              <p id="model-help" class="field-help">La elección define cómo se administrarán las unidades vendibles.</p>
              ${errorText('variants',errors.variants)}
            `}
          </section>

          <section class="panel" aria-labelledby="attrs-title">
            <div class="panel-heading">
              <h2 id="attrs-title">Características del producto</h2>
              <p>Las obligatorias se exigirán al activar, no necesariamente al guardar el borrador.</p>
            </div>
            <div id="attrs-container">
              ${renderAttributes(pType,data,errors)}
            </div>
          </section>

          <section class="panel" aria-labelledby="images-title">
            <div class="panel-heading">
              <h2 id="images-title">Imágenes del producto</h2>
              <p>Opcionales para el borrador; se requiere al menos una para activar.</p>
            </div>
            <div class="upload-box">
              <strong id="image-count">${data.images ? `${data.images} ${data.images===1?'imagen asociada':'imágenes asociadas'}` : 'Aún no hay imágenes'}</strong>
              <input id="image-input" name="image" type="file" accept="image/*">
              <div id="image-preview" class="image-preview" ${data.images?'':'hidden'}>
                <span class="image-placeholder" aria-hidden="true"></span>
                <span>${data.images?'Imagen principal asociada':''}</span>
              </div>
            </div>
          </section>

          <div id="physical-section-host">
            ${physicalSection(data,errors)}
          </div>

          <div class="actions-bar">
            <button class="btn" type="button" data-action="cancel-form">Cancelar</button>
            <button class="btn btn-primary" type="submit" ${state.saving?'disabled':''}>
              ${state.saving?'Guardando…':editing?'Guardar cambios':'Guardar borrador'}
            </button>
          </div>
        </form>
      `;

      if(!editing){
        const typeSelect=document.getElementById('productTypeId');
        typeSelect?.addEventListener('change',() => {
          state.formSelectedTypeId=typeSelect.value;
          const snapshot=captureDraft();
          snapshot.productTypeId=typeSelect.value;
          snapshot.attributes={};
          state.formDraft=snapshot;
          renderForm('create');
        });

        document.querySelectorAll('input[name="variants"]').forEach(radio => {
          radio.addEventListener('change',() => {
            state.formDraft=captureDraft();
            state.formDraft.variants=radio.value === 'true';
            renderForm('create');
          });
        });
      }

      bindPhysicalWarning();
    }

    function renderAttributes(type,data,errors){
      if(!type || !type.attrs.length){
        return `<p class="muted">Este tipo de producto no tiene características asociadas.</p>`;
      }

      return `<div class="form-grid">${
        type.attrs.map(attr => {
          const value=data.attributes?.[attr.name] || '';
          const badge=`<span class="tag">${attr.mandatory?'Obligatoria':'Opcional'}</span>`;

          if(attr.type === 'LISTA'){
            return `<div class="field span-6">
              <label for="attr_${escapeHtml(attr.name)}">${escapeHtml(attr.name)} ${badge}</label>
              <select class="control" id="attr_${escapeHtml(attr.name)}" name="attr_${escapeHtml(attr.name)}">
                <option value="">Selecciona</option>
                ${attr.options.map(opt => `<option ${value===opt?'selected':''}>${escapeHtml(opt)}</option>`).join('')}
              </select>
            </div>`;
          }

          return `<div class="field span-6">
            <label for="attr_${escapeHtml(attr.name)}">${escapeHtml(attr.name)} ${badge}</label>
            <input class="control" id="attr_${escapeHtml(attr.name)}" name="attr_${escapeHtml(attr.name)}" value="${escapeHtml(value)}">
          </div>`;
        }).join('')
      }</div>`;
    }

    function physicalSection(data,errors){
      if(data.variants === true){
        return `<section class="panel" aria-labelledby="physical-variants-title">
          <div class="panel-heading">
            <h2 id="physical-variants-title">Datos físicos</h2>
          </div>
          <div class="notice" style="margin-bottom:0">
            <span class="notice-icon" aria-hidden="true">i</span>
            <div>
              <p class="notice-title">Se administran por variante</p>
              <p class="muted">Cada SKU puede tener peso y dimensiones diferentes. Completa esos datos desde la gestión de variantes.</p>
            </div>
          </div>
        </section>`;
      }

      if(data.variants !== false){
        return `<section class="panel" aria-labelledby="physical-pending-title">
          <div class="panel-heading">
            <h2 id="physical-pending-title">Datos físicos</h2>
            <p>Elige primero el modelo de venta para determinar dónde se administran.</p>
          </div>
        </section>`;
      }

      const p=data.physical || emptyPhysical();

      return `<section class="panel" aria-labelledby="physical-title">
        <div class="panel-heading">
          <h2 id="physical-title">Datos físicos para despacho</h2>
          <p>Registra el peso y las dimensiones propias de esta unidad. El empaque se define durante el despacho.</p>
        </div>

        <div class="form-grid">
          ${physicalField('physicalWeight','Peso','kg',p.weight,errors.physicalWeight)}
          ${physicalField('physicalLength','Largo','cm',p.length,errors.physicalLength)}
          ${physicalField('physicalWidth','Ancho','cm',p.width,errors.physicalWidth)}
          ${physicalField('physicalHeight','Alto','cm',p.height,errors.physicalHeight)}
        </div>

        <div id="physical-warning" class="notice" style="margin-top:16px" hidden>
          <span class="notice-icon" aria-hidden="true">i</span>
          <div>
            <p class="notice-title">Datos físicos incompletos</p>
            <p class="muted">Puedes completarlos después. Los campos vacíos permanecerán sin registrar.</p>
          </div>
        </div>
      </section>`;
    }

    function physicalField(id,label,unit,value,error){
      const shown=value === null || value === undefined ? '' : value;

      return `<div class="field span-3">
        <label for="${id}">${label}</label><div class="unit-wrap">
          <input class="control" id="${id}" name="${id}" type="number" inputmode="decimal"
            min="0" step="0.01" value="${escapeHtml(shown)}" ${error?'aria-invalid="true"':''}>
          <span class="unit-label">${unit}</span>
        </div>
        ${error ? `<p class="field-error">${escapeHtml(error)}</p>` : ''}
      </div>`;
    }

    function field(name,label,type,value,error,span,required,help='',readonly=false){
      return `<div class="field ${span}">
        <label class="${required?'required':''}" for="${name}">${label}</label>
        <input class="control" id="${name}" name="${name}" type="${type}"
          value="${escapeHtml(value)}"
          ${type==='number'?'step="0.01" min="0"':''}
          ${readonly?'readonly':''}
          ${error?'aria-invalid="true"':''}>
        ${help?`<p class="field-help">${escapeHtml(help)}</p>`:''}
        ${errorText(name,error)}
      </div>`;
    }

    function errorText(name,error){
      return error ? `<p class="field-error" id="${name}-error">${escapeHtml(error)}</p>` : '';
    }

    function bindPhysicalWarning(){
      const warning=document.getElementById('physical-warning');
      if(!warning) return;

      const ids=['physicalWeight','physicalLength','physicalWidth','physicalHeight'];

      const update=() => {
        const values=ids.map(id => document.getElementById(id)?.value.trim() || '');
        const count=values.filter(Boolean).length;
        warning.hidden = count === 0 || count === 4;
      };

      ids.forEach(id => document.getElementById(id)?.addEventListener('input',update));
      update();
    }

    function captureDraft(){
      const form=document.getElementById('product-form');
      if(!form) return state.formDraft || formDataFor(null);

      const fd=new FormData(form);
      const typeId=String(fd.get('productTypeId') || state.formSelectedTypeId);
      const type=getProductType(typeId);
      const attributes={};

      type?.attrs.forEach(attr => {
        const value=fd.get(`attr_${attr.name}`);
        if(value !== null && String(value).trim() !== '') attributes[attr.name]=String(value).trim();
      });

      const model=fd.get('variants');

      return {
        name:String(fd.get('name') || '').trim(),
        description:String(fd.get('description') || '').trim(),
        category:String(fd.get('category') || ''),
        productTypeId:typeId,
        brand:String(fd.get('brand') || ''),
        price:String(fd.get('price') || ''),
        sku:String(fd.get('sku') || '').trim().toUpperCase(),
        variants:model === null ? state.formDraft?.variants ?? null : model === 'true',
        attributes,
        images:state.formDraft?.images || currentProduct()?.images || 0,
        physical:{
          weight:String(fd.get('physicalWeight') || '').trim(),
          length:String(fd.get('physicalLength') || '').trim(),
          width:String(fd.get('physicalWidth') || '').trim(),
          height:String(fd.get('physicalHeight') || '').trim()
        }
      };
    }

    function validateForm(form,editing){
      const values=captureDraft();
      const errors={};

      if(!values.name) errors.name='Ingresa el nombre del producto.';
      if(!values.description) errors.description='Ingresa una descripción.';
      if(!values.category) errors.category='Selecciona una categoría disponible.';
      if(!values.productTypeId) errors.productTypeId='Selecciona un tipo de producto.';
      if(!values.brand) errors.brand='Selecciona una marca.';
      if(!values.price || Number(values.price) <= 0) errors.price='Ingresa un precio base válido.';
      if(!values.sku) errors.sku='Ingresa un SKU base.';
      if(values.variants === null) errors.variants='Indica si el producto será simple o manejará variantes.';

      const currentId=editing ? currentProduct()?.id : null;
      if(values.sku && state.products.some(p => p.id !== currentId && p.sku.toLowerCase() === values.sku.toLowerCase())){
        errors.sku='Este SKU base ya está en uso.';
      }

      if(values.variants === false){
        const physicalRules=[
          ['physicalWeight','weight','Ingresa un peso mayor que 0.'],
          ['physicalLength','length','Ingresa un largo mayor que 0.'],
          ['physicalWidth','width','Ingresa un ancho mayor que 0.'],
          ['physicalHeight','height','Ingresa un alto mayor que 0.']
        ];

        physicalRules.forEach(([errorKey,key,message]) => {
          const raw=values.physical[key];
          if(raw !== ''){
            const number=Number(raw);
            if(!Number.isFinite(number) || number <= 0) errors[errorKey]=message;
          }
        });
      }

      const duplicateNameBrand=values.name && values.brand && state.products.some(p =>
        p.id !== currentId &&
        p.name.toLowerCase() === values.name.toLowerCase() &&
        p.brand === values.brand
      );

      return {values,errors,duplicateNameBrand};
    }

    function renderErrorSummary(errors){
      return `<section class="error-summary" role="alert" tabindex="-1">
        <h2>Revisa los datos antes de continuar</h2>
        <ul>${Object.values(errors).map(error => `<li>${escapeHtml(error)}</li>`).join('')}</ul>
      </section>`;
    }

    function saveForm(form){
      const editing=state.screen === 'edit';
      const result=validateForm(form,editing);
      state.formDraft=result.values;
      state.errors=result.errors;

      if(Object.keys(result.errors).length){
        renderForm(editing?'edit':'create');
        announce('El formulario contiene errores.');
        return;
      }

      if(result.duplicateNameBrand && !state.duplicateConfirmed){
        state.modalReturn=document.querySelector('button[type="submit"]');
        renderDuplicateWarning(result.values,editing);
        return;
      }

      state.duplicateConfirmed=false;
      persistProduct(result.values,editing);
    }

    function renderDuplicateWarning(values,editing){
      modalRoot.innerHTML=`
        <div class="modal-backdrop">
          <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 id="modal-title" tabindex="-1">Posible producto duplicado</h2>
            <p>Ya existe un producto con el mismo nombre y marca.</p>
            <div class="notice" style="margin-top:16px">
              <span class="notice-icon" aria-hidden="true">i</span>
              <div>
                <p class="notice-title">${escapeHtml(values.name)}</p>
                <p class="muted">Puedes continuar si se trata de una referencia comercial diferente y su SKU es distinto.</p>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn" type="button" data-action="close-modal">Revisar</button>
              <button class="btn btn-primary" type="button" data-action="confirm-duplicate">Confirmar y continuar</button>
            </div>
          </section>
        </div>
      `;
      setTimeout(() => document.getElementById('modal-title')?.focus(),0);
    }

    function persistProduct(values,editing){
      if(!navigator.onLine){
        toast('No pudimos guardar los cambios. Revisa tu conexión.');
        return;
      }

      state.saving=true;
      renderForm(editing?'edit':'create');

      setTimeout(() => {
        if(editing){
          const p=currentProduct();
          p.name=values.name;
          p.description=values.description;
          p.category=values.category;
          p.brand=values.brand;
          p.attributes={...values.attributes};
          p.slug=slugify(values.name);
          if(!p.variants) p.physical=normalizePhysical(values.physical);
          p.updated=nowText();

          state.saving=false;
          state.formDirty=false;
          state.formDraft=null;
          navigate('detail',p.id);
          toast('Los cambios del producto fueron guardados.');
        }else{
          const id=`p-${String(state.products.length+1).padStart(3,'0')}`;

          const p={
            id,
            name:values.name,
            description:values.description,
            category:values.category,
            productTypeId:values.productTypeId,
            brand:values.brand,
            price:Number(values.price),
            sku:values.sku,
            variants:values.variants,
            status:'Borrador',
            slug:slugify(values.name),
            attributes:{...values.attributes},
            images:values.images || 0,
            activeVariants:0,
            validRelations:true,
            pricingReady:false,
            inventoryReady:false,
            updated:nowText(),
            physical:values.variants ? null : normalizePhysical(values.physical)
          };

          state.products.unshift(p);
          state.saving=false;
          state.formDirty=false;
          state.formDraft=null;
          state.selectedId=id;
          navigate('detail',id);
          toast('Producto guardado como borrador.');
        }
      },550);
    }

    function normalizePhysical(p){
      const conv=value => value === '' ? null : Number(value);
      return {
        weight:conv(p.weight),
        length:conv(p.length),
        width:conv(p.width),
        height:conv(p.height)
      };
    }

    function slugify(text){
      return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    }

    function nowText(){
      return new Date().toLocaleString('es-PE',{
        day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'
      });
    }

    function activationChecks(product){
      const type=getProductType(product.productTypeId);
      const mandatory=type ? type.attrs.filter(a => a.mandatory) : [];
      const missing=mandatory.filter(a => !String(product.attributes?.[a.name] || '').trim());

      return [
        {label:'Categoría disponible',met:product.validRelations},
        {label:'Tipo de producto disponible',met:Boolean(type)},
        {label:'Marca disponible',met:product.validRelations},
        {
          label:mandatory.length
            ? `Características obligatorias (${mandatory.map(a=>a.name).join(', ')})`
            : 'Características obligatorias (este tipo no exige ninguna)',
          met:missing.length===0
        },
        {label:'Al menos una imagen asociada',met:product.images>0},
        ...(product.variants ? [{label:'Al menos una variante activa',met:product.activeVariants>0}] : []),
        {label:'Precio preparado',met:Boolean(product.pricingReady)},
        {label:'Inventario inicializado',met:Boolean(product.inventoryReady)}
      ];
    }

    function physicalState(product){
      if(product.variants) return {key:'variants',label:'Por variante'};
      const p=product.physical || {};
      const values=[p.weight,p.length,p.width,p.height];
      const count=values.filter(v => v !== null && v !== undefined && v !== '').length;
      if(count===0) return {key:'none',label:'Sin registrar'};
      if(count===4) return {key:'complete',label:'Completo'};
      return {key:'partial',label:'Incompleto'};
    }

    function renderDetail(){
      const p=currentProduct();
      if(!p) return renderNotFound();

      const type=getProductType(p.productTypeId);
      const checks=activationChecks(p);
      const canActivate=checks.every(c=>c.met);
      const physical=physicalState(p);

      const stateAction=p.status==='Borrador'
        ? '<button class="btn btn-primary" type="button" data-action="request-status" data-status="Activo">Activar producto</button>'
        : p.status==='Inactivo'
          ? '<button class="btn btn-primary" type="button" data-action="request-status" data-status="Activo">Reactivar producto</button>'
          : '';

      const attrRows=type?.attrs?.length
        ? type.attrs.map(attr => {
            const value=p.attributes?.[attr.name];
            return `<tr>
              <td><strong>${escapeHtml(attr.name)}</strong></td>
              <td>${attr.mandatory?'<span class="tag">Obligatoria</span>':'<span class="tag">Opcional</span>'}</td>
              <td>${value?escapeHtml(value):'<span class="muted">Sin valor</span>'}</td>
            </tr>`;
          }).join('')
        : '<tr><td colspan="3" class="muted">Este tipo no tiene características asociadas.</td></tr>';

      main.innerHTML=`
        ${breadcrumbs([
          {label:'Productos',action:'back-list'},
          {label:p.name}
        ])}

        <section class="detail-header">
          <div class="heading-row">
            <div>
              <div class="title-with-status">
                <h1>${escapeHtml(p.name)}</h1>
                ${statusBadge(p.status)}
              </div>
              <p class="lede mono">${escapeHtml(p.sku)}</p>
            </div>

            <div class="button-row">
              ${stateAction}
              <button class="btn" type="button" data-action="edit-current">Editar</button>
              ${p.status==='Activo'
                ? '<button class="btn btn-danger" type="button" data-action="request-status" data-status="Inactivo">Desactivar</button>'
                : ''
              }
            </div>
          </div>
        </section>

        ${(p.status==='Borrador' || p.status==='Inactivo') && !canActivate ? `
          <div class="notice" role="status">
            <span class="notice-icon" aria-hidden="true">!</span>
            <div>
              <p class="notice-title">Hay requisitos pendientes para ${p.status==='Borrador'?'activar':'reactivar'}</p>
              <p class="muted">Consulta la lista de preparación antes de continuar.</p>
            </div>
          </div>
        ` : ''}

        <div class="detail-grid">
          <div>
            <section class="panel" aria-labelledby="product-data-title">
              <div class="panel-heading"><h2 id="product-data-title">Información del producto</h2></div>
              <div class="definition-grid">
                ${definition('Descripción',p.description)}
                ${definition('Categoría',p.category)}
                ${definition('Tipo de producto',type?.name || 'No disponible')}
                ${definition('Marca',p.brand)}
                ${definition('Precio base inicial',`S/ ${Number(p.price).toFixed(2)}`)}
                ${definition('Slug',`/producto/${p.slug}`,true)}
                ${definition('Modelo',p.variants?'Con variantes':'Producto simple')}
              </div>
            </section>

            <section class="panel" aria-labelledby="characteristics-title">
              <div class="panel-heading"><h2 id="characteristics-title">Características del producto</h2></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th scope="col">Característica</th><th scope="col">Condición</th><th scope="col">Valor</th></tr></thead>
                  <tbody>${attrRows}</tbody>
                </table>
              </div>
            </section>

            <section class="panel" aria-labelledby="images-detail-title">
              <div class="panel-heading">
                <h2 id="images-detail-title">Imágenes</h2>
                <p>${p.images ? `${p.images} ${p.images===1?'imagen registrada':'imágenes registradas'}` : 'Sin imágenes registradas.'}</p>
              </div>
              ${p.images ? `
                <div class="image-preview">
                  <span class="image-placeholder" aria-hidden="true"></span>
                  <span class="muted">Vista referencial de la imagen principal</span>
                </div>
              ` : ''}
            </section>

            ${p.variants ? renderVariantSummary(p) : renderPhysicalDetail(p)}
          </div>

          <aside>
            <section class="panel" aria-labelledby="requirements-title">
              <h2 id="requirements-title">Requisitos de activación</h2>
              <ul class="requirements">
                ${checks.map(c =>
                  `<li class="${c.met?'met':'missing'}">${escapeHtml(c.label)} — ${c.met?'Cumplido':'Pendiente'}</li>`
                ).join('')}
              </ul>

              ${!p.variants ? `
                <div class="notice" style="margin-top:16px;margin-bottom:0">
                  <span class="notice-icon" aria-hidden="true">i</span>
                  <div>
                    <p class="notice-title">Datos físicos: ${escapeHtml(physical.label)}</p>
                    <p class="muted">En esta versión no bloquean la activación por sí solos.</p>
                  </div>
                </div>
              ` : ''}
            </section>

            <section class="panel" aria-labelledby="preparation-title">
              <h2 id="preparation-title">Preparación para publicación</h2>
              <ul class="meta-list">
                <li>
                  <span class="muted small">Precio</span><br>
                  ${p.pricingReady?'<span class="status active">Listo</span>':'<span class="status draft">Pendiente</span>'}
                </li>
                <li>
                  <span class="muted small">Inventario</span><br>
                  ${p.inventoryReady?'<span class="status active">Listo</span>':'<span class="status draft">Pendiente</span>'}
                </li>
              </ul>
            </section>

            <section class="panel" aria-labelledby="admin-title">
              <h2 id="admin-title">Información administrativa</h2>
              <ul class="meta-list">
                <li><span class="muted small">Última modificación</span><br>${escapeHtml(p.updated)}</li>
                <li><span class="muted small">Datos físicos</span><br>${escapeHtml(physical.label)}</li>
              </ul>
            </section>
          </aside>
        </div>
      `;
    }

    function renderVariantSummary(p){
      return `<section class="panel" aria-labelledby="variants-title">
        <div class="panel-heading">
          <h2 id="variants-title">Variantes del producto</h2>
          <p>${p.activeVariants ? `${p.activeVariants} variantes activas registradas.` : 'Todavía no hay variantes activas.'}</p>
        </div>

        <div class="notice">
          <span class="notice-icon" aria-hidden="true">i</span>
          <div>
            <p class="notice-title">El peso y las dimensiones se mantienen por variante</p>
            <p class="muted">Cada SKU puede tener medidas diferentes, por eso el producto padre no tiene un perfil físico único.</p>
          </div>
        </div>

        <button class="btn" type="button" data-action="manage-variants">Gestionar variantes</button>
      </section>`;
    }

    function renderPhysicalDetail(p){
      const s=physicalState(p);

      return `<section class="panel" aria-labelledby="physical-detail-title">
        <div class="panel-heading">
          <h2 id="physical-detail-title">Datos físicos para despacho</h2>
          <p>Estas medidas describen el producto. El empaque final se define durante el despacho.</p>
        </div>

        ${s.key==='none' ? `
          <div class="notice">
            <span class="notice-icon" aria-hidden="true">i</span>
            <div>
              <p class="notice-title">Datos físicos sin registrar</p>
              <p class="muted">Puedes agregarlos desde Editar.</p>
            </div>
          </div>
        ` : `
          ${s.key==='partial' ? `
            <div class="notice">
              <span class="notice-icon" aria-hidden="true">i</span>
              <div>
                <p class="notice-title">Datos físicos incompletos</p>
                <p class="muted">Solo se muestran los valores realmente registrados.</p>
              </div>
            </div>
          ` : ''}

          <div class="physical-grid">
            ${physicalValue('Peso',p.physical?.weight,'kg')}
            ${physicalValue('Largo',p.physical?.length,'cm')}
            ${physicalValue('Ancho',p.physical?.width,'cm')}
            ${physicalValue('Alto',p.physical?.height,'cm')}
          </div>
        `}
      </section>`;
    }

    function physicalValue(label,value,unit){
      const shown=value === null || value === undefined ? 'No registrado' : `${value} ${unit}`;
      return `<div class="physical-card">
        <span class="physical-label">${escapeHtml(label)}</span>
        <span class="physical-value">${escapeHtml(shown)}</span>
      </div>`;
    }

    function definition(label,value,mono=false){
      return `<div class="definition">
        <div class="definition-label">${escapeHtml(label)}</div>
        <div class="definition-value ${mono?'mono':''}">${escapeHtml(value)}</div>
      </div>`;
    }

    function requestStatus(nextStatus,trigger){
      const p=currentProduct();
      if(!p) return;

      const operation=nextStatus==='Inactivo'
        ? 'desactivar'
        : p.status==='Inactivo'
          ? 'reactivar'
          : 'activar';

      if(nextStatus==='Activo'){
        const missing=activationChecks(p).filter(c => !c.met);
        if(missing.length){
          state.modalReturn=trigger;
          modalRoot.innerHTML=`
            <div class="modal-backdrop">
              <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <h2 id="modal-title" tabindex="-1">No se puede ${operation} el producto</h2>
                <p>Completa los siguientes requisitos antes de continuar:</p>
                <ul>${missing.map(item => `<li>${escapeHtml(item.label)}</li>`).join('')}</ul>

                ${!p.variants ? `
                  <div class="notice" style="margin-top:16px">
                    <span class="notice-icon" aria-hidden="true">i</span>
                    <div>
                      <p class="notice-title">Los datos físicos no forman parte de este bloqueo</p>
                      <p class="muted">Puedes completarlos después según la regla actual.</p>
                    </div>
                  </div>
                ` : ''}

                <div class="modal-actions">
                  <button class="btn btn-primary" type="button" data-action="close-modal">Entendido</button>
                </div>
              </section>
            </div>
          `;
          setTimeout(() => document.getElementById('modal-title')?.focus(),0);
          return;
        }
      }

      state.modalReturn=trigger;
      const content=operation==='desactivar'
        ? {
            title:'Desactivar producto',
            text:'El producto dejará de estar disponible para nuevas ventas. Su información y los pedidos históricos se conservarán.',
            action:'Desactivar producto'
          }
        : operation==='reactivar'
          ? {
              title:'Reactivar producto',
              text:'Se volverán a validar las condiciones de publicación antes de ponerlo disponible.',
              action:'Reactivar producto'
            }
          : {
              title:'Activar producto',
              text:'El producto quedará disponible para los canales cuando se confirme esta operación.',
              action:'Activar producto'
            };

      modalRoot.innerHTML=`
        <div class="modal-backdrop">
          <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 id="modal-title" tabindex="-1">${content.title}</h2>
            <p>${content.text}</p>
            <div class="notice" style="margin-top:16px">
              <span class="notice-icon" aria-hidden="true">i</span>
              <div>
                <p class="notice-title">${escapeHtml(p.name)}</p>
                <p class="muted mono">${escapeHtml(p.sku)}</p>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn" type="button" data-action="close-modal">Cancelar</button>
              <button class="btn ${operation==='desactivar'?'btn-danger':'btn-primary'}"
                type="button" data-action="confirm-status"
                data-next="${escapeHtml(nextStatus)}">
                ${content.action}
              </button>
            </div>
          </section>
        </div>
      `;

      setTimeout(() => document.getElementById('modal-title')?.focus(),0);
    }

    function confirmStatus(nextStatus){
      const p=currentProduct();
      if(!p) return;

      p.status=nextStatus;
      p.updated=nowText();
      closeModal();
      renderDetail();
      main.focus();

      const message=nextStatus==='Activo'
        ? 'Producto activo y disponible para los canales.'
        : 'Producto desactivado. Su historial se conserva.';

      toast(message);
      announce(message);
    }

    function closeModal(restoreFocus=true){
      if(!modalRoot.innerHTML) return;
      modalRoot.innerHTML='';
      if(restoreFocus && state.modalReturn?.focus) state.modalReturn.focus();
    }

    function renderNoPermission(){
      main.innerHTML=`<section class="global-state">
        <div class="empty-symbol" aria-hidden="true">!</div>
        <h1>No tienes permiso para realizar esta acción</h1>
        <p>Tu sesión no permite modificar productos.</p>
        <button class="btn btn-primary" type="button" data-action="back-list">Volver a productos</button>
      </section>`;
    }

    function renderSessionExpired(){
      main.innerHTML=`<section class="global-state">
        <div class="empty-symbol" aria-hidden="true">!</div>
        <h1>Tu sesión expiró</h1>
        <p>Inicia sesión nuevamente para continuar.</p>
        <button class="btn btn-primary" type="button" data-action="login">Iniciar sesión</button>
      </section>`;
    }

    function renderConflict(){
      main.innerHTML=`
        ${breadcrumbs([{label:'Productos',action:'back-list'},{label:'Datos actualizados'}])}
        ${pageHeading('El producto cambió mientras lo editabas','Recarga la información vigente antes de volver a guardar.')}
        <section class="panel">
          <div class="notice error">
            <span class="notice-icon" aria-hidden="true">!</span>
            <div>
              <p class="notice-title">Tus cambios no se guardaron</p>
              <p class="muted">Otra actualización modificó este producto.</p>
            </div>
          </div>
          <div class="actions-bar">
            <button class="btn" type="button" data-action="back-list">Volver</button>
            <button class="btn btn-primary" type="button" data-action="reload-product">Recargar producto</button>
          </div>
        </section>
      `;
    }

    function renderNotFound(){
      main.innerHTML=`
        <section class="global-state">
          <div class="empty-symbol" aria-hidden="true">?</div>
          <h1>Producto no encontrado</h1>
          <p>El producto pudo haber cambiado o ya no estar disponible.</p>
          <button class="btn btn-primary" type="button" data-action="back-list">Volver a productos</button>
        </section>
      `;
    }

    document.addEventListener('click',event => {
      const el=event.target.closest('[data-action]');
      if(!el) return;

      const action=el.dataset.action;

      if(action==='new-product'){
        state.formDirty=false;
        state.formDraft=null;
        state.formSelectedTypeId='TP-01';
        navigate('create');
      }else if(action==='view-product'){
        navigate('detail',el.dataset.id);
      }else if(action==='edit-product'){
        state.formDraft=null;
        navigate('edit',el.dataset.id);
      }else if(action==='edit-current'){
        state.formDraft=null;
        navigate('edit',state.selectedId);
      }else if(action==='back-list'){
        navigate('list');
      }else if(action==='clear-filters'){
        state.filters={category:'',brand:'',status:''};
        renderList();
      }else if(action==='retry-list'){
        state.listMode='loading';
        renderList();
        setTimeout(() => {
          state.listMode='normal';
          renderList();
          announce('Productos cargados.');
        },500);
      }else if(action==='cancel-form'){
        if(state.formDirty){
          state.modalReturn=el;
          modalRoot.innerHTML=`
            <div class="modal-backdrop">
              <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <h2 id="modal-title" tabindex="-1">¿Descartar cambios?</h2>
                <p>Los datos ingresados no se guardarán.</p>
                <div class="modal-actions">
                  <button class="btn" type="button" data-action="close-modal">Seguir editando</button>
                  <button class="btn btn-primary" type="button" data-action="discard-form">Descartar cambios</button>
                </div>
              </section>
            </div>
          `;
          setTimeout(() => document.getElementById('modal-title')?.focus(),0);
        }else{
          navigate(state.screen==='edit'?'detail':'list',state.selectedId);
        }
      }else if(action==='discard-form'){
        const target=state.screen==='edit'?'detail':'list';
        state.formDirty=false;
        state.formDraft=null;
        closeModal(false);
        navigate(target,state.selectedId);
      }else if(action==='request-status'){
        requestStatus(el.dataset.status,el);
      }else if(action==='confirm-status'){
        confirmStatus(el.dataset.next);
      }else if(action==='confirm-duplicate'){
        state.duplicateConfirmed=true;
        closeModal(false);
        const form=document.getElementById('product-form');
        if(form) saveForm(form);
      }else if(action==='close-modal'){
        closeModal();
      }else if(action==='manage-variants'){
        toast('Abriendo la gestión de variantes de este producto.');}else if(action==='reload-product'){
        navigate('detail',state.selectedId || state.products[0]?.id);
      }else if(action==='login'){
        toast('Redirigiendo al inicio de sesión.');
      }
    });

    document.addEventListener('change',event => {
      if(event.target.id==='image-input'){
        const file=event.target.files?.[0];
        if(file){
          const preview=document.getElementById('image-preview');
          if(preview){
            preview.hidden=false;
            preview.lastElementChild.textContent=file.name;
          }
          const count=document.getElementById('image-count');
          if(count) count.textContent='1 imagen seleccionada';
          state.formDraft=captureDraft();
          state.formDraft.images=Math.max(1,state.formDraft.images || 0);
        }
        state.formDirty=true;
      }else if(event.target.closest('#product-form')){
        state.formDirty=true;
      }
    });

    document.addEventListener('input',event => {
      if(event.target.closest('#product-form')) state.formDirty=true;
    });

    document.addEventListener('submit',event => {
      if(event.target.id!=='product-form') return;
      event.preventDefault();
      saveForm(event.target);
    });

    document.addEventListener('keydown',event => {
      const modal=modalRoot.querySelector('.modal');
      if(!modal) return;

      if(event.key==='Escape'){
        event.preventDefault();
        closeModal();
        return;
      }

      if(event.key==='Tab'){
        const items=[...modal.querySelectorAll(
          'button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])'
        )].filter(node => node.offsetParent !== null);

        if(!items.length) return;
        const first=items[0];
        const last=items[items.length-1];

        if(event.shiftKey && document.activeElement===first){
          event.preventDefault();last.focus();
        }else if(!event.shiftKey && document.activeElement===last){
          event.preventDefault();first.focus();
        }
      }
    });

    window.addEventListener('online',() => {
      offlineBanner.hidden=true;
      announce('Conexión recuperada.');
    });

    window.addEventListener('offline',() => {
      offlineBanner.hidden=false;
      announce('Sin conexión.');
    });

    function parseHash(){
      const hash=location.hash.replace('#','');
      state.listMode='normal';

      if(hash==='no-permission'){
        state.screen='no-permission';
      }else if(hash==='session-expired'){
        state.screen='session-expired';
      }else if(hash==='list-loading'){
        state.screen='list';
        state.listMode='loading';
      }else if(hash==='list-error'){
        state.screen='list';
        state.listMode='error';
      }else if(hash==='conflict'){
        state.screen='conflict';
        state.selectedId='p-002';
      }else if(hash==='producto-nuevo'){
        state.screen='create';
        state.formDraft=null;
      }else{
        const match=hash.match(/^producto-(p-\d+)-(detail|edit)$/);
        if(match){
          state.selectedId=match[1];
          state.screen=match[2];
          state.formDraft=null;
        }else{
          state.screen='list';
        }
      }

      render();
    }

    offlineBanner.hidden=navigator.onLine;
    window.addEventListener('hashchange',parseHash);
    parseHash();
  })();
  </script>
</body>
</html>
