<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de stock y disponibilidad</title>
<style>
:root{--surface:#fff;--n10:#f3f4f6;--n30:#d1d5db;--n50:#6b7280;--n90:#111827}
*{box-sizing:border-box}
html{background:var(--surface)}
body{margin:0;color:var(--n90);background:var(--surface);font:16px/1.5 Inter,system-ui,sans-serif}
button,input,select{font:inherit;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--n90);outline-offset:2px}
.top{border-bottom:1px solid var(--n30)}
.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}
.topin,.head,.actions,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700}.muted{color:var(--n50)}
.wrap{padding-top:32px;padding-bottom:64px}.head{align-items:flex-start}.head h1{font-size:clamp(28px,4vw,42px);line-height:1.1;margin:0 0 8px}
.btn{border:1px solid var(--n90);background:var(--surface);color:var(--n90);padding:10px 14px;border-radius:4px;cursor:pointer}
.btn.primary{background:var(--n90);color:var(--surface)}.btn:disabled{border-color:var(--n30);color:var(--n50);cursor:not-allowed}
.panel,.card,.notice{border:1px solid var(--n30);background:var(--surface);padding:16px;margin:16px 0}
.notice{border:2px solid var(--n90)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}
.field label,.label{display:block;font-weight:600;margin-bottom:6px}.input,select{width:100%;border:1px solid var(--n30);background:var(--surface);color:var(--n90);padding:9px 10px;border-radius:4px}
.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0 8px}.summary h2{margin:0;font-size:24px}
.tablewrap{overflow:auto;border:1px solid var(--n30)}table{border-collapse:collapse;width:100%;min-width:1030px}th,td{text-align:left;vertical-align:middle;padding:12px;border-bottom:1px solid var(--n30)}th{background:var(--n10);font-weight:600}tbody tr:last-child td{border-bottom:0}.status{display:inline-block;border:1px solid var(--n90);border-radius:999px;padding:3px 9px;white-space:nowrap}.sku{font-family:"Roboto Mono",monospace;font-size:13px}.cell-actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:none}.stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{border:1px solid var(--n30);padding:10px}.metric strong{display:block;font-size:22px;margin-top:2px}.small{font-size:14px}.empty{text-align:center;padding:40px 16px;border:1px solid var(--n30);margin-top:16px}.empty h2{margin-top:0}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.overlay.open{display:flex}.dialog{background:var(--surface);border:2px solid var(--n90);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:20px}.dialog h2{margin-top:0}.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{border-top:1px solid var(--n30);padding-top:16px;margin-top:16px}.feedback{min-height:24px;margin-top:8px}.skeleton{height:20px;background:var(--n10);margin:10px 0;border:1px solid var(--n30)}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .filter-action{align-self:end}.desktop{display:none}.cards{display:block}.head{display:block}.actions{margin-top:16px;justify-content:flex-start}.dialog-grid{grid-template-columns:1fr}}
@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin{display:block}.topin .muted{margin-top:4px}.filters{grid-template-columns:1fr}.actions,.row{flex-wrap:wrap}.actions .btn,.row .btn{width:100%}.stock-grid{grid-template-columns:1fr 1fr}.summary{display:block}.summary .muted{margin-top:4px}.dialog{width:100%;max-height:100vh;border-left:0;border-right:0}.cell-actions{display:grid;grid-template-columns:1fr}.card .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Inventario / Control de stock</div></div></header>
<main class="wrap" id="app"></main>
<div class="overlay" id="thresholdOverlay" role="dialog" aria-modal="true" aria-labelledby="thresholdTitle">
  <section class="dialog" tabindex="-1">
    <div class="row"><h2 id="thresholdTitle">Configurar umbrales</h2><button class="btn" type="button" data-close="thresholdOverlay">Cerrar</button></div>
    <div class="section" style="border-top:0;padding-top:0;margin-top:0">
      <h3>Umbral global</h3>
      <p class="muted">Se utilizará este valor en los productos que no tengan un umbral específico.</p>
      <div class="field"><label for="globalThreshold">Unidades</label><input class="input" id="globalThreshold" type="number" min="0" step="1"></div>
      <div class="feedback" id="globalFeedback" aria-live="polite"></div>
      <button class="btn primary" id="saveGlobal" type="button">Guardar umbral global</button>
    </div>
    <div class="section">
      <h3>Umbral específico</h3>
      <div class="field"><label for="skuThresholdSelect">SKU / producto</label><select id="skuThresholdSelect"></select></div>
      <div id="skuThresholdInfo" class="panel"></div>
      <div class="field"><label for="specificThreshold">Unidades</label><input class="input" id="specificThreshold" type="number" min="0" step="1"></div>
      <div class="feedback" id="specificFeedback" aria-live="polite"></div>
      <div class="row"><button class="btn primary" id="saveSpecific" type="button">Guardar umbral específico</button><button class="btn" id="useGlobal" type="button">Usar umbral global</button></div>
    </div>
  </section>
</div>
<div class="overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <section class="dialog" tabindex="-1">
    <div class="row"><h2 id="detailTitle">Detalle de saldo</h2><button class="btn" type="button" data-close="detailOverlay">Cerrar</button></div>
    <div id="detailBody"></div>
  </section>
</div>
<script>
const baseData=[
 {sku:'NK-AM-BLK-40',producto:'Nike Air Max negro 40',ubicacion:'Tienda San Isidro',fisico:10,reservado:3,umbralEspecifico:5},
 {sku:'NK-AM-BLK-41',producto:'Nike Air Max negro 41',ubicacion:'Tienda San Isidro',fisico:4,reservado:1,umbralEspecifico:null},
 {sku:'AD-RUN-WHT-42',producto:'Adidas Run blanco 42',ubicacion:'Almacén Central',fisico:18,reservado:3,umbralEspecifico:8},
 {sku:'PM-TR-BLU-40',producto:'Puma Trail azul 40',ubicacion:'Tienda Miraflores',fisico:3,reservado:1,umbralEspecifico:null},
 {sku:'AC-BOT-750',producto:'Botella deportiva 750 ml',ubicacion:'Almacén Central',fisico:0,reservado:0,umbralEspecifico:null}
];
let data=baseData.map(x=>({...x}));
let globalThreshold=5;
const ui={q:'',ubicacion:'todas',estado:'todos',selectedSku:data[0].sku};
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const disponible=x=>Math.max(x.fisico-x.reservado,0);
const umbral=x=>x.umbralEspecifico??globalThreshold;
const estado=x=>disponible(x)===0?'agotado':disponible(x)<=umbral(x)?'bajo':'disponible';
const estadoLabel=x=>estado(x)==='agotado'?'Agotado':estado(x)==='bajo'?'Stock bajo':'Disponible';
function filtered(){const q=ui.q.trim().toLowerCase();return data.filter(x=>(!q||x.sku.toLowerCase().includes(q)||x.producto.toLowerCase().includes(q))&&(ui.ubicacion==='todas'||x.ubicacion===ui.ubicacion)&&(ui.estado==='todos'||estado(x)===ui.estado));}
function render(){
 const params=new URLSearchParams(location.search), demo=params.get('state');
 if(demo==='no-permission'){app.innerHTML='<h1>Control de stock y disponibilidad</h1><div class="notice"><strong>Acceso restringido</strong><p>No tienes permiso para consultar esta información.</p></div>';return;}
 if(demo==='loading'){app.innerHTML='<h1>Control de stock y disponibilidad</h1><section class="panel" aria-label="Cargando inventario"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>';return;}
 if(demo==='error'){app.innerHTML='<h1>Control de stock y disponibilidad</h1><div class="notice"><strong>No pudimos cargar el inventario.</strong><p>Intenta nuevamente.</p><button class="btn primary" id="retry">Reintentar</button></div>';document.getElementById('retry').onclick=()=>{history.replaceState({},'',location.pathname);render()};return;}
 if(demo==='empty'){app.innerHTML='<h1>Control de stock y disponibilidad</h1><div class="empty"><h2>Aún no hay existencias para mostrar</h2><p class="muted">Cuando se inicialicen SKU vendibles, aparecerán aquí por ubicación.</p></div>';return;}
 if(demo==='updated' && !window.__updatedApplied){data[0].reservado=5;window.__updatedApplied=true;}
 const rows=filtered(), locations=[...new Set(data.map(x=>x.ubicacion))];
 app.innerHTML=`<div class="head"><div><h1>Control de stock y disponibilidad</h1><p class="muted">Consulta existencias por SKU y ubicación y configura cuándo considerar stock bajo.</p></div><div class="actions"><button class="btn primary" id="openThresholds">Configurar umbrales</button></div></div>${demo==='updated'?'<div class="notice" role="status" aria-live="polite"><strong>Inventario actualizado.</strong> Los saldos visibles reflejan la información más reciente.</div>':''}<section class="panel filters" aria-label="Filtros de inventario"><div class="field"><label for="q">Buscar por SKU o producto</label><input class="input" id="q" value="${esc(ui.q)}" placeholder="Ej. NK-AM-BLK-40"></div><div class="field"><label for="location">Ubicación</label><select id="location"><option value="todas">Todas</option>${locations.map(l=>`<option value="${esc(l)}" ${ui.ubicacion===l?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label for="status">Estado</label><select id="status"><option value="todos">Todos</option><option value="disponible" ${ui.estado==='disponible'?'selected':''}>Disponible</option><option value="bajo" ${ui.estado==='bajo'?'selected':''}>Stock bajo</option><option value="agotado" ${ui.estado==='agotado'?'selected':''}>Agotado</option></select></div><div class="filter-action"><button class="btn" id="clearFilters">Limpiar filtros</button></div></section><div class="summary"><h2>Existencias</h2><div class="muted">${rows.length} ${rows.length===1?'resultado':'resultados'}</div></div>${rows.length?renderRows(rows):'<div class="empty"><h2>No se encontraron existencias con los filtros aplicados.</h2><button class="btn" id="emptyClear">Limpiar filtros</button></div>'}`;
 bindMain();
}
function renderRows(rows){return `<div class="desktop tablewrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Ubicación</th><th>Físico</th><th>Reservado</th><th>Disponible</th><th>Umbral</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="sku">${esc(x.sku)}</td><td>${esc(x.producto)}</td><td>${esc(x.ubicacion)}</td><td>${x.fisico}</td><td>${x.reservado}</td><td><strong>${disponible(x)}</strong></td><td>${umbral(x)}</td><td><span class="status">${estadoLabel(x)}</span></td><td><div class="cell-actions"><button class="btn" data-detail="${esc(x.sku)}">Ver detalle</button><button class="btn" data-threshold="${esc(x.sku)}">Configurar umbral</button></div></td></tr>`).join('')}</tbody></table></div><div class="cards">${rows.map(x=>`<article class="card"><div class="row"><div><strong>${esc(x.producto)}</strong><div class="sku">${esc(x.sku)}</div></div><span class="status">${estadoLabel(x)}</span></div><p class="muted">${esc(x.ubicacion)}</p><div class="stock-grid"><div class="metric"><span class="small">Físico</span><strong>${x.fisico}</strong></div><div class="metric"><span class="small">Reservado</span><strong>${x.reservado}</strong></div><div class="metric"><span class="small">Disponible</span><strong>${disponible(x)}</strong></div><div class="metric"><span class="small">Umbral</span><strong>${umbral(x)}</strong></div></div><div class="cell-actions"><button class="btn" data-detail="${esc(x.sku)}">Ver detalle</button><button class="btn" data-threshold="${esc(x.sku)}">Configurar umbral</button></div></article>`).join('')}</div>`}
function clearFilters(){ui.q='';ui.ubicacion='todas';ui.estado='todos';render()}
function bindMain(){
 document.getElementById('q').oninput=e=>{ui.q=e.target.value;render()};
 document.getElementById('location').onchange=e=>{ui.ubicacion=e.target.value;render()};
 document.getElementById('status').onchange=e=>{ui.estado=e.target.value;render()};
 document.getElementById('clearFilters').onclick=clearFilters;
 const ec=document.getElementById('emptyClear');if(ec)ec.onclick=clearFilters;
 document.getElementById('openThresholds').onclick=()=>openThresholds();
 document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));
 document.querySelectorAll('[data-threshold]').forEach(b=>b.onclick=()=>openThresholds(b.dataset.threshold));
}
function openThresholds(sku){if(sku)ui.selectedSku=sku;globalThresholdInput();populateSkuSelect();syncSpecific();openModal('thresholdOverlay','globalThreshold')}
function globalThresholdInput(){document.getElementById('globalThreshold').value=globalThreshold;document.getElementById('globalFeedback').textContent=''}
function populateSkuSelect(){const s=document.getElementById('skuThresholdSelect');s.innerHTML=data.map(x=>`<option value="${esc(x.sku)}" ${ui.selectedSku===x.sku?'selected':''}>${esc(x.sku)} — ${esc(x.producto)}</option>`).join('');s.onchange=e=>{ui.selectedSku=e.target.value;syncSpecific()}}
function syncSpecific(){const x=data.find(v=>v.sku===ui.selectedSku);document.getElementById('skuThresholdInfo').innerHTML=`<strong>${esc(x.producto)}</strong><div class="sku">${esc(x.sku)}</div><p>Umbral global: <strong>${globalThreshold}</strong><br>Umbral específico: <strong>${x.umbralEspecifico==null?'No configurado':x.umbralEspecifico}</strong><br>Umbral aplicado: <strong>${umbral(x)}</strong></p>`;document.getElementById('specificThreshold').value=x.umbralEspecifico??umbral(x);document.getElementById('useGlobal').disabled=x.umbralEspecifico==null;document.getElementById('specificFeedback').textContent=''}
document.getElementById('saveGlobal').onclick=()=>{const v=Number(document.getElementById('globalThreshold').value),f=document.getElementById('globalFeedback');if(!Number.isInteger(v)||v<0){f.textContent='El umbral debe ser un entero mayor o igual a 0.';return}globalThreshold=v;f.textContent='Umbral global actualizado.';syncSpecific();render()};
document.getElementById('saveSpecific').onclick=()=>{const v=Number(document.getElementById('specificThreshold').value),f=document.getElementById('specificFeedback');if(!Number.isInteger(v)||v<0){f.textContent='El umbral debe ser un entero mayor o igual a 0.';return}const x=data.find(vv=>vv.sku===ui.selectedSku);x.umbralEspecifico=v;f.textContent='Umbral específico actualizado.';syncSpecific();render()};
document.getElementById('useGlobal').onclick=()=>{const x=data.find(v=>v.sku===ui.selectedSku);x.umbralEspecifico=null;document.getElementById('specificFeedback').textContent='Este SKU volverá a utilizar el umbral global.';syncSpecific();render()};
function openDetail(sku){const x=data.find(v=>v.sku===sku);document.getElementById('detailBody').innerHTML=`<h3>${esc(x.producto)}</h3><p class="sku">${esc(x.sku)}</p><p class="muted">${esc(x.ubicacion)}</p><div class="stock-grid"><div class="metric"><span class="small">Físico</span><strong>${x.fisico}</strong></div><div class="metric"><span class="small">Reservado</span><strong>${x.reservado}</strong></div><div class="metric"><span class="small">Disponible</span><strong>${disponible(x)}</strong></div></div><div class="panel"><strong>Umbral: ${umbral(x)} · Estado: ${estadoLabel(x)}</strong></div><p>Las unidades reservadas están temporalmente comprometidas en pedidos y no se ofrecen como disponibles.</p><p class="muted">Este detalle es de solo lectura.</p>`;openModal('detailOverlay','detailTitle')}
let lastFocus=null;function openModal(id,focusId){lastFocus=document.activeElement;const o=document.getElementById(id);o.classList.add('open');setTimeout(()=>{const t=focusId?document.getElementById(focusId):o.querySelector('button,input,select');t&&t.focus()},0)}
function closeModal(id){const o=document.getElementById(id);o.classList.remove('open');lastFocus&&lastFocus.focus()}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.overlay.open');if(o)closeModal(o.id)}});
render();
</script>
</body>
</html>
