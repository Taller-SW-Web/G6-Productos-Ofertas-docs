<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reglas de venta cruzada y upselling</title><style>
:root{--a:#f3f4f6;--b:#d1d5db;--c:#d1d5db;--m:#6b7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;min-height:44px}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.btn{border:1px solid var(--k);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--k);color:#fff}.panel,.rec{border:1px solid var(--c);padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.wide{grid-column:1/-1}label,legend{font-weight:600}.input,select,textarea{width:100%;border:1px solid var(--c);padding:10px;background:#fff}.tablewrap{overflow:auto}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:left}th{background:var(--a)}.tag{border:1px solid var(--k);border-radius:999px;padding:2px 8px}.cards{display:none}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--k);padding:20px;width:min(600px,calc(100vw - 32px))}@media(max-width:900px){.grid{grid-template-columns:1fr}.desktop{display:none}.cards{display:block}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}}
</style></head><body><header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Productos / Reglas</div></div></header><main class="wrap" id="app"></main><div class="overlay" id="picker"><section class="dialog"><h2>Agregar producto</h2><select id="pick"></select><div class="row"><button class="btn" id="cancelPick">Cancelar</button><button class="btn primary" id="addPick">Agregar</button></div></section></div>
<div class="overlay" id="stateModal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="stateTitle"><h2 id="stateTitle">Cambiar estado</h2><p id="stateText"></p><div class="row"><button class="btn" id="stateCancel">Cancelar</button><button class="btn primary" id="stateConfirm">Confirmar</button></div></section></div><script>
const products=['Medias deportivas','Botella deportiva','Zapatillas Run Pro Max','Zapatillas Trail Elite'];let rules=[{name:'Complementos para running',type:'Cross-sell',origin:'Zapatillas Run Pro',priority:1,state:'Activa',items:[{name:'Medias deportivas',order:1,criterion:'',note:'',price:29.9,stock:42}]},{name:'Mejora de calzado',type:'Upsell',origin:'Zapatillas de running',priority:2,state:'Activa',items:[{name:'Zapatillas Run Pro Max',order:1,criterion:'Mayor rendimiento',note:'Amortiguación adicional.',price:349.9,stock:12}]}];const s={view:'list',i:null,form:null},app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function head(t,a=''){return `<div class="head"><h1>${t}</h1><div>${a}</div></div>`}function render(){s.view==='list'?list():s.view==='form'?form():detail()}function list(){app.innerHTML=head('Venta cruzada y upselling','<button class="btn primary" data-a="new">Crear regla</button>')+`<div class="desktop tablewrap"><table><thead><tr><th>Regla</th><th>Tipo</th><th>Origen</th><th>Prioridad</th><th>Estado</th><th></th></tr></thead><tbody>${rules.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${r.type==='Upsell'?'Upsell':'Cross-sell'}</td><td>${esc(r.origin)}</td><td>${r.priority}</td><td>${r.state==='Activa'?'Activa':'Inactiva'}</td><td><button class="btn" data-a="detail" data-i="${i}">Ver</button></td></tr>`).join('')}</tbody></table></div><div class="cards">${rules.map((r,i)=>`<article class="rec">${esc(r.name)}<br><button class="btn" data-a="detail" data-i="${i}">Ver</button></article>`).join('')}</div>`;bind()}function blank(){return{name:'',type:'Cross-sell',origin:'',priority:1,state:'Activa',items:[]}}function form(){const r=s.form,up=r.type==='Upsell';app.innerHTML=head(s.i===null?'Crear regla':'Editar regla')+`<form class="panel" id="form"><div class="grid"><div><label>Nombre</label><input class="input" id="name" value="${esc(r.name)}"></div><fieldset><legend>Tipo</legend><label><input type="radio" name="kind" value="Cross-sell" ${!up?'checked':''}> Cross-sell</label><label><input type="radio" name="kind" value="Upsell" ${up?'checked':''}> Upsell</label></fieldset><div><label>Origen</label><select id="origin"><option value="">Seleccionar</option><option ${r.origin==='Zapatillas Run Pro'?'selected':''}>Zapatillas Run Pro</option><option ${r.origin==='Zapatillas de running'?'selected':''}>Zapatillas de running</option></select></div><div><label>Prioridad</label><input class="input" id="prio" type="number" min="1" value="${r.priority}"></div><div class="wide"><div class="row"><h2>Recomendados</h2><button type="button" class="btn" data-a="add">Agregar</button></div>${r.items.map((x,i)=>`<article class="rec"><strong>${esc(x.name)}</strong><div class="grid"><div><label>Orden</label><input class="input ord" data-i="${i}" type="number" value="${x.order}"></div>${up?`<div><label>Criterio</label><select class="crit" data-i="${i}"><option value="">Seleccionar</option><option value="Mayor rendimiento" ${x.criterion==='Mayor rendimiento'?'selected':''}>Mayor rendimiento</option><option value="Mejor material" ${x.criterion==='Mejor material'?'selected':''}>Mejor material</option><option value="Mayor capacidad" ${x.criterion==='Mayor capacidad'?'selected':''}>Mayor capacidad</option><option value="Funcionalidad adicional" ${x.criterion==='Funcionalidad adicional'?'selected':''}>Funcionalidad adicional</option></select></div><div class="wide"><label>Justificación (opcional)</label><textarea class="note" data-i="${i}">${esc(x.note)}</textarea></div>`:''}</div></article>`).join('')}<div id="err"></div></div></div><div class="row"><button type="button" class="btn" data-a="back">Cancelar</button><button class="btn primary">Guardar</button></div></form>`;bind();document.querySelectorAll('input[name="kind"]').forEach(x=>x.onchange=e=>{sync();s.form.type=e.target.value;render()});document.getElementById('form').onsubmit=save}function sync(){if(s.view!=='form')return;s.form.name=document.getElementById('name').value;s.form.origin=document.getElementById('origin').value;s.form.priority=Number(document.getElementById('prio').value);document.querySelectorAll('.ord').forEach(x=>s.form.items[x.dataset.i].order=Number(x.value));document.querySelectorAll('.crit').forEach(x=>s.form.items[x.dataset.i].criterion=x.value);document.querySelectorAll('.note').forEach(x=>s.form.items[x.dataset.i].note=x.value)}function save(e){e.preventDefault();sync();if(!s.form.name||!s.form.origin||!s.form.items.length||(s.form.type==='Upsell'&&s.form.items.some(x=>!x.criterion))){document.getElementById('err').textContent='Completa los campos requeridos y selecciona criterio para cada Upsell.';return}if(s.i===null)rules.unshift(JSON.parse(JSON.stringify(s.form)));else rules[s.i]=JSON.parse(JSON.stringify(s.form));s.view='list';render()}function detail(){const r=rules[s.i];app.innerHTML=head(r.name,'<button class="btn" data-a="edit">Editar</button>')+`<section class="panel"><p>${r.type==='Upsell'?'Upsell':'Cross-sell'} · Prioridad ${r.priority}</p><p><strong>Estado:</strong> ${r.state}</p><div class="rec"><strong>Las recomendaciones no agregan ni reemplazan productos automáticamente.</strong></div>${[...r.items].sort((a,b)=>a.order-b.order).map(x=>`<article class="rec">${x.order}. <strong>${esc(x.name)}</strong><div>${x.stock} disponibles · S/ ${x.price.toFixed(2)}</div>${r.type==='Upsell'?`<div>Criterio: ${esc(x.criterion)}${x.note?' · '+esc(x.note):''}</div>`:''}</article>`).join('')}<div class="row"><button class="btn" data-a="back">Volver</button><button class="btn primary" data-a="toggle">${r.state==='Activa'?'Desactivar regla':'Activar regla'}</button></div></section>`;bind()}function bind(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,i=b.dataset.i!==undefined?Number(b.dataset.i):null;if(a==='new'){s.i=null;s.form=blank();s.view='form';render()}if(a==='detail'){s.i=i;s.view='detail';render()}if(a==='edit'){s.form=JSON.parse(JSON.stringify(rules[s.i]));s.view='form';render()}if(a==='back'){s.view='list';render()}if(a==='toggle'){const r=rules[s.i],next=r.state==='Activa'?'Inactiva':'Activa';stateTitle.textContent=next==='Inactiva'?'Desactivar regla':'Activar regla';stateText.textContent=next==='Inactiva'?'La regla dejará de participar en nuevas recomendaciones.':'La regla volverá a estar disponible para las recomendaciones.';stateModal.dataset.next=next;stateModal.classList.add('open')}if(a==='add'){sync();const used=s.form.items.map(x=>x.name);pick.innerHTML=products.filter(x=>!used.includes(x)&&x!==s.form.origin).map(x=>`<option>${esc(x)}</option>`).join('');picker.classList.add('open')}})}cancelPick.onclick=()=>picker.classList.remove('open');addPick.onclick=()=>{if(pick.value)s.form.items.push({name:pick.value,order:s.form.items.length+1,criterion:'',note:'',price:99.9,stock:10});picker.classList.remove('open');render()};stateCancel.onclick=()=>stateModal.classList.remove('open');stateConfirm.onclick=()=>{rules[s.i].state=stateModal.dataset.next;stateModal.classList.remove('open');render()};render();
</script></body></html>
