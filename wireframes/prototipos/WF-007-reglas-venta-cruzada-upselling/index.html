<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reglas de venta cruzada y upselling</title><style>
:root{--a:#f3f4f6;--b:#d1d5db;--c:#d1d5db;--m:#6b7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;min-height:44px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--k);outline-offset:2px}.error{display:block;font-weight:600}#err:focus{outline:3px solid var(--k)}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.btn{border:1px solid var(--k);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--k);color:#fff}.panel,.rec{border:1px solid var(--c);padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.wide{grid-column:1/-1}label,legend{font-weight:600}.input,select,textarea{width:100%;border:1px solid var(--c);padding:10px;background:#fff}.tablewrap{overflow:auto}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:left}th{background:var(--a)}.tag{border:1px solid var(--k);border-radius:999px;padding:2px 8px}.cards{display:none}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--k);padding:20px;width:min(600px,calc(100vw - 32px))}@media(max-width:900px){.grid{grid-template-columns:1fr}.desktop{display:none}.cards{display:block}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Productos / Reglas</div></div></header>
<main class="wrap" id="app"></main>
<div class="overlay" id="picker"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pickerTitle"><h2 id="pickerTitle">Agregar producto</h2><label for="pick">Producto recomendado</label><select id="pick"></select><p id="pickerEmpty" role="status"></p><div class="row"><button class="btn" id="cancelPick">Cancelar</button><button class="btn primary" id="addPick">Agregar</button></div></section></div>
<div class="overlay" id="stateModal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="stateTitle"><h2 id="stateTitle">Cambiar estado</h2><p id="stateText"></p><div class="row"><button class="btn" id="stateCancel">Cancelar</button><button class="btn primary" id="stateConfirm">Confirmar</button></div></section></div>
<script src="app.js"></script>
</body>
</html>
