<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de ofertas y promociones</title>
<style>
:root{--s:#fff;--n10:#f3f4f6;--n20:#D1D5DB;--n30:#d1d5db;--n50:#6b7280;--n70:#6B7280;--n90:#111827}
*{box-sizing:border-box}body{margin:0;color:var(--n90);background:#fff;font:16px/1.5 Inter,system-ui,sans-serif}
button,input,select{font:inherit;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--n90);outline-offset:2px}
.top{border-bottom:1px solid var(--n30)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin{display:flex;justify-content:space-between}.brand{font-weight:700}.crumb{color:var(--n50)}
.wrap{padding-top:32px;padding-bottom:64px}h1{font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 8px}h2{font-size:24px;margin:0 0 12px}h3{margin:0 0 6px}
.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.pagehead p{margin:0;color:var(--n50)}
.btn{border:1px solid var(--n90);background:#fff;border-radius:4px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--n90);color:#fff}.btn[disabled]{border-color:var(--n30);color:var(--n50);cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.panel{border:1px solid var(--n30);padding:16px;margin-bottom:16px}.toolbar,.formgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.toolbar .field{grid-column:span 3}.formgrid .field{grid-column:span 6}.formgrid .wide{grid-column:1/-1}
label,.legend{display:block;font-weight:600;margin-bottom:6px}.input,select{width:100%;border:1px solid var(--n30);border-radius:4px;background:#fff;padding:10px 12px}
.checkrow{display:grid;gap:8px}.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--n30);padding:12px}.check input{min-height:auto;margin-top:4px;accent-color:var(--n90)}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--n20);vertical-align:top}th{background:var(--n10);font-size:13px;color:var(--n70)}
.status,.badge{display:inline-block;border:1px solid var(--n70);border-radius:999px;padding:2px 8px;font-size:13px}.muted{color:var(--n50)}.small{font-size:13px}
.error{font-size:13px;font-weight:600;margin-top:5px}.invalid{border:2px solid var(--n90)}.notice{border:2px solid var(--n90);padding:14px;margin-bottom:16px}
.cards{display:none}.card{border:1px solid var(--n30);padding:16px;margin-bottom:12px}.card dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.card dt{font-size:12px;color:var(--n50)}.card dd{margin:0;font-weight:600}
.scope{border:1px solid var(--n30);padding:12px;max-height:300px;overflow:auto}.scope-group{padding:10px 0;border-bottom:1px solid var(--n20)}.scope-group:last-child{border-bottom:0}.skus{padding-left:26px;display:grid;gap:6px}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--n90);width:min(600px,calc(100vw - 32px));padding:20px}
.toast{position:fixed;right:16px;bottom:16px;border:2px solid var(--n90);background:#fff;padding:12px 16px;display:none}.toast.show{display:block}
@media(max-width:900px){.toolbar .field,.formgrid .field{grid-column:span 6}.desktop{display:none}.cards{display:block}}
@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.pagehead{display:block}.pagehead .row{margin-top:16px}.toolbar .field,.formgrid .field{grid-column:1/-1}.row>.btn{flex:1 1 100%}.card dl{grid-template-columns:1fr}.dialog .row{flex-direction:column}.dialog .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="crumb">Productos / Promociones</div></div></header>
<main class="wrap" id="app"></main>
<div class="overlay" id="confirm" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="ct"><h2 id="ct"></h2><p id="cc"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="cancelState">Cancelar</button><button class="btn primary" id="applyState">Confirmar</button></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const catalog=[
 {id:'p1',name:'Zapatillas Running',skus:[['RUN-39','Talla 39'],['RUN-40','Talla 40'],['RUN-41','Talla 41']]},
 {id:'p2',name:'Polo deportivo',skus:[['POL-S','Talla S'],['POL-M','Talla M'],['POL-L','Talla L']]},
 {id:'p3',name:'Casaca térmica',skus:[['CAS-M','Talla M'],['CAS-L','Talla L']]}
];
let promos=[
 {id:'pr1',name:'Semana Running',mode:'AUTOMATICA',type:'PORCENTAJE',value:15,state:'ACTIVA',start:'2026-09-20T00:00',end:'2026-10-05T23:59',priority:1,channels:['Marketplace','Chatbot','Retail'],combineOffer:false,combinePromo:false,combineCoupon:false,scope:['RUN-39','RUN-40','RUN-41'],lockedMode:true},
 {id:'pr2',name:'S/ 25 en Running 40',mode:'AUTOMATICA',type:'MONTO_FIJO',value:25,state:'INACTIVA',start:'2026-10-01T00:00',end:'2026-10-31T23:59',priority:2,channels:[],combineOffer:true,combinePromo:false,combineCoupon:true,scope:['RUN-40'],lockedMode:false},
 {id:'pr3',name:'Cupón lanzamiento polos',mode:'CUPON',type:'PORCENTAJE',value:10,state:'ACTIVA',start:'2026-09-25T00:00',end:'2026-10-10T23:59',priority:3,channels:['Marketplace'],combineOffer:false,combinePromo:false,combineCoupon:false,scope:['POL-S','POL-M','POL-L'],lockedMode:true}
];
const state={view:'list',current:null,edit:null};
const app=document.getElementById('app'),toast=document.getElementById('toast');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'});
const byId=id=>promos.find(p=>p.id===id);
function notify(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000)}
function head(t,c,a=''){return `<div class="pagehead"><div><h1>${t}</h1><p>${c}</p></div><div class="row">${a}</div></div>`}
function discount(p){return p.type==='PORCENTAJE'?`${p.value} %`:`S/ ${Number(p.value).toFixed(2)}`}
function mode(p){return p.mode==='AUTOMATICA'?'Automática':'Mediante cupón'}
function comb(p){const xs=[];if(p.combineOffer)xs.push('oferta vigente');if(p.combinePromo)xs.push('otra promoción');if(p.combineCoupon)xs.push('cupón');return xs.length?`Combina con ${xs.join(', ')}`:'Exclusiva'}
function channels(p){return p.channels.length?p.channels.join(', '):'Todos'}
function render(){
 if(location.hash==='#no-permission'){app.innerHTML=head('Ofertas y promociones','Administra campañas comerciales.')+`<div class="notice"><h3>Acceso restringido</h3><p>No tienes permiso para administrar promociones.</p></div>`;return}
 if(location.hash==='#session-expired'){app.innerHTML=head('Ofertas y promociones','Administra campañas comerciales.')+`<div class="notice"><h3>Sesión finalizada</h3><p>Ingresa nuevamente para continuar.</p></div>`;return}
 state.view==='list'?renderList():state.view==='form'?renderForm():renderDetail();bind()
}
function renderList(){
 const create=`<button class="btn primary" data-a="new">Crear promoción</button>`;
 if(location.hash==='#list-loading'){app.innerHTML=head('Ofertas y promociones','Administra beneficios promocionales.',create)+`<div class="panel">Cargando promociones…</div>`;return}
 const rows=promos.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${discount(p)}</td><td>${mode(p)}</td><td>${comb(p)}</td><td>${channels(p)}</td><td>${p.scope.length} SKU</td><td>${date(p.start)}<br><span class="muted small">hasta ${date(p.end)}</span></td><td><span class="status">${p.state==='ACTIVA'?'Activa':'Inactiva'}</span></td><td><button class="btn" data-a="detail" data-id="${p.id}">Ver detalle</button></td></tr>`).join('');
 const cards=promos.map(p=>`<article class="card"><strong>${esc(p.name)}</strong><dl><div><dt>Descuento</dt><dd>${discount(p)}</dd></div><div><dt>Modalidad</dt><dd>${mode(p)}</dd></div><div><dt>Estado</dt><dd>${p.state==='ACTIVA'?'Activa':'Inactiva'}</dd></div><div><dt>Combinación</dt><dd>${comb(p)}</dd></div></dl><button class="btn" data-a="detail" data-id="${p.id}">Ver detalle</button></article>`).join('');
 app.innerHTML=head('Ofertas y promociones','Administra beneficios, vigencia, alcance y combinabilidad.',create)+
 `<section class="toolbar panel"><div class="field"><label>Buscar</label><input class="input" placeholder="Ej. Semana Running"></div><div class="field"><label>Estado</label><select><option>Todos</option><option>Activas</option><option>Inactivas</option></select></div><div class="field"><label>Tipo</label><select><option>Todos</option><option>Porcentaje</option><option>Monto fijo</option></select></div><div class="field"><label>Modalidad</label><select><option>Todas</option><option>Automática</option><option>Mediante cupón</option></select></div></section>
 <div class="desktop tablewrap"><table><thead><tr><th>Promoción</th><th>Descuento</th><th>Modalidad</th><th>Combinación</th><th>Canales</th><th>Alcance</th><th>Vigencia</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="cards">${cards}</div>`;
}
function blank(){return{name:'',mode:'AUTOMATICA',type:'PORCENTAJE',value:'',state:'ACTIVA',start:'',end:'',priority:1,channels:['Marketplace','Chatbot','Retail'],combineOffer:false,combinePromo:false,combineCoupon:false,scope:[],lockedMode:false}}
function renderForm(){
 const p=state.edit, errors=validate(p,false);
 const scope=catalog.map(g=>{const all=g.skus.every(s=>p.scope.includes(s[0]));return `<div class="scope-group"><label><input type="checkbox" data-product="${g.id}" ${all?'checked':''}> <strong>${esc(g.name)}</strong></label><div class="skus">${g.skus.map(s=>`<label><input type="checkbox" data-sku="${s[0]}" ${p.scope.includes(s[0])?'checked':''}> <span>${esc(s[1])}</span> <span class="small muted">${esc(s[0])}</span></label>`).join('')}</div></div>`}).join('');
 app.innerHTML=head(state.current?'Editar promoción':'Crear promoción','Define condiciones comerciales de la campaña.')+
 `<section class="panel"><div class="formgrid">
 <div class="field"><label for="name">Nombre</label><input class="input ${errors.name?'invalid':''}" id="name" value="${esc(p.name)}"><div class="error">${esc(errors.name||'')}</div></div>
 <div class="field"><label for="mode">Modalidad</label><select id="mode" ${p.lockedMode?'disabled':''}><option value="AUTOMATICA" ${p.mode==='AUTOMATICA'?'selected':''}>Automática</option><option value="CUPON" ${p.mode==='CUPON'?'selected':''}>Mediante cupón</option></select>${p.lockedMode?`<div class="small muted">La modalidad ya no puede cambiarse. Crea una nueva promoción si necesitas otra modalidad.</div>`:''}</div>
 <div class="field"><label for="type">Tipo de descuento</label><select id="type"><option value="PORCENTAJE" ${p.type==='PORCENTAJE'?'selected':''}>Porcentaje</option><option value="MONTO_FIJO" ${p.type==='MONTO_FIJO'?'selected':''}>Monto fijo</option></select></div>
 <div class="field"><label for="value">Valor</label><input class="input ${errors.value?'invalid':''}" id="value" type="number" step="0.01" value="${esc(p.value)}"><div class="small muted">${p.type==='PORCENTAJE'?'Mayor que 0 y hasta 100 %.':'Se aplica una vez al subtotal elegible.'}</div><div class="error">${esc(errors.value||'')}</div></div>
 <div class="field"><label for="start">Inicio</label><input class="input" id="start" type="datetime-local" value="${esc(p.start)}"></div>
 <div class="field"><label for="end">Fin</label><input class="input ${errors.dates?'invalid':''}" id="end" type="datetime-local" value="${esc(p.end)}"><div class="error">${esc(errors.dates||'')}</div></div>
 <div class="field"><label for="priority">Prioridad</label><input class="input ${errors.priority?'invalid':''}" id="priority" type="number" min="1" step="1" value="${p.priority}"><div class="error">${esc(errors.priority||'')}</div></div>
 <div class="field"><label for="state">Estado</label><select id="state"><option value="ACTIVA" ${p.state==='ACTIVA'?'selected':''}>Activa</option><option value="INACTIVA" ${p.state==='INACTIVA'?'selected':''}>Inactiva</option></select></div>
 <div class="wide"><span class="legend">Canales</span><div class="checkrow"><label class="check"><input type="checkbox" data-channel="Marketplace" ${p.channels.includes('Marketplace')?'checked':''}><span>Marketplace</span></label><label class="check"><input type="checkbox" data-channel="Chatbot" ${p.channels.includes('Chatbot')?'checked':''}><span>Chatbot</span></label><label class="check"><input type="checkbox" data-channel="Retail" ${p.channels.includes('Retail')?'checked':''}><span>Retail</span></label></div><p class="small muted">Si no seleccionas canales, aplica a todos los canales soportados.</p></div>
 <div class="wide"><span class="legend">Política de combinación</span><div class="checkrow">
 <label class="check"><input type="checkbox" id="co" ${p.combineOffer?'checked':''}><span><strong>Combinar con oferta vigente del producto</strong><br><span class="small muted">Permite coexistir con una oferta vigente.</span></span></label>
 <label class="check"><input type="checkbox" id="cp" ${p.combinePromo?'checked':''}><span><strong>Combinar con otra promoción automática</strong></span></label>
 <label class="check"><input type="checkbox" id="cc" ${p.combineCoupon?'checked':''}><span><strong>Combinar con cupón</strong></span></label></div><p class="small muted">${comb(p)}</p></div>
 <div class="wide"><span class="legend">Alcance</span><p class="small muted">Selecciona el producto completo o SKUs específicos.</p><div class="scope">${scope}</div><div class="error">${esc(errors.scope||'')}</div></div>
 </div></section>
 <div class="row" style="justify-content:flex-end"><button class="btn" data-a="back">Cancelar</button><button class="btn primary" data-a="save">Guardar promoción</button></div>`;
}
function validate(p,strict=true){
 const e={};if(!p.name.trim())e.name='Ingresa un nombre.';
 const v=Number(p.value);if(p.type==='PORCENTAJE'&&(!(v>0)||v>100))e.value='Ingresa un porcentaje mayor que 0 y hasta 100.';
 if(p.type==='MONTO_FIJO'&&!(v>0))e.value='Ingresa un monto mayor que cero.';
 if(!p.start||!p.end||new Date(p.end)<=new Date(p.start))e.dates='El fin debe ser posterior al inicio.';
 if(!Number.isInteger(Number(p.priority))||Number(p.priority)<1)e.priority='Ingresa una prioridad válida.';
 if(!p.scope.length)e.scope='Selecciona al menos un producto o SKU.';
 return e;
}
function renderDetail(){
 const p=byId(state.current);if(!p){state.view='list';render();return}
 const scope=catalog.map(g=>{const ms=g.skus.filter(s=>p.scope.includes(s[0]));if(!ms.length)return'';return `<li><strong>${esc(g.name)}</strong>: ${ms.map(s=>esc(s[1])).join(', ')}</li>`}).join('');
 app.innerHTML=head(esc(p.name),'Detalle de configuración comercial.',`<button class="btn" data-a="back">Volver</button><button class="btn" data-a="edit" data-id="${p.id}">Editar</button>`)+
 `<section class="panel"><div class="row"><span class="status">${p.state==='ACTIVA'?'Activa':'Inactiva'}</span><span class="badge">${mode(p)}</span><span class="badge">${comb(p)}</span></div>
 <div class="formgrid" style="margin-top:16px"><div class="field"><span class="muted small">Descuento</span><h2>${discount(p)}</h2></div><div class="field"><span class="muted small">Prioridad</span><h2>${p.priority}</h2></div><div class="field"><span class="muted small">Vigencia</span><div>${date(p.start)} — ${date(p.end)}</div></div><div class="field"><span class="muted small">Canales</span><div>${channels(p)}</div></div><div class="wide"><h3>Alcance</h3><ul>${scope}</ul></div><div class="wide"><h3>Combinabilidad</h3><p>${comb(p)}</p></div></div></section>
 <div class="row"><button class="btn primary" data-a="state" data-id="${p.id}">${p.state==='ACTIVA'?'Desactivar':'Activar'} promoción</button></div>`;
}
function syncForm(){
 if(state.view!=='form')return;
 const p=state.edit;
 const q=id=>document.getElementById(id);
 p.name=q('name').value;p.mode=q('mode')?.value||p.mode;p.type=q('type').value;p.value=q('value').value;p.start=q('start').value;p.end=q('end').value;p.priority=Number(q('priority').value);p.state=q('state').value;
 p.combineOffer=q('co').checked;p.combinePromo=q('cp').checked;p.combineCoupon=q('cc').checked;
 p.channels=[...document.querySelectorAll('[data-channel]:checked')].map(x=>x.dataset.channel);
 p.scope=[...document.querySelectorAll('[data-sku]:checked')].map(x=>x.dataset.sku);
}
function bind(){
 app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='new'){state.current=null;state.edit=blank();state.view='form';render()}
  if(a==='detail'){state.current=id;state.view='detail';render()}
  if(a==='edit'){state.current=id;state.edit=JSON.parse(JSON.stringify(byId(id)));state.view='form';render()}
  if(a==='back'){state.view=state.current?'detail':'list';render()}
  if(a==='save'){syncForm();const e=validate(state.edit);if(Object.keys(e).length){renderForm();return}if(state.current){Object.assign(byId(state.current),state.edit)}else{state.edit.id='pr'+Date.now();promos.unshift(state.edit);state.current=state.edit.id}state.view='detail';notify('Promoción guardada.');render()}
  if(a==='state'){state.current=id;const p=byId(id);document.getElementById('ct').textContent=p.state==='ACTIVA'?'Desactivar promoción':'Activar promoción';document.getElementById('cc').textContent=p.state==='ACTIVA'?'Dejará de participar en nuevas evaluaciones. Los pedidos ya confirmados conservan el beneficio registrado.':'Participará cuando esté vigente y corresponda al alcance y canal configurados.';openConfirm()}
 });
 if(state.view==='form'){
  app.querySelectorAll('input,select').forEach(x=>x.addEventListener('change',()=>{syncForm();renderForm()}));
  app.querySelectorAll('[data-product]').forEach(cb=>cb.onchange=e=>{const g=catalog.find(x=>x.id===e.target.dataset.product);g.skus.forEach(s=>{const i=state.edit.scope.indexOf(s[0]);if(e.target.checked&&i<0)state.edit.scope.push(s[0]);if(!e.target.checked&&i>=0)state.edit.scope.splice(i,1)});renderForm()});
 }
}
function openConfirm(){const o=document.getElementById('confirm');o.classList.add('open');o.setAttribute('aria-hidden','false');document.getElementById('cancelState').focus()}
function closeConfirm(){const o=document.getElementById('confirm');o.classList.remove('open');o.setAttribute('aria-hidden','true')}
document.getElementById('cancelState').onclick=closeConfirm;
document.getElementById('applyState').onclick=()=>{const p=byId(state.current);p.state=p.state==='ACTIVA'?'INACTIVA':'ACTIVA';p.lockedMode=true;closeConfirm();notify('Estado actualizado.');render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeConfirm()});
render();
</script>
</body>
</html>
