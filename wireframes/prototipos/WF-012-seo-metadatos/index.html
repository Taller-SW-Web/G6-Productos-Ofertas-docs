<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WF-012 — Gestión de SEO y metadatos</title>
  <style>
    :root{
      --surface:#fff;
      --neutral-10:#f3f4f6;
      --neutral-20:#e5e7eb;
      --neutral-30:#d1d5db;
      --neutral-50:#6b7280;
      --neutral-70:#374151;
      --neutral-90:#111827;
      --radius:4px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--neutral-90);
      background:var(--surface);
    }
    *{box-sizing:border-box}
    html{min-width:320px}
    body{margin:0;background:var(--surface);font-size:16px;line-height:1.5}
    button,input,textarea{font:inherit;color:inherit}
    button{min-height:44px;cursor:pointer}
    button:disabled{cursor:not-allowed;color:var(--neutral-50);border-color:var(--neutral-30);background:var(--neutral-10)}
    a,button,input,select,textarea{outline-offset:3px}
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{outline:3px solid var(--neutral-90);outline-offset:2px}
    input[type="checkbox"], input[type="radio"]{accent-color:var(--neutral-90)}
    .app-shell{min-height:100vh}
    .topbar{border-bottom:1px solid var(--neutral-30);background:var(--surface)}
    .topbar-inner{max-width:1200px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700}
    .brand-mark{width:32px;height:32px;border:1px solid var(--neutral-90);display:grid;place-items:center;font-family:"Roboto Mono",monospace;font-size:11px}
    .brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .crumb{color:var(--neutral-50);font-size:14px}
    .page{max-width:1200px;margin:auto;padding:32px 24px 64px}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:32px}
    .page-header h1{font-size:clamp(24px, 4vw, 32px);line-height:1.15;margin:0 0 8px;font-weight:700}
    .page-header p{margin:0;color:var(--neutral-50);max-width:760px}
    h2{font-size:24px;line-height:1.2;margin:0 0 16px}
    h3{font-size:18px;line-height:1.3;margin:0 0 12px}
    .mono{font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.02em}
    .btn{border:1px solid var(--neutral-90);background:var(--surface);padding:10px 14px;border-radius:var(--radius);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
    .btn-primary{background:var(--neutral-90);color:var(--surface)}
    .btn-danger{background:var(--surface);border-style:double;border-width:3px}
    .btn-quiet{border-color:var(--neutral-30);font-weight:500}
    .button-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .button-row.end{justify-content:flex-end}
    .card{border:1px solid var(--neutral-30);background:var(--surface);padding:24px}
    .muted{color:var(--neutral-50)}
    .small{font-size:14px}
    .status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;border:1px solid var(--neutral-30);padding:4px 8px;border-radius:999px;background:var(--surface)}
    .status::before{content:"";width:8px;height:8px;border:1px solid var(--neutral-90);border-radius:50%;background:var(--surface)}
    .status.active::before{background:var(--neutral-90)}
    .status.off::before{background:transparent}
    .notice{border:1px solid var(--neutral-90);padding:16px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);margin-bottom:16px}
    .notice-icon{width:24px;height:24px;min-width:24px;border:1px solid var(--neutral-90);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
    .notice h3{font-size:16px;margin:0 0 4px}
    .notice p{margin:0;color:var(--neutral-70)}
    .notice.error{border-width:2px}
    .notice.warn{border-color:var(--neutral-30)}
    .toast{position:fixed;right:24px;bottom:24px;border:1px solid var(--neutral-90);background:var(--surface);padding:14px 16px;max-width:360px;z-index:80;display:none}
    .toast.show{display:block}

    .table-wrap{border:1px solid var(--neutral-30);overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--neutral-30);vertical-align:middle}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:600;color:var(--neutral-70);background:var(--neutral-10)}
    tbody tr:last-child td{border-bottom:0}
    .row-actions{display:flex;gap:4px;flex-wrap:wrap}
    .row-actions .btn{min-height:36px;padding:6px 9px;font-size:14px}
    .tag{border:1px solid var(--neutral-30);padding:2px 8px;font-size:12px;font-family:"Roboto Mono",monospace;font-weight:600;display:inline-block}
    .tag.strong{border-color:var(--neutral-90)}
    .tag.warn{border-color:var(--neutral-50)}
    .mobile-list{display:none}
    .seo-card{border:1px solid var(--neutral-30);padding:16px}
    .seo-card + .seo-card{margin-top:12px}
    .slug-cell{font-family:"Roboto Mono",monospace;font-size:13px}

    .section{border:1px solid var(--neutral-30);padding:24px;margin-bottom:16px}
    .field{margin-bottom:16px}
    .field:last-child{margin-bottom:0}
    label{display:block;font-weight:600;margin-bottom:6px}
    .hint{display:block;font-size:13px;color:var(--neutral-50);margin-top:5px}
    input[type="text"],textarea{width:100%;border:1px solid var(--neutral-30);background:var(--surface);padding:11px 12px;border-radius:var(--radius);min-height:44px}
    textarea{min-height:96px;resize:vertical}
    .field-error{display:block;color:var(--neutral-90);background:var(--neutral-10);border:1px solid var(--neutral-90);padding:8px 10px;margin-top:8px;font-size:13px;font-weight:600}
    .count-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:5px;flex-wrap:wrap}
    .count{font-family:"Roboto Mono",monospace;font-size:13px}
    .count.over{color:var(--neutral-90);font-weight:700;text-decoration:underline}
    .slug-suffix{display:inline-block;background:var(--neutral-10);border:1px solid var(--neutral-30);padding:2px 8px;font-size:12px}

    .preview{border:1px solid var(--neutral-30);padding:20px;background:var(--neutral-10)}
    .preview-title{color:var(--neutral-90);font-size:18px;line-height:1.3;text-decoration:underline}
    .preview-url{color:var(--neutral-50);font-size:13px;margin:2px 0 6px;word-break:break-all}
    .preview-desc{color:var(--neutral-70);font-size:14px;line-height:1.45}

    .codebox{border:1px solid var(--neutral-30);background:var(--neutral-10);padding:16px;overflow:auto;font-family:"Roboto Mono",monospace;font-size:13px;white-space:pre-wrap}
    .codebox .k{color:var(--neutral-70);font-weight:600}
    .endpoint-bar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
    .endpoint-bar input{flex:1;min-width:220px}

    .empty-state{border:1px solid var(--neutral-30);padding:48px 24px;text-align:center}
    .empty-state h2{margin-bottom:8px}
    .empty-state p{color:var(--neutral-50);margin:0 auto 20px;max-width:520px}
    .skeleton{border:1px solid var(--neutral-30);padding:16px}
    .sk-line{height:14px;background:var(--neutral-10);margin:8px 0}
    .sk-line.w30{width:30%}.sk-line.w50{width:50%}.sk-line.w80{width:80%}

    @media (max-width:900px){
      .desktop-table{display:none}
      .mobile-list{display:block}
      .page-header{align-items:stretch}
    }
    @media (max-width:600px){
      .topbar-inner{padding:12px 16px}
      .crumb{display:none}
      .page{padding:24px 16px 48px}
      .page-header{display:block;margin-bottom:24px}
      .page-header h1{font-size:28px}
      .page-header .button-row{margin-top:16px}
      .page-header .btn{width:100%}
      .section,.card{padding:16px}
      .row-actions,.button-row{display:grid;grid-template-columns:1fr;width:100%}
      .row-actions .btn,.button-row .btn{width:100%;min-height:44px}
      .endpoint-bar{display:grid}
      .endpoint-bar input{min-width:0}
      .toast{left:16px;right:16px;bottom:16px}
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="brand-mark" aria-hidden="true">PO</div><span class="brand-text">PO Productos y ofertas</span></div><div class="crumb">Productos / SEO</div>
    </div>
  </header>
  <main id="app" class="page" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /*
    Estados documentales de WF-012 que pueden inspeccionarse sin contaminar la UI:
      ?state=empty            -> listado vacío (S-01-E)
      ?state=list-error       -> error de carga (S-01-E)
      ?state=save-error       -> fallo al guardar (S-02-E), conserva datos y permite reintento
      ?state=no-permission    -> usuario sin permiso
      ?state=session-expired  -> sesión expirada
    No se muestran controles de prototipo para cambiar de estado o tamaño de pantalla.
  */

  const LIMIT_TITLE = 70;
  const LIMIT_DESC = 160;
  const DOMAIN = 'marketplace.ejemplo.com';

  let categories = [
    {id:'cat-calzado', name:'Calzado', slug:'calzado', configured:true, title:'Calzado deportivo | Tienda oficial', desc:'Encuentra calzado deportivo original para todo el año.', history:[]},
    {id:'cat-zapatillas', name:'Zapatillas', slug:'zapatillas', configured:true, title:'Zapatillas de running y urbanas con las mejores ofertas del año en el Marketplace online', desc:'Compara precios y tallas en zapatillas deportivas.', history:[]},
    {id:'cat-futbol', name:'Fútbol', slug:'futbol', configured:true, title:'Fútbol: balones y equipamiento', desc:'Todo para la cancha: balones, arcos y ropa.', history:[]},
    {id:'cat-botines', name:'Botines', slug:'botines', configured:true, title:'Botines de pasto sintético', desc:'Botines para todas las superficies, tallas disponibles.', history:[{old:'botin-antiguo', date:'2026-08-02'}]},
    {id:'cat-running-veloz', name:'Running veloz', slug:'running', configured:true, title:'Running veloz: rutas y calendario', desc:'', history:[]},
    {id:'cat-running', name:'Running', slug:null, configured:false, title:'', desc:'', history:[]}
  ];

  const state = {
    view:'list',
    editingId:null,
    historyId:null,
    loading:true,
    saving:false,
    saveErrorShown:false,
    queryState:new URLSearchParams(location.search).get('state') || ''
  };
  state.saveError = state.queryState==='save-error';

  const app = document.getElementById('app');
  const toast = document.getElementById('toast');
  let toastTimer = null;

  function escapeHtml(v){ return String(v ?? '').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch])); }
  function catById(id){ return categories.find(c=>c.id===id); }
  function showToast(message){ clearTimeout(toastTimer); toast.textContent=message; toast.classList.add('show'); toastTimer=setTimeout(()=>toast.classList.remove('show'),2800); }
  function statusBadge(configured){ return configured?'<span class="status active">Configurado</span>':'<span class="status off">Pendiente</span>'; }
  function normalize(str){
    return String(str||'')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/ñ/g,'n')
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');
  }
  function slugInUse(slug, ignoreId){
    return categories.some(c=>c.id!==ignoreId && c.configured && c.slug===slug);
  }
  function autoUnique(base, ignoreId){
    if(!slugInUse(base, ignoreId)) return base;
    let n=2;
    while(slugInUse(base+'-'+n, ignoreId)) n++;
    return base+'-'+n;
  }

  function renderGlobalState(){
    if(state.queryState==='no-permission'){
      app.innerHTML=`<div class="page-header"><div><h1>SEO por categoría</h1><p>Configura el slug y los metadatos SEO de cada categoría.</p></div></div><div class="notice error"><span class="notice-icon" aria-hidden="true">!</span><div><h3>No tienes permiso para administrar el SEO.</h3><p>Vuelve al módulo de productos o solicita acceso por el canal definido por tu organización.</p></div></div><button class="btn" data-action="safe-back">Volver a productos</button>`;
      return true;
    }
    if(state.queryState==='session-expired'){
      app.innerHTML=`<div class="page-header"><div><h1>SEO por categoría</h1><p>Configura el slug y los metadatos SEO de cada categoría.</p></div></div><div class="notice error"><span class="notice-icon" aria-hidden="true">!</span><div><h3>Tu sesión expiró.</h3><p>Inicia sesión nuevamente para continuar.</p></div></div><button class="btn btn-primary" data-action="login">Iniciar sesión</button>`;
      return true;
    }
    return false;
  }

  function renderList(){
    if(state.loading){
      app.innerHTML=`<div class="page-header"><div><h1>SEO por categoría</h1><p>Consulta el estado de configuración SEO de cada categoría y entra a editarla.</p></div></div><div class="skeleton"><div class="sk-line w30"></div><div class="sk-line w80"></div><div class="sk-line w50"></div></div>`;
      setTimeout(()=>{state.loading=false;render();},450);
      return;
    }
    if(categories.length===0){
      app.innerHTML=`<div class="page-header"><div><h1>SEO por categoría</h1><p>Consulta el estado de configuración SEO de cada categoría y entra a editarla.</p></div></div><div class="empty-state"><h2>Aún no hay categorías.</h2><p>La gestión de categorías ocurre en el módulo de categorías.</p></div>`;
      bindPage(); return;
    }
    const rows=categories.map(c=>`
      <tr>
        <td><strong>${escapeHtml(c.name)}</strong></td>
        <td class="slug-cell">${c.configured?escapeHtml(c.slug):'<span class="muted">Pendiente</span>'}</td>
        <td>${c.configured?(c.title?escapeHtml(c.title):'<span class="muted">—</span>'):'<span class="muted">—</span>'}</td>
        <td>${statusBadge(c.configured)}</td>
        <td><div class="row-actions">
          ${c.configured
            ?`<button class="btn btn-quiet" data-action="edit" data-id="${c.id}">Editar SEO</button>`
            :`<button class="btn" data-action="edit" data-id="${c.id}">Configurar SEO</button>`}
          <button class="btn btn-quiet" data-action="history" data-id="${c.id}">Ver historial</button>
        </div></td>
      </tr>`).join('');
    const cards=categories.map(c=>`
      <article class="seo-card">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
          <div><strong>${escapeHtml(c.name)}</strong><div class="slug-cell muted">${c.configured?escapeHtml(c.slug):'Pendiente'}</div></div>
          ${statusBadge(c.configured)}
        </div>
        <div class="small" style="margin:10px 0">${c.configured?escapeHtml(c.title||'Sin título'):'Sin metadatos'}</div>
        <div class="row-actions">
          ${c.configured?`<button class="btn btn-quiet" data-action="edit" data-id="${c.id}">Editar SEO</button>`:`<button class="btn" data-action="edit" data-id="${c.id}">Configurar SEO</button>`}
          <button class="btn btn-quiet" data-action="history" data-id="${c.id}">Ver historial</button>
        </div>
      </article>`).join('');
    app.innerHTML=`<div class="page-header">
        <div><h1>SEO por categoría</h1><p>Consulta el estado de configuración SEO de cada categoría y entra a editarla. Los límites recomendados son 70 y 160 caracteres.</p></div>
      </div>
      <div class="desktop-table table-wrap"><table>
        <thead><tr><th>Categoría</th><th>Slug</th><th>Meta-título</th><th>Configuración</th><th>Acciones</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="mobile-list">${cards}</div>`;
    bindPage();
  }

  function backBtn(to){
    return `<button class="btn" data-action="${to}">Volver</button>`;
  }

  function renderEditor(){
    const c=catById(state.editingId);
    if(!c){ showToast('La categoría no existe.'); state.view='list'; state.editingId=null; render(); return; }
    const slugVal=state.form?.slug ?? (c.slug??'');
    const titleVal=state.form?.title ?? c.title;
    const descVal=state.form?.desc ?? c.desc;
    const titleLen=titleVal.length, descLen=descVal.length;
    const used=slugInUse(slugVal, c.id);
    const slugNote=state.form?.autoSuffixed
      ?`<div class="notice" style="margin-top:10px"><span class="notice-icon" aria-hidden="true">i</span><div><h3>Se aplicó un sufijo.</h3><p>El slug generado ya estaba en uso, por lo que se guardó como <strong>${escapeHtml(state.form.slug)}</strong>.</p></div></div>`
      :'';
    const saveErr=state.saveErrorShown
      ?`<div class="notice error" role="alert"><span class="notice-icon" aria-hidden="true">!</span><div><h3>No pudimos guardar la configuración SEO.</h3><p>Se conservaron los datos del formulario. Revisa la conexión y reintenta; no se registraron duplicados.</p></div></div>`
      :'';
    app.innerHTML=`<div class="page-header">${backBtn('list')}<div style="flex:1"></div><div style="text-align:right">${statusBadge(c.configured)}</div></div>
      <h1>${escapeHtml(c.name)}</h1>
      <form id="seoForm" class="section" style="margin-top:0" novalidate>
        ${saveErr}
        <div class="field">
          <label for="seoSlug">Slug</label>
          <input type="text" id="seoSlug" value="${escapeHtml(slugVal)}" placeholder="ej. calzado-deportivo">
          <span id="slugError" class="field-error" style="display:none"></span>
          <span id="slugOk" class="hint" style="color:var(--neutral-90);font-weight:600;display:none">El slug está disponible.</span>
          ${slugNote}
          <span class="hint">Normalización automática: minúsculas, sin tildes ni espacios.</span>
          <button class="btn btn-quiet" type="button" id="regenerateBtn" style="margin-top:10px">Regenerar desde el nombre</button>
        </div>
        <div class="field">
          <label for="seoTitle">Meta-título</label>
          <input type="text" id="seoTitle" value="${escapeHtml(titleVal)}">
          <div class="count-row">
            <span class="hint" style="margin:0">Límite recomendado: ${LIMIT_TITLE} caracteres.</span>
            <span class="count" id="titleCount">${titleLen} / ${LIMIT_TITLE}</span>
          </div>
          <div id="titleWarn" class="field-error" style="display:${titleLen>LIMIT_TITLE?'block':'none'}">Superaste el límite recomendado de ${LIMIT_TITLE} caracteres.</div>
        </div>
        <div class="field">
          <label for="seoDesc">Meta-descripción</label>
          <textarea id="seoDesc">${escapeHtml(descVal)}</textarea>
          <div class="count-row">
            <span class="hint" style="margin:0">Límite recomendado: ${LIMIT_DESC} caracteres.</span>
            <span class="count" id="descCount">${descLen} / ${LIMIT_DESC}</span>
          </div>
          <div id="descWarn" class="field-error" style="display:${descLen>LIMIT_DESC?'block':'none'}">Superaste el límite recomendado de ${LIMIT_DESC} caracteres.</div>
        </div>
        <div class="field">
          <label>Vista previa del snippet</label>
          <div class="preview">
            <span class="preview-title">${escapeHtml(titleVal.slice(0,60))}</span><br>
            <span class="preview-url">${DOMAIN}/categoria/<span class="slug-cell">${escapeHtml(slugVal||'…')}</span></span>
            <div class="preview-desc">${escapeHtml(descVal.slice(0,160))}</div>
          </div>
        </div>
        <div class="button-row end">
          <button class="btn" type="button" data-action="list">Cancelar</button>
          <button class="btn btn-primary" type="submit" id="saveSeoBtn">Guardar</button>
        </div>
      </form>`;
    bindPage();
    bindEditor(c);
  }

  function bindEditor(c){
    const slugEl=document.getElementById('seoSlug');
    const slugError=document.getElementById('slugError');
    const slugOk=document.getElementById('slugOk');
    const titleEl=document.getElementById('seoTitle');
    const descEl=document.getElementById('seoDesc');

    function checkSlug(){
      const v=slugEl.value.trim();
      if(!v){ slugError.textContent='Ingresa un slug.'; slugError.style.display='block'; slugOk.style.display='none'; return true; }
      if(slugInUse(v, c.id)){
        slugError.textContent='El slug indicado ya está en uso.';
        slugError.style.display='block';
        slugOk.style.display='none';
        state.form.slug=v; state.form.autoSuffixed=false;
        return true;
      }
      slugError.style.display='none'; slugOk.style.display='block';
      return false;
    }
    function updateCounts(){
      const tl=titleEl.value.length, dl=descEl.value.length;
      const tc=document.getElementById('titleCount');
      const dc=document.getElementById('descCount');
      tc.textContent=`${tl} / ${LIMIT_TITLE}`; tc.classList.toggle('over',tl>LIMIT_TITLE);
      dc.textContent=`${dl} / ${LIMIT_DESC}`; dc.classList.toggle('over',dl>LIMIT_DESC);
      document.getElementById('titleWarn').style.display=tl>LIMIT_TITLE?'block':'none';
      document.getElementById('descWarn').style.display=dl>LIMIT_DESC?'block':'none';
      state.form.title=titleEl.value; state.form.desc=descEl.value;
    }
    function updatePreview(){
      document.querySelector('.preview-title').textContent=titleEl.value.slice(0,60);
      document.querySelector('.preview-url .slug-cell').textContent=slugEl.value.trim()||'…';
      document.querySelector('.preview-desc').textContent=descEl.value.slice(0,160);
      state.form.slug=slugEl.value.trim(); state.form.autoSuffixed=false;
    }
    slugEl.addEventListener('input',()=>{ slugOk.style.display='none'; slugError.style.display='none'; updatePreview(); });
    slugEl.addEventListener('blur',checkSlug);
    titleEl.addEventListener('input',updateCounts);
    descEl.addEventListener('input',updateCounts);
    document.getElementById('regenerateBtn').addEventListener('click',()=>{
      const base=normalize(c.name);
      const unique=autoUnique(base, c.id);
      slugEl.value=unique;
      state.form.slug=unique;
      state.form.autoSuffixed=unique!==base;
      slugOk.style.display='none';
      slugError.style.display='none';
      updatePreview();
      renderEditor();
      showToast(unique===base?'Slug regenerado desde el nombre.':'Slug generado con sufijo porque ya está en uso.');
    });
    document.getElementById('seoForm').addEventListener('submit',(e)=>{
      e.preventDefault();
      const manual=slugEl.value.trim();
      if(!manual){ slugError.textContent='Ingresa un slug.'; slugError.style.display='block'; slugEl.focus(); return; }
      if(slugInUse(manual, c.id)){
        slugError.textContent='El slug indicado ya está en uso.';
        slugError.style.display='block'; slugEl.focus(); return;
      }
      const prevSlug=c.configured?c.slug:null;
      state.saving=true;
      document.getElementById('saveSeoBtn').disabled=true;
      showToast('Guardando…');
      setTimeout(()=>{
        state.saving=false;
        if(state.saveError){
          state.saveError=false;
          state.saveErrorShown=true;
          state.form.slug=slugEl.value.trim();
          state.form.title=titleEl.value;
          state.form.desc=descEl.value;
          renderEditor();
          bindEditor(c);
          showToast('No se pudo guardar. Se conservaron tus datos.');
          return;
        }
        c.slug=manual;
        c.title=titleEl.value;
        c.desc=descEl.value;
        c.configured=true;
        if(prevSlug && prevSlug!==manual){
          c.history.push({old:prevSlug, date:new Date().toISOString().slice(0,10)});
          showToast('SEO guardado. Se registró la resolución permanente del slug anterior.');
        }else{
          showToast('SEO guardado.');
        }
        state.form=null; state.view='list'; state.editingId=null;
        render();
      },600);
    });
  }

  function renderHistory(){
    const c=catById(state.historyId);
    if(!c){ showToast('La categoría no existe.'); state.view='list'; state.historyId=null; render(); return; }
    const rows=c.history.map(h=>`
      <tr><td class="slug-cell">${escapeHtml(h.old)}</td><td><span class="tag strong">Redirección permanente</span></td><td class="slug-cell">→ ${escapeHtml(c.slug)}</td><td>${escapeHtml(h.date||'')}</td></tr>`).join('');
    const histMarkup=c.configured
      ?(c.history.length
        ?`<div class="table-wrap"><table><thead><tr><th>Slug anterior</th><th>Redirección</th><th>Nuevo slug</th><th>Fecha</th></tr></thead><tbody>${rows}</tbody></table></div>`
        :`<div class="notice" style="margin-top:16px"><span class="notice-icon" aria-hidden="true">i</span><div><h3>Sin historial.</h3><p>El slug actual nunca fue renombrado.</p></div></div>`)
      :`<div class="notice" style="margin-top:16px"><span class="notice-icon" aria-hidden="true">i</span><div><h3>Sin historial.</h3><p>La categoría aún no tiene SEO configurado.</p></div></div>`;
    app.innerHTML=`<div class="page-header">${backBtn('list')}<div style="flex:1"></div></div>
      <h1>Historial de slugs · ${escapeHtml(c.name)}</h1>
      <div class="section" style="margin-top:0">
        <div class="kv" style="border-top:0"><span class="mono muted">Slug actual</span><div class="slug-cell" style="font-size:16px;margin-top:4px">${c.configured?escapeHtml(c.slug):'<span class="muted">Pendiente</span>'}</div></div>
        ${histMarkup}
      </div>`;
    bindPage();
  }

  function bindPage(){
    app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{
      const action=e.currentTarget.dataset.action, id=e.currentTarget.dataset.id;
      if(action==='list'){ state.view='list'; state.editingId=null; state.historyId=null; state.form=null; render(); }
      else if(action==='edit'){ state.view='edit'; state.editingId=id; state.form=null; render(); }
      else if(action==='history'){ state.view='history'; state.historyId=id; render(); }
      else if(action==='safe-back'){ showToast('Redirigiendo al catálogo de productos...'); }
      else if(action==='login'){ state.queryState=''; state.loading=true; render(); showToast('Sesión restaurada correctamente.'); }
    }));
  }

  function openEditor(){
    const c=catById(state.editingId);
    if(!c){ return; }
    if(!state.form){
      state.form={slug:c.slug??'', title:c.title??'', desc:c.desc??'', autoSuffixed:false};
    }
  }

  function render(){
    if(renderGlobalState()){ bindPage(); return; }
    if(state.view==='edit'){ openEditor(); renderEditor(); return; }
    if(state.view==='history'){ renderHistory(); return; }
    renderList();
  }

  render();
})();
</script>
</body>
</html>
