<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de SEO y metadatos</title><style>
:root{--a:#f3f4f6;--b:#D1D5DB;--c:#d1d5db;--m:#6b7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}button,input,textarea{font:inherit;min-height:44px}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.btn{border:1px solid var(--k);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--k);color:#fff}.panel{border:1px solid var(--c);padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{font-weight:600;display:block}.input,textarea{width:100%;border:1px solid var(--c);padding:10px;background:#fff}.count{color:var(--m);font-size:13px}.over{font-weight:700;text-decoration:underline}.notice{border:2px solid var(--k);padding:14px;margin:12px 0}.tablewrap{overflow:auto}table{width:100%;min-width:650px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:left}th{background:var(--a)}.slug{font-family:monospace}.cards{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.desktop{display:none}.cards{display:block}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}}
</style></head><body><header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Productos / SEO</div></div></header><main class="wrap" id="app"></main><script>
const LT=70,LD=160;let cats=[{id:'cal',name:'Calzado',slug:'calzado',title:'Calzado deportivo | Tienda oficial',desc:'Encuentra calzado deportivo original.',history:[]},{id:'fut',name:'Fútbol',slug:'futbol',title:'Fútbol: balones y equipamiento',desc:'Todo para la cancha.',history:[]},{id:'bot',name:'Botines',slug:'botines',title:'Botines deportivos',desc:'Botines para distintas superficies.',history:[{old:'botin-antiguo',date:'2026-08-02'}]},{id:'run',name:'Running',slug:null,title:'',desc:'',history:[]}];const s={view:'list',id:null,form:null},app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function used(x,id){return cats.some(c=>c.id!==id&&c.slug===x)}function unique(b,id){let x=b,n=2;while(used(x,id))x=`${b}-${n++}`;return x}function head(t){return `<div class="head"><h1>${t}</h1></div>`}function render(){s.view==='list'?list():s.view==='edit'?edit():history()}function list(){app.innerHTML=head('SEO por categoría')+`<div class="desktop tablewrap"><table><thead><tr><th>Categoría</th><th>Slug</th><th>Meta-título</th><th></th></tr></thead><tbody>${cats.map(c=>`<tr><td>${esc(c.name)}</td><td class="slug">${c.slug||'Pendiente'}</td><td>${esc(c.title||'Pendiente')}</td><td><button class="btn" data-a="edit" data-id="${c.id}">${c.slug?'Editar':'Configurar'}</button> <button class="btn" data-a="history" data-id="${c.id}">Historial</button></td></tr>`).join('')}</tbody></table></div><div class="cards">${cats.map(c=>`<article class="panel"><strong>${esc(c.name)}</strong><div class="slug">${c.slug||'Pendiente'}</div><div class="row"><button class="btn" data-a="edit" data-id="${c.id}">Editar</button><button class="btn" data-a="history" data-id="${c.id}">Historial</button></div></article>`).join('')}</div>`;bind()}function edit(){const c=cats.find(x=>x.id===s.id),f=s.form;app.innerHTML=head('SEO · '+c.name)+`<section class="panel"><div class="grid"><div class="wide"><label>Slug</label><input class="input slug" id="slug" value="${esc(f.slug)}"><div id="err"></div><button class="btn" id="regen">Regenerar desde el nombre</button>${f.auto?`<div class="notice">Slug automático: <strong>/categoria/${esc(f.slug)}</strong>${f.slug!==norm(c.name)?'<br>Se aplicó un sufijo porque el slug base ya estaba en uso.':''}</div>`:''}</div><div class="wide"><label>Meta-título</label><input class="input" id="title" value="${esc(f.title)}"><div class="count ${f.title.length>LT?'over':''}" id="tc">${f.title.length} / ${LT}</div></div><div class="wide"><label>Meta-descripción</label><textarea id="desc">${esc(f.desc)}</textarea><div class="count ${f.desc.length>LD?'over':''}" id="dc">${f.desc.length} / ${LD}</div></div></div><div class="row"><button class="btn" data-a="back">Cancelar</button><button class="btn primary" id="save">Guardar SEO</button></div></section>`;slug.oninput=e=>{f.slug=e.target.value.trim();f.auto=false};title.oninput=e=>{f.title=e.target.value;tc.textContent=`${f.title.length} / ${LT}`;tc.classList.toggle('over',f.title.length>LT)};desc.oninput=e=>{f.desc=e.target.value;dc.textContent=`${f.desc.length} / ${LD}`;dc.classList.toggle('over',f.desc.length>LD)};regen.onclick=()=>{f.slug=unique(norm(c.name),c.id);f.auto=true;render()};save.onclick=()=>{const x=f.slug.trim();if(!x)return;if(used(x,c.id)&&!f.auto){err.textContent='El slug indicado ya está en uso.';return}const old=c.slug;c.slug=x;c.title=f.title;c.desc=f.desc;if(old&&old!==x)c.history.push({old,date:new Date().toISOString().slice(0,10)});s.view='list';render()};bind()}function history(){const c=cats.find(x=>x.id===s.id);app.innerHTML=head('Historial · '+c.name)+`<section class="panel"><p>Slug actual: <span class="slug">${c.slug||'Pendiente'}</span></p>${c.history.length?`<div class="tablewrap"><table><thead><tr><th>Slug anterior</th><th>Resuelve a</th><th>Fecha</th></tr></thead><tbody>${c.history.map(h=>`<tr><td class="slug">${esc(h.old)}</td><td class="slug">${esc(c.slug)}</td><td>${h.date}</td></tr>`).join('')}</tbody></table></div>`:'<p>Sin historial.</p>'}<div class="notice">Marketplace utiliza esta resolución para responder la redirección permanente en la URL pública.</div><button class="btn" data-a="back">Volver</button></section>`;bind()}function bind(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,id=b.dataset.id;if(a==='edit'){s.id=id;const c=cats.find(x=>x.id===id);s.form={slug:c.slug||unique(norm(c.name),c.id),title:c.title,desc:c.desc,auto:!c.slug};s.view='edit';render()}if(a==='history'){s.id=id;s.view='history';render()}if(a==='back'){s.view='list';render()}})}render();
</script></body></html>
