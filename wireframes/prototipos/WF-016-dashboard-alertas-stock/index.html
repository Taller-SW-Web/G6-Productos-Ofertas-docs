<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard analítico y alertas de stock</title><style>
:root{--a:#f3f4f6;--b:#D1D5DB;--c:#d1d5db;--m:#6b7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}input,select,button{font:inherit;min-height:44px}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:16px 0}.input,select{width:100%;border:1px solid var(--c);padding:10px;background:#fff}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi,.panel{border:1px solid var(--c);padding:16px;margin:12px 0}.kpi strong{font-size:28px}.notice{border:2px solid var(--k);padding:14px;margin:12px 0}.tablewrap{overflow:auto}table{width:100%;min-width:820px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:left}th{background:var(--a)}.status{border:1px solid var(--k);border-radius:999px;padding:2px 8px}.mono{font-family:monospace}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.filters,.kpis{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Inventario / Dashboard</div></div></header><main class="wrap" id="app"></main><script>
const data=[{product:'Nike Air Max',category:'Calzado',brand:'Nike',sku:'NK-40',loc:'CENTRAL',on:12,res:2,av:10,u:5},{product:'Nike Air Max',category:'Calzado',brand:'Nike',sku:'NK-41',loc:'CENTRAL',on:4,res:1,av:3,u:5},{product:'Nike Air Max',category:'Calzado',brand:'Nike',sku:'NK-42',loc:'SUR',on:0,res:0,av:0,u:5},{product:'Adidas Predator',category:'Calzado',brand:'Adidas',sku:'AD-42',loc:'CENTRAL',on:18,res:3,av:15,u:8},{product:'Puma Future',category:'Calzado',brand:'Puma',sku:'PM-40',loc:'SUR',on:3,res:1,av:2,u:4}];const s={q:'',loc:'all',status:'all'},app=document.getElementById('app');const state=x=>x.av===0?'out':x.av<=x.u?'low':'ok';const label=x=>x==='out'?'Agotado':x==='low'?'Stock bajo':'Disponible';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function filtered(){const q=s.q.toLowerCase();return data.filter(x=>(!q||[x.product,x.category,x.brand,x.sku].some(v=>v.toLowerCase().includes(q)))&&(s.loc==='all'||x.loc===s.loc)&&(s.status==='all'||state(x)===s.status))}function render(){const list=filtered(),counts={ok:0,low:0,out:0};list.forEach(x=>counts[state(x)]++);const alerts=list.filter(x=>state(x)!=='ok');const received=new URLSearchParams(location.search).get('state')==='event-received';const locs=[...new Set(data.map(x=>x.loc))];app.innerHTML=`<div class="head"><div><h1>Dashboard analítico y alertas de stock</h1><p class="muted">Monitoreo de inventario confirmado por SKU y ubicación.</p></div></div>${received?'<div class="notice" role="status">Inventario confirmó un cambio de stock. Los indicadores se recalcularon con el saldo vigente.</div>':''}<div class="filters"><input class="input" id="q" placeholder="Producto, categoría, marca o SKU" value="${esc(s.q)}"><select id="loc"><option value="all">Todas las ubicaciones</option>${locs.map(x=>`<option value="${x}" ${s.loc===x?'selected':''}>${x}</option>`).join('')}</select><select id="st"><option value="all">Todos los estados</option><option value="ok" ${s.status==='ok'?'selected':''}>Disponible</option><option value="low" ${s.status==='low'?'selected':''}>Stock bajo</option><option value="out" ${s.status==='out'?'selected':''}>Agotado</option></select></div><div class="kpis"><div class="kpi">SKUs vendibles<strong>${list.length}</strong></div><div class="kpi">Unidades disponibles<strong>${list.reduce((a,x)=>a+x.av,0)}</strong></div><div class="kpi">Disponibles<strong>${counts.ok}</strong></div><div class="kpi">Stock bajo<strong>${counts.low}</strong></div><div class="kpi">Agotados<strong>${counts.out}</strong></div></div><section class="panel" aria-labelledby="alertsTitle"><h2 id="alertsTitle">Alertas</h2>${alerts.length?`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Ubicación</th><th>Estado</th><th>Disponible</th><th>Umbral</th></tr></thead><tbody>${alerts.map(x=>`<tr><td class="mono">${esc(x.sku)}</td><td>${esc(x.product)}</td><td>${x.loc}</td><td><span class="status">${label(state(x))}</span></td><td>${x.av}</td><td>${x.u}</td></tr>`).join('')}</tbody></table></div>`:'<p>No hay alertas para los filtros seleccionados.</p>'}</section><section class="panel"><h2>Inventario por SKU</h2>${list.length?`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Ubicación</th><th>Físico</th><th>Reservado</th><th>Disponible</th><th>Umbral</th><th>Estado</th></tr></thead><tbody>${list.map(x=>`<tr><td class="mono">${esc(x.sku)}</td><td>${esc(x.product)}</td><td>${x.loc}</td><td>${x.on}</td><td>${x.res}</td><td>${x.av}</td><td>${x.u}</td><td><span class="status">${label(state(x))}</span></td></tr>`).join('')}</tbody></table></div>`:'<p>No hay resultados para los filtros seleccionados.</p>'}</section><section class="panel"><h2>Distribución por ubicación</h2><div class="tablewrap"><table><thead><tr><th>Ubicación</th><th>Físico</th><th>Reservado</th><th>Disponible</th><th>Stock bajo</th><th>Agotados</th></tr></thead><tbody>${locs.map(l=>{const z=data.filter(x=>x.loc===l);return `<tr><td>${l}</td><td>${z.reduce((a,x)=>a+x.on,0)}</td><td>${z.reduce((a,x)=>a+x.res,0)}</td><td>${z.reduce((a,x)=>a+x.av,0)}</td><td>${z.filter(x=>state(x)==='low').length}</td><td>${z.filter(x=>state(x)==='out').length}</td></tr>`}).join('')}</tbody></table></div></section>`;q.oninput=e=>{s.q=e.target.value;render()};loc.onchange=e=>{s.loc=e.target.value;render()};st.onchange=e=>{s.status=e.target.value;render()}}render();
</script></body></html>
