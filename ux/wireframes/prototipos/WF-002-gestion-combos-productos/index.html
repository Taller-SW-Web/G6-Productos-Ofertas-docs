<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de combos de productos</title>
<style>
:root{--s:#fff;--n10:#f3f4f6;--n20:#D1D5DB;--n30:#d1d5db;--n50:#6b7280;--n70:#6B7280;--n90:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--s);color:var(--n90);font:16px/1.5 Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button,input,textarea,select{min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--n90);outline-offset:2px}
.top{border-bottom:1px solid var(--n30)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin{display:flex;justify-content:space-between;gap:16px;align-items:center}
.brand{font-weight:700}.crumb{color:var(--n50);font-size:14px}.wrap{padding-top:32px;padding-bottom:64px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 8px}h2{font-size:24px;margin:0 0 12px}h3{margin:0 0 6px}
.pagehead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:24px}.pagehead p{margin:0;color:var(--n50)}
.btn{border:1px solid var(--n90);background:#fff;border-radius:4px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--n90);color:#fff}.btn.danger{border-width:2px}.btn[disabled]{color:var(--n50);border-color:var(--n30);cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.panel{border:1px solid var(--n30);padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.main{grid-column:span 8}.side{grid-column:span 4}
label{display:block;font-weight:600;margin-bottom:6px}.field{margin-bottom:16px}.input,textarea,select{width:100%;border:1px solid var(--n30);border-radius:4px;background:#fff;padding:10px 12px}textarea{min-height:100px;resize:vertical}
.help,.muted{color:var(--n50)}.small{font-size:13px}.mono{font-family:"Roboto Mono",monospace}
.tablewrap{overflow-x:auto}.desktop table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--n20);vertical-align:top}th{background:var(--n10);color:var(--n70);font-size:13px}
.status{display:inline-block;border:1px solid var(--n70);padding:2px 8px;border-radius:999px;font-size:13px}.notice{border:2px solid var(--n90);padding:14px;margin-bottom:16px}.notice p{margin:4px 0 0}
.metric{border-top:1px solid var(--n20);padding:12px 0}.metric:first-child{border-top:0}.metric strong{display:block;font-size:24px}
.error{font-size:13px;font-weight:600;margin-top:6px}.invalid{border:2px solid var(--n90)}
.cards{display:none}.card{border:1px solid var(--n30);padding:16px;margin-bottom:12px}.card dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.card dt{font-size:12px;color:var(--n50)}.card dd{margin:0;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--n90);width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.results{border:1px solid var(--n30);max-height:360px;overflow:auto}.result{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px;border-bottom:1px solid var(--n20)}.result:last-child{border-bottom:0}
.toast{position:fixed;right:16px;bottom:16px;border:2px solid var(--n90);background:#fff;padding:12px 16px;display:none;z-index:30}.toast.show{display:block}
.empty{border:1px dashed var(--n50);padding:32px;text-align:center}.summary{position:sticky;top:16px}
@media(max-width:900px){.grid{grid-template-columns:repeat(8,1fr)}.main,.side{grid-column:1/-1}.summary{position:static}.desktop{display:none}.cards{display:block}}
@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.pagehead{display:block}.pagehead .row{margin-top:16px}.grid{grid-template-columns:repeat(4,1fr)}.row>.btn{flex:1 1 100%}.card dl{grid-template-columns:1fr}.dialog .row{flex-direction:column}.dialog .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="crumb">Productos / Combos</div></div></header>
<main class="wrap" id="app" tabindex="-1"></main>

<div class="overlay" id="selector" aria-hidden="true">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="selectorTitle">
    <h2 id="selectorTitle">Añadir componentes</h2>
    <p class="muted">Selecciona SKU vendibles directos. No se permiten combos dentro de otros combos.</p>
    <div class="field"><label for="search">Buscar por nombre o SKU</label><input class="input" id="search" type="search"></div>
    <div class="results" id="results"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-close="selector">Cancelar</button><button class="btn primary" id="addSelected">Añadir seleccionados</button></div>
  </section>
</div>

<div class="overlay" id="deactivate" aria-hidden="true">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="deTitle">
    <h2 id="deTitle">Desactivar combo</h2>
    <p>El combo dejará de estar disponible para nuevas ventas. Los productos que lo componen no serán desactivados.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close="deactivate">Cancelar</button><button class="btn danger" id="doDeactivate">Desactivar combo</button></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const catalog=[
 {id:'cam-m',sku:'SKU-CAM-M',name:'Camiseta deportiva',detail:'Talla M',regular:59.90,public:49.90,available:10,active:true},
 {id:'med-w',sku:'SKU-MED-W',name:'Medias blancas',detail:'Talla única',regular:29.90,public:24.90,available:15,active:true},
 {id:'raq',sku:'SKU-RAQ',name:'Raqueta de entrenamiento',detail:'Producto simple',regular:180,public:160,available:5,active:true},
 {id:'pel',sku:'SKU-PEL',name:'Pelotas de tenis',detail:'Producto simple',regular:30,public:25,available:20,active:true},
 {id:'run42',sku:'SKU-RUN-42',name:'Zapatillas running',detail:'Talla 42',regular:210,public:189.90,available:8,active:true},
 {id:'run43',sku:'SKU-RUN-43',name:'Zapatillas running',detail:'Talla 43',regular:210,public:189.90,available:0,active:true},
 {id:'old',sku:'SKU-OLD-41',name:'Zapatilla edición anterior',detail:'Talla 41',regular:145,public:145,available:4,active:false},
 {id:'nested',sku:'COMBO-DEMO',name:'Combo recuperación',detail:'Combo',regular:99,public:99,available:null,active:true,isCombo:true}
];
let combos=[
 {id:'c1',name:'Kit entrenamiento básico',description:'Camiseta y medias para entrenamiento diario.',price:89.90,status:'active',availability:'fresh',calculated:'28/09/2026 18:05',components:[{id:'cam-m',qty:1},{id:'med-w',qty:2}]},
 {id:'c2',name:'Pack tenis inicial',description:'Raqueta y pelotas para comenzar a entrenar.',price:199.90,status:'active',availability:'fresh',calculated:'28/09/2026 18:04',components:[{id:'raq',qty:1},{id:'pel',qty:3}]},
 {id:'c3',name:'Set running fin de temporada',description:'Requiere revisión por componente inactivo.',price:299.90,status:'review',availability:'unknown',calculated:'28/09/2026 17:58',cause:'old',components:[{id:'run42',qty:1},{id:'old',qty:1}]}
];
const state={view:'list',current:null,mode:'create',form:null,selected:new Set(),simulate:'',dirty:false};
const app=document.getElementById('app'), toast=document.getElementById('toast');
const money=n=>`S/ ${Number(n||0).toFixed(2)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=id=>catalog.find(x=>x.id===id);
const combo=id=>combos.find(x=>x.id===id);
function calc(obj){
 const xs=(obj.components||[]).map(c=>({...item(c.id),qty:Number(c.qty)})).filter(x=>x.id);
 const sumRegular=xs.reduce((a,x)=>a+x.regular*x.qty,0);
 const sumPublic=xs.reduce((a,x)=>a+x.public*x.qty,0);
 if(!xs.length)return{xs,sumRegular,sumPublic,availability:null,limiter:null};
 if(xs.some(x=>!Number.isInteger(x.qty)||x.qty<=0))return{xs,sumRegular,sumPublic,availability:null,limiter:null};
 const ratios=xs.map(x=>({x,v:Math.floor(x.available/x.qty)}));
 const min=Math.min(...ratios.map(r=>r.v));
 return{xs,sumRegular,sumPublic,availability:min,limiter:ratios.find(r=>r.v===min)?.x||null};
}
function status(c){return c.status==='active'?'Activo':c.status==='review'?'Requiere revisión':'Inactivo'}
function availability(c){
 if(c.availability==='unknown')return 'No verificable';
 const x=calc(c).availability; return x==null?'No verificable':`${x}`;
}
function notify(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function head(title,copy,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${copy}</p></div><div class="row">${actions}</div></div>`}
function render(){
 if(location.hash==='#no-permission'){app.innerHTML=head('Gestión de combos','Administra ofertas agrupadas.')+`<div class="notice"><h3>Acceso restringido</h3><p>No tienes permiso para realizar esta acción.</p></div>`;return}
 if(location.hash==='#session-expired'){app.innerHTML=head('Gestión de combos','Administra ofertas agrupadas.')+`<div class="notice"><h3>Sesión finalizada</h3><p>Ingresa nuevamente para continuar.</p></div>`;return}
 if(state.view==='list')renderList();
 if(state.view==='form')renderForm();
 if(state.view==='detail')renderDetail();
 bind();
}
function renderList(){
 const actions=`<button class="btn primary" data-action="create">Crear combo</button>`;
 if(location.hash==='#list-loading'){app.innerHTML=head('Gestión de combos','Administra ofertas agrupadas.',actions)+`<div class="panel">Cargando combos…</div>`;return}
 if(location.hash==='#list-error'){app.innerHTML=head('Gestión de combos','Administra ofertas agrupadas.',actions)+`<div class="notice"><h3>No pudimos cargar los combos.</h3><p>Inténtalo nuevamente.</p></div><button class="btn" data-action="retry">Reintentar</button>`;return}
 const data=location.hash==='#list-empty'?[]:combos;
 if(!data.length){app.innerHTML=head('Gestión de combos','Administra ofertas agrupadas.',actions)+`<div class="empty"><h2>Aún no hay combos</h2><p class="muted">Crea el primer combo para agrupar productos complementarios.</p><button class="btn primary" data-action="create">Crear primer combo</button></div>`;return}
 const rows=data.map(c=>`<tr><td><strong>${esc(c.name)}</strong><div class="small muted">${esc(c.description)}</div></td><td>${money(c.price)}</td><td>${c.components.length}</td><td>${esc(availability(c))}<div class="small muted">Estimación</div></td><td><span class="status">${status(c)}</span></td><td><div class="row"><button class="btn" data-action="view" data-id="${c.id}">Ver detalle</button>${c.status==='active'?`<button class="btn" data-action="edit" data-id="${c.id}">Editar</button><button class="btn" data-action="deactivate" data-id="${c.id}">Desactivar</button>`:''}</div></td></tr>`).join('');
 const cards=data.map(c=>`<article class="card"><strong>${esc(c.name)}</strong><p class="small muted">${esc(c.description)}</p><dl><div><dt>Precio</dt><dd>${money(c.price)}</dd></div><div><dt>Componentes</dt><dd>${c.components.length}</dd></div><div><dt>Disponibilidad</dt><dd>${esc(availability(c))} <span class="small">estimada</span></dd></div><div><dt>Estado</dt><dd>${status(c)}</dd></div></dl><div class="row"><button class="btn" data-action="view" data-id="${c.id}">Ver detalle</button>${c.status==='active'?`<button class="btn" data-action="edit" data-id="${c.id}">Editar</button>`:''}</div></article>`).join('');
 app.innerHTML=head('Gestión de combos','Crea y administra paquetes formados por SKUs vendibles directos.',actions)+`<div class="desktop tablewrap"><table><thead><tr><th>Combo</th><th>Precio</th><th>Componentes</th><th>Disponibilidad</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div><div class="cards">${cards}</div>`;
}
function resetForm(mode,c){
 state.mode=mode;state.current=c?.id||null;state.dirty=false;
 state.form=c?{name:c.name,description:c.description,price:String(c.price),components:c.components.map(x=>({...x}))}:{name:'',description:'',price:'',components:[]};
}
function validate(){
 const f=state.form,x=calc(f),e={};
 if(!f.name.trim())e.name='Ingresa un nombre.';
 if(!f.description.trim())e.description='Ingresa una descripción.';
 if(f.components.length<2)e.components='Añade al menos 2 SKUs distintos.';
 f.components.forEach((c,i)=>{if(!Number.isInteger(Number(c.qty))||Number(c.qty)<=0)e['q'+i]='Ingresa una cantidad entera mayor que cero.'});
 const p=Number(f.price);
 if(!(p>0) || !(p<x.sumRegular) || !(p<x.sumPublic))e.price='El precio debe ser mayor que cero y menor que comprar los componentes por separado.';
 return{e,x,ok:Object.keys(e).length===0};
}
function renderForm(conflict=''){
 const v=validate(),f=state.form;
 const rows=v.x.xs.map((x,i)=>`<tr><td class="mono">${esc(x.sku)}</td><td><strong>${esc(x.name)}</strong><div class="small muted">${esc(x.detail)}</div></td><td>${money(x.regular)}<div class="small muted">Vigente: ${money(x.public)}</div></td><td>${x.available}</td><td><input class="input ${v.e['q'+i]?'invalid':''}" style="width:90px" type="number" min="1" step="1" data-q="${i}" value="${esc(x.qty)}"><div class="error">${esc(v.e['q'+i]||'')}</div></td><td>${Number.isInteger(x.qty)&&x.qty>0?Math.floor(x.available/x.qty):'—'}</td><td><button class="btn" data-remove="${i}">Quitar</button></td></tr>`).join('');
 app.innerHTML=head(state.mode==='create'?'Crear combo':'Editar combo','Configura componentes, cantidades y un precio comercial válido.')+
 `${conflict?`<div class="notice"><h3>Los datos vigentes cambiaron</h3><p>${conflict}</p></div>`:''}
 <div class="grid"><div class="main">
 <section class="panel"><h2>Datos generales</h2>
 <div class="field"><label for="name">Nombre</label><input class="input ${v.e.name?'invalid':''}" id="name" value="${esc(f.name)}"><div class="error">${esc(v.e.name||'')}</div></div>
 <div class="field"><label for="description">Descripción</label><textarea class="${v.e.description?'invalid':''}" id="description">${esc(f.description)}</textarea><div class="error">${esc(v.e.description||'')}</div></div></section>
 <section class="panel"><div class="pagehead" style="margin-bottom:12px"><div><h2>Componentes</h2><p>Solo SKU vendibles directos.</p></div><button class="btn" type="button" data-action="add">Añadir componentes</button></div>
 ${v.e.components?`<div class="error">${esc(v.e.components)}</div>`:''}
 <div class="tablewrap desktop"><table><thead><tr><th>SKU</th><th>Producto / variante</th><th>Precios</th><th>Disponible</th><th>Cantidad</th><th>Aporte</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="muted">Aún no has añadido componentes.</td></tr>`}</tbody></table></div>
 <div class="cards">${v.x.xs.map((x,i)=>`<article class="card"><strong>${esc(x.name)}</strong><div class="small mono">${esc(x.sku)}</div><p class="small">Regular ${money(x.regular)} · Vigente ${money(x.public)} · Disponible ${x.available}</p><label>Cantidad<input class="input" data-q="${i}" type="number" min="1" step="1" value="${x.qty}"></label><button class="btn" data-remove="${i}">Quitar</button></article>`).join('')||'<p class="muted">Aún no has añadido componentes.</p>'}</div></section>
 <section class="panel"><h2>Precio del combo</h2><label for="price">Precio promocional</label><input class="input ${v.e.price?'invalid':''}" id="price" type="number" step="0.01" value="${esc(f.price)}"><div class="error">${esc(v.e.price||'')}</div></section>
 </div><aside class="side"><div class="panel summary"><h2>Resumen</h2>
 <div class="metric"><span class="muted small">Suma regular</span><strong>${money(v.x.sumRegular)}</strong></div>
 <div class="metric"><span class="muted small">Suma pública vigente</span><strong>${money(v.x.sumPublic)}</strong></div>
 <div class="metric"><span class="muted small">Disponibilidad estimada</span><strong>${v.x.availability==null?'—':v.x.availability}</strong><span class="small muted">${v.x.limiter?`Limitada por ${esc(v.x.limiter.name)}.`:'Añade componentes válidos.'}</span></div>
 <p class="small muted">La compra verifica y reserva existencias durante el pedido. Este valor es informativo.</p></div></aside></div>
 <div class="row" style="justify-content:flex-end"><button class="btn" data-action="back">Cancelar</button><button class="btn primary" data-action="save" ${v.ok?'':'disabled'}>${state.mode==='create'?'Crear combo':'Guardar cambios'}</button></div>`;
}
function renderDetail(){
 const c=combo(state.current);if(!c){state.view='list';render();return}
 const x=calc(c);
 const notice=c.status==='review'?`<div class="notice"><h3>Este combo requiere revisión</h3><p>Uno de sus componentes dejó de estar activo. Ya no participa en nuevas ventas.</p></div>`:c.status==='inactive'?`<div class="notice"><h3>Combo inactivo</h3><p>Ya no participa en nuevas ventas.</p></div>`:'';
 const av=c.availability==='unknown'?'No verificable':x.availability;
 app.innerHTML=head(esc(c.name),esc(c.description),`<button class="btn" data-action="back">Volver</button>${c.status==='active'?`<button class="btn" data-action="edit" data-id="${c.id}">Editar</button><button class="btn danger" data-action="deactivate" data-id="${c.id}">Desactivar</button>`:''}`)+notice+
 `<div class="grid"><div class="main"><section class="panel"><h2>Composición</h2><div class="tablewrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Cantidad</th><th>Regular</th><th>Vigente</th></tr></thead><tbody>${x.xs.map(y=>`<tr><td class="mono">${esc(y.sku)}</td><td>${esc(y.name)}</td><td>${y.qty}</td><td>${money(y.regular)}</td><td>${money(y.public)}</td></tr>`).join('')}</tbody></table></div></section></div>
 <aside class="side"><section class="panel"><span class="status">${status(c)}</span><div class="metric"><span class="muted small">Precio del combo</span><strong>${money(c.price)}</strong></div><div class="metric"><span class="muted small">Disponibilidad estimada</span><strong>${av}</strong><span class="small muted">${c.availability==='unknown'?'No pudimos verificarla con la última información.':`Calculada ${esc(c.calculated)}.`}</span></div><p class="small muted">La existencia definitiva se verifica durante el pedido.</p></section></aside></div>`;
}
function openOverlay(id){const o=document.getElementById(id);o.classList.add('open');o.setAttribute('aria-hidden','false');o.querySelector('button,input')?.focus()}
function closeOverlay(id){const o=document.getElementById(id);o.classList.remove('open');o.setAttribute('aria-hidden','true')}
function renderResults(q=''){
 const chosen=new Set(state.form.components.map(x=>x.id));const s=q.toLowerCase();
 document.getElementById('results').innerHTML=catalog.filter(x=>!s||x.name.toLowerCase().includes(s)||x.sku.toLowerCase().includes(s)).map(x=>{
  const blocked=x.isCombo||!x.active||chosen.has(x.id);const why=x.isCombo?'No se permiten combos dentro de otros combos.':!x.active?'Este SKU no está activo.':chosen.has(x.id)?'Ya está añadido.':'';
  return `<label class="result"><input type="checkbox" data-pick="${x.id}" ${blocked?'disabled':''} ${state.selected.has(x.id)?'checked':''}><span><strong>${esc(x.name)}</strong><br><span class="small mono">${esc(x.sku)}</span><br><span class="small muted">${esc(x.detail)} · Vigente ${money(x.public)} · Disponible ${x.available??'—'}</span>${why?`<br><span class="small"><strong>${esc(why)}</strong></span>`:''}</span><span class="status">${x.isCombo?'Combo':x.active?'Activo':'Inactivo'}</span></label>`;
 }).join('');
 document.querySelectorAll('[data-pick]').forEach(cb=>cb.onchange=e=>{e.target.checked?state.selected.add(e.target.dataset.pick):state.selected.delete(e.target.dataset.pick)});
}
function bind(){
 app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.action,id=b.dataset.id;
  if(a==='create'){resetForm('create');state.view='form';render()}
  if(a==='view'){state.current=id;state.view='detail';render()}
  if(a==='edit'){resetForm('edit',combo(id||state.current));state.view='form';render()}
  if(a==='back'){state.view=state.current?'detail':'list';render()}
  if(a==='retry'){location.hash='';render()}
  if(a==='add'){state.selected.clear();renderResults();openOverlay('selector')}
  if(a==='deactivate'){state.current=id||state.current;openOverlay('deactivate')}
  if(a==='save'){
   const v=validate();if(!v.ok)return;
   if(state.mode==='edit'&&state.current==='c2'&&!state.form._reviewed){state.form._reviewed=true;catalog.find(x=>x.id==='pel').public=27;renderForm('El precio vigente de Pelotas de tenis cambió. Revisa el nuevo límite antes de guardar.');return}
   if(state.mode==='create'){const id='c'+Date.now();combos.unshift({id,name:state.form.name.trim(),description:state.form.description.trim(),price:Number(state.form.price),status:'active',availability:'fresh',calculated:'Ahora',components:state.form.components.map(x=>({id:x.id,qty:Number(x.qty)}))});state.current=id}else{Object.assign(combo(state.current),{name:state.form.name.trim(),description:state.form.description.trim(),price:Number(state.form.price),components:state.form.components.map(x=>({id:x.id,qty:Number(x.qty)}))})}
   state.view='detail';notify(state.mode==='create'?'Combo creado.':'Cambios guardados.');render()
  }
 });
 if(state.view==='form'){
  const n=document.getElementById('name'),d=document.getElementById('description'),p=document.getElementById('price');
  if(n)n.oninput=e=>state.form.name=e.target.value;if(d)d.oninput=e=>state.form.description=e.target.value;if(p)p.oninput=e=>state.form.price=e.target.value;
  app.querySelectorAll('[data-q]').forEach(i=>i.onchange=e=>{state.form.components[Number(e.target.dataset.q)].qty=Number(e.target.value);renderForm()});
  app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{state.form.components.splice(Number(e.currentTarget.dataset.remove),1);renderForm()})
 }
}
document.getElementById('search').oninput=e=>renderResults(e.target.value);
document.getElementById('addSelected').onclick=()=>{state.selected.forEach(id=>{if(!state.form.components.some(x=>x.id===id))state.form.components.push({id,qty:1})});state.selected.clear();closeOverlay('selector');renderForm();notify('Componentes añadidos.')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));
document.getElementById('doDeactivate').onclick=()=>{const c=combo(state.current);if(c)c.status='inactive';closeOverlay('deactivate');state.view='detail';notify('Combo desactivado.');render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.overlay.open').forEach(o=>closeOverlay(o.id))}})
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
