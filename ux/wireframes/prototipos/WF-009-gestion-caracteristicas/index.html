<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de características y sus valores</title>
<style>
:root{--s:#fff;--n10:#f3f4f6;--n20:#d1d5db;--n30:#d1d5db;--n50:#6b7280;--n90:#111827}*{box-sizing:border-box}html{min-width:320px}body{margin:0;background:var(--s);color:var(--n90);font:16px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;min-height:44px;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--n90);outline-offset:2px}.top{border-bottom:1px solid var(--n30)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--n50)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.btn{border:1px solid var(--n90);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--n90);color:#fff}.panel,.card{border:1px solid var(--n30);padding:16px;margin:14px 0}.notice{border:2px solid var(--n90);padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.wide{grid-column:1/-1}label,legend{font-weight:600}.input,select,textarea{width:100%;border:1px solid var(--n30);padding:10px;background:#fff}.tablewrap{overflow:auto}table{width:100%;min-width:840px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--n20);text-align:left;vertical-align:top}th{background:var(--n10)}.status{border:1px solid var(--n90);border-radius:999px;padding:2px 8px;white-space:nowrap}.cards{display:none}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--n90);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:20px}.small{font-size:14px}.error{font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:900px){.grid{grid-template-columns:1fr}.desktop{display:none}.cards{display:block}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.head>.actions{margin-top:12px}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Productos / Características</div></div></header>
<main class="wrap" id="app"></main>
<div class="overlay" id="confirmModal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="row"><button class="btn" id="confirmCancel">Cancelar</button><button class="btn primary" id="confirmApply">Confirmar</button></div></section></div>
<script>
const LIST_LIMIT=50,TEXT_LIMIT=100;
let chars=[
 {id:'talla',name:'Talla',type:'LISTA',status:'active',unit:'',values:[{id:'m',name:'M',status:'active',use:'sku'},{id:'l',name:'L',status:'active',use:'none'},{id:'xl',name:'XL',status:'inactive',use:'none'}]},
 {id:'peso',name:'Peso',type:'NUMERO',status:'active',unit:'kg',values:[]},
 {id:'material',name:'Material',type:'TEXTO',status:'active',unit:'',values:[]}
];
const s={view:'list',id:null,form:null,pending:null,valueEdit:null,confirm:null},app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeLabel=t=>t==='LISTA'?'Lista':t==='NUMERO'?'Número':'Texto';
const statusLabel=x=>x==='active'?'Activo':'Inactivo';
const current=()=>chars.find(c=>c.id===s.id);
function head(title,actions=''){return `<div class="head"><div><h1>${title}</h1><p class="muted">Administra atributos tipados para los esquemas definidos por tipo de producto.</p></div><div class="actions">${actions}</div></div>`}
function render(){if(s.view==='list')list();else if(s.view==='form')form();else if(s.view==='detail')detail();else values()}
function rule(c){if(c.type==='LISTA')return `${c.values.filter(v=>v.status==='active').length} de ${LIST_LIMIT} valores activos`;if(c.type==='NUMERO')return `Unidad: ${esc(c.unit)}`;return `Hasta ${TEXT_LIMIT} caracteres`}
function list(){app.innerHTML=head('Gestión de características','<button class="btn primary" data-a="new">Crear característica</button>')+(s.pending?`<div class="notice" role="status">${esc(s.pending)}</div>`:'')+`<div class="desktop tablewrap"><table><thead><tr><th>Característica</th><th>Tipo</th><th>Regla</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${chars.map(c=>`<tr><td>${esc(c.name)}</td><td>${typeLabel(c.type)}</td><td>${rule(c)}</td><td><span class="status">${statusLabel(c.status)}</span></td><td><div class="actions"><button class="btn" data-a="detail" data-id="${c.id}">Ver detalle</button>${c.type==='LISTA'?`<button class="btn" data-a="values" data-id="${c.id}">Valores</button>`:''}</div></td></tr>`).join('')}</tbody></table></div><div class="cards">${chars.map(c=>`<article class="card"><strong>${esc(c.name)}</strong><p>${typeLabel(c.type)} · ${statusLabel(c.status)}</p><p class="muted">${rule(c)}</p><div class="actions"><button class="btn" data-a="detail" data-id="${c.id}">Ver detalle</button>${c.type==='LISTA'?`<button class="btn" data-a="values" data-id="${c.id}">Valores</button>`:''}</div></article>`).join('')}</div>`;bind()}
function blank(){return{name:'',type:'TEXTO',unit:''}}
function form(){const f=s.form,editing=!!s.id,c=editing?current():null;app.innerHTML=head(editing?'Editar característica':'Crear característica')+`<form class="panel" id="charForm"><div class="grid"><div><label>Nombre</label><input class="input" id="name" value="${esc(f.name)}"><div class="error" id="nameErr"></div></div><div><label>Tipo</label>${editing?`<input class="input" value="${typeLabel(c.type)}" disabled><p class="muted small">El tipo no puede cambiarse después de crear la característica.</p>`:`<select id="type"><option value="TEXTO" ${f.type==='TEXTO'?'selected':''}>Texto</option><option value="NUMERO" ${f.type==='NUMERO'?'selected':''}>Número</option><option value="LISTA" ${f.type==='LISTA'?'selected':''}>Lista</option></select>`}</div>${(!editing?f.type:c.type)==='NUMERO'?`<div><label>Unidad</label><input class="input" id="unit" value="${esc(f.unit)}" placeholder="Ej. kg, cm"><div class="error" id="unitErr"></div></div>`:''}<div class="wide notice">${(!editing?f.type:c.type)==='TEXTO'?`Los valores de texto admiten hasta ${TEXT_LIMIT} caracteres.`:(!editing?f.type:c.type)==='LISTA'?`Las listas admiten hasta ${LIST_LIMIT} valores activos.`:'La unidad es obligatoria para características numéricas.'}</div></div><div class="row"><button type="button" class="btn" data-a="back">Cancelar</button><button class="btn primary">Guardar</button></div></form>`;bind();if(!editing)type.onchange=e=>{s.form.name=name.value;s.form.type=e.target.value;s.form.unit='';render()};charForm.onsubmit=e=>{e.preventDefault();const n=name.value.trim();if(!n){nameErr.textContent='Ingresa un nombre.';return}const t=editing?c.type:type.value,u=(editing?c.type:type.value)==='NUMERO'?(document.getElementById('unit')?.value.trim()||''):'';if(t==='NUMERO'&&!u){unitErr.textContent='Ingresa una unidad.';return}if(editing){c.name=n;c.unit=u;s.pending='Cambios guardados.'}else{chars.push({id:'c'+Date.now(),name:n,type:t,unit:u,status:'active',values:[]});s.pending='Característica creada.'}s.view='list';s.id=null;s.form=null;render()}}
function detail(){const c=current();app.innerHTML=head(c.name,'<button class="btn" data-a="edit">Editar</button>')+`<section class="panel"><dl><dt>Tipo</dt><dd>${typeLabel(c.type)}</dd><dt>Estado</dt><dd>${statusLabel(c.status)}</dd>${c.type==='NUMERO'?`<dt>Unidad</dt><dd>${esc(c.unit)}</dd>`:''}${c.type==='TEXTO'?`<dt>Longitud máxima</dt><dd>${TEXT_LIMIT} caracteres</dd>`:''}${c.type==='LISTA'?`<dt>Valores activos</dt><dd>${c.values.filter(v=>v.status==='active').length} de ${LIST_LIMIT}</dd>`:''}</dl><div class="notice">Los valores de producto se validan según el tipo de producto asociado.</div><div class="row"><button class="btn" data-a="back">Volver</button>${c.type==='LISTA'?'<button class="btn" data-a="valuesCurrent">Administrar valores</button>':''}<button class="btn primary" data-a="toggle">${c.status==='active'?'Desactivar característica':'Reactivar característica'}</button></div></section>`;bind()}
function values(){const c=current(),active=c.values.filter(v=>v.status==='active').length;app.innerHTML=head(`Valores · ${c.name}`,'<button class="btn primary" data-a="addValue">Agregar valor</button>')+(s.pending?`<div class="notice" role="status">${esc(s.pending)}</div>`:'')+`<section class="panel"><p>${active} de ${LIST_LIMIT} valores activos.</p><div class="notice">Los valores de producto se validan según el tipo de producto asociado.</div>${c.values.length?c.values.map((v,i)=>`<article class="card"><div class="row"><div><strong>${esc(v.name)}</strong><div class="muted">${statusLabel(v.status)}</div></div><div class="actions">${v.status==='active'?`<button class="btn" data-a="renameValue" data-i="${i}">Renombrar</button><button class="btn" data-a="deactivateValue" data-i="${i}">Desactivar</button>`:'<span class="status">Inactivo</span>'}</div></div></article>`).join(''):'<p>No hay valores registrados.</p>'}<button class="btn" data-a="detailBack">Volver al detalle</button></section>`;bind()}
function ask(title,text,action){confirmTitle.textContent=title;confirmText.textContent=text;s.confirm=action;confirmModal.classList.add('open')}
function bind(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,id=b.dataset.id,i=b.dataset.i!==undefined?Number(b.dataset.i):null;if(a==='new'){s.id=null;s.form=blank();s.view='form';render()}if(a==='detail'){s.id=id;s.view='detail';render()}if(a==='values'){s.id=id;s.pending=null;s.view='values';render()}if(a==='edit'){const c=current();s.form={name:c.name,type:c.type,unit:c.unit};s.view='form';render()}if(a==='back'){s.view='list';s.id=null;render()}if(a==='valuesCurrent'){s.pending=null;s.view='values';render()}if(a==='detailBack'){s.pending=null;s.view='detail';render()}if(a==='toggle'){const c=current();ask(c.status==='active'?'Desactivar característica':'Reactivar característica',c.status==='active'?'La característica dejará de estar disponible para nuevas asociaciones.':'La característica volverá a estar disponible para nuevas asociaciones.',{kind:'toggleCharacteristic'})}if(a==='addValue'){const c=current();if(c.values.filter(v=>v.status==='active').length>=LIST_LIMIT){s.pending='Se alcanzó el máximo de valores activos.';render();return}const name=prompt('Nombre del nuevo valor');if(name&&name.trim()){c.values.push({id:'v'+Date.now(),name:name.trim(),status:'active',use:'none'});s.pending='Valor agregado.';render()}}if(a==='renameValue'){const c=current(),v=c.values[i],name=prompt('Nuevo nombre',v.name);if(name&&name.trim()&&name.trim()!==v.name){v.name=name.trim();s.pending='Nombre actualizado. La identidad del valor se conserva.';render()}}if(a==='deactivateValue'){const c=current(),v=c.values[i];ask('Desactivar valor',`Comprobaremos si “${v.name}” está siendo utilizado antes de confirmar la baja.`,{kind:'deactivateValue',index:i})}})}
confirmCancel.onclick=()=>{confirmModal.classList.remove('open');s.confirm=null};confirmApply.onclick=()=>{confirmModal.classList.remove('open');const action=s.confirm;s.confirm=null;if(!action)return;if(action.kind==='toggleCharacteristic'){const c=current();c.status=c.status==='active'?'inactive':'active';s.pending=c.status==='active'?'Característica reactivada.':'Característica desactivada.';s.view='list';s.id=null;render();return}if(action.kind==='deactivateValue'){const c=current(),v=c.values[action.index];s.pending='Comprobando uso en productos. Este valor no está disponible temporalmente para nuevas asignaciones.';render();setTimeout(()=>{if(v.use==='sku'){s.pending='No se puede desactivar porque el valor participa en un SKU activo. No se realizó ningún cambio.'}else if(v.use==='unknown'){s.pending='No pudimos confirmar que la baja sea segura. No se realizó ningún cambio.'}else{v.status='inactive';s.pending='Baja confirmada. El valor quedó inactivo.'}render()},800)}};
render();
</script>
</body>
</html>
