<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de SEO y metadatos</title>
<style>
:root{
  --surface:#FFFFFF;
  --n10:#F3F4F6;
  --n30:#D1D5DB;
  --n50:#6B7280;
  --n90:#111827;
}
*{box-sizing:border-box}
html{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--n90);background:var(--surface)}
body{margin:0;background:var(--surface);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--n90);outline-offset:2px
}
.top{border-bottom:1px solid var(--n30);background:var(--surface)}
.topin,.wrap{max-width:1200px;margin:auto;padding-left:24px;padding-right:24px}
.topin{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wrap{padding-top:32px;padding-bottom:64px}
.brand{font-weight:700}.crumb,.muted{color:var(--n50)}.small{font-size:13px}
.head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
.head h1{font-size:clamp(28px,4vw,36px);line-height:1.15;margin:0 0 8px}
.head h2{margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--n90);background:var(--surface);padding:10px 14px;border-radius:4px;cursor:pointer}
.btn.primary{background:var(--n90);color:var(--surface)}
.btn[disabled]{color:var(--n50);border-color:var(--n30);background:var(--n10);cursor:not-allowed}
.panel{border:1px solid var(--n30);padding:16px;margin-bottom:16px;background:var(--surface)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.wide{grid-column:1/-1}
label{display:block;font-weight:600;margin-bottom:6px}
.field{margin-bottom:16px}
.input,select,textarea{width:100%;border:1px solid var(--n30);border-radius:4px;background:var(--surface);padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.help,.count{font-size:13px;color:var(--n50)}
.over{font-weight:700;text-decoration:underline;color:var(--n90)}
.notice{border:1px solid var(--n90);padding:14px 16px;background:var(--surface)}
.notice.soft{border-color:var(--n30);background:var(--n10)}
.preview{border:1px solid var(--n30);padding:16px;background:var(--surface)}
.preview .url{font-family:"Roboto Mono",ui-monospace,monospace;font-size:13px;color:var(--n50);word-break:break-all}
.preview .title{font-size:20px;font-weight:700;margin:6px 0}
.preview .desc{color:var(--n50)}
.tablewrap{overflow:auto;border:1px solid var(--n30)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px;border-bottom:1px solid var(--n30);text-align:left;vertical-align:top}
th{background:var(--n10);font-size:13px}
tbody tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;border:1px solid var(--n30);padding:3px 9px;border-radius:999px;font-size:13px}
.mono{font-family:"Roboto Mono",ui-monospace,monospace}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.open{display:flex}
.dialog{background:var(--surface);border:2px solid var(--n90);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.dialog h2{margin-top:0}
.empty{text-align:center;border:1px dashed var(--n30);padding:48px 20px}
.hidden{display:none!important}
.statusbox{border:1px solid var(--n30);padding:16px;background:var(--n10)}
.progress{height:10px;border:1px solid var(--n30);background:var(--surface)}
.progress span{display:block;height:100%;background:var(--n90)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){
  .grid,.grid3,.filters{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .topin,.wrap{padding-left:16px;padding-right:16px}
  .topin,.head{display:block}
  .grid,.grid3,.filters{grid-template-columns:1fr}
  .row>.btn{flex:1 1 100%}
  table{min-width:680px}
}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="crumb">Productos / SEO</div></div></header>
<main class="wrap" id="app"></main>
<script>
const TITLE_LIMIT=70, DESC_LIMIT=160;
let categories=[
  {id:'cal',name:'Calzado',slug:'calzado',title:'Calzado deportivo | Tienda oficial',desc:'Encuentra calzado deportivo original.',history:[]},
  {id:'fut',name:'Fútbol',slug:'futbol',title:'Fútbol: balones y equipamiento',desc:'Todo para la cancha.',history:[]},
  {id:'bot',name:'Botines',slug:'botines',title:'Botines deportivos',desc:'Botines para distintas superficies.',history:[{old:'botin-antiguo',date:'2026-08-02'}]},
  {id:'run',name:'Running',slug:null,title:'',desc:'',history:[]}
];
const state={view:'list',id:null,form:null};
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const used=(slug,id)=>categories.some(c=>c.id!==id&&c.slug===slug);
function unique(base,id){let candidate=base,n=2;while(used(candidate,id))candidate=`${base}-${n++}`;return candidate}
function head(title,copy=''){return `<div class="head"><div><h1>${title}</h1>${copy?`<p class="muted">${copy}</p>`:''}</div></div>`}
function render(){state.view==='list'?renderList():state.view==='edit'?renderEdit():renderHistory()}
function renderList(){
  app.innerHTML=head('SEO por categoría','Administra slug y metadatos sin simular el comportamiento público del Marketplace.')+
  `<div class="tablewrap"><table><thead><tr><th>Categoría</th><th>Slug</th><th>Meta-título</th><th>Acciones</th></tr></thead><tbody>
  ${categories.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td class="mono">${esc(c.slug||'Pendiente')}</td><td>${esc(c.title||'Pendiente')}</td><td><div class="row"><button class="btn" data-action="edit" data-id="${c.id}">${c.slug?'Editar':'Configurar'}</button><button class="btn" data-action="history" data-id="${c.id}">Historial</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
  bindList();
}
function bindList(){
  document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>{
    const c=categories.find(x=>x.id===btn.dataset.id);
    if(btn.dataset.action==='edit'){
      state.id=c.id;
      state.form={slug:c.slug||unique(norm(c.name),c.id),title:c.title,desc:c.desc,auto:!c.slug};
      state.view='edit';render();
    } else {
      state.id=c.id;state.view='history';render();
    }
  });
}
function previewBlock(form){
  return `<div class="preview" aria-live="polite">
    <div class="small muted"><strong>Vista previa</strong></div>
    <div class="url">/categoria/${esc(form.slug||'slug-pendiente')}</div>
    <div class="title">${esc(form.title||'Título de la categoría')}</div>
    <div class="desc">${esc(form.desc||'La descripción aparecerá aquí mientras editas.') }</div>
  </div>`;
}
function renderEdit(){
  const c=categories.find(x=>x.id===state.id),f=state.form;
  app.innerHTML=head('SEO · '+c.name,'Configura los metadatos y revisa cómo quedará la información antes de guardar.')+
  `<section class="panel">
    <div class="grid">
      <div class="wide field">
        <label for="slug">Slug</label>
        <input class="input mono" id="slug" value="${esc(f.slug)}">
        <div class="help">URL pública: /categoria/<span id="slugHelp">${esc(f.slug)}</span></div>
        <div id="slugError" class="help"></div>
        <button class="btn" id="regen" type="button" style="margin-top:8px">Regenerar desde el nombre</button>
        ${f.auto?`<div class="notice soft" style="margin-top:12px">Slug automático: <strong>/categoria/${esc(f.slug)}</strong>${f.slug!==norm(c.name)?'<br>Se añadió un sufijo porque el slug base ya estaba en uso.':''}</div>`:''}
      </div>
      <div class="wide field">
        <label for="title">Meta-título</label>
        <input class="input" id="title" value="${esc(f.title)}">
        <div class="count ${f.title.length>TITLE_LIMIT?'over':''}" id="titleCount">${f.title.length} / ${TITLE_LIMIT}</div>
      </div>
      <div class="wide field">
        <label for="desc">Meta-descripción</label>
        <textarea id="desc">${esc(f.desc)}</textarea>
        <div class="count ${f.desc.length>DESC_LIMIT?'over':''}" id="descCount">${f.desc.length} / ${DESC_LIMIT}</div>
      </div>
      <div class="wide">
        <div id="previewWrap">${previewBlock(f)}</div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn" id="cancel">Cancelar</button>
      <button class="btn primary" id="save">Guardar SEO</button>
    </div>
  </section>`;
  bindEdit(c);
}
function refreshPreview(){
  const f=state.form;
  document.getElementById('previewWrap').innerHTML=previewBlock(f);
  document.getElementById('slugHelp').textContent=f.slug||'slug-pendiente';
  const tc=document.getElementById('titleCount');
  tc.textContent=`${f.title.length} / ${TITLE_LIMIT}`;tc.classList.toggle('over',f.title.length>TITLE_LIMIT);
  const dc=document.getElementById('descCount');
  dc.textContent=`${f.desc.length} / ${DESC_LIMIT}`;dc.classList.toggle('over',f.desc.length>DESC_LIMIT);
}
function bindEdit(c){
  slug.oninput=e=>{state.form.slug=e.target.value.trim();state.form.auto=false;slugError.textContent='';refreshPreview()};
  title.oninput=e=>{state.form.title=e.target.value;refreshPreview()};
  desc.oninput=e=>{state.form.desc=e.target.value;refreshPreview()};
  regen.onclick=()=>{state.form.slug=unique(norm(c.name),c.id);state.form.auto=true;render()};
  cancel.onclick=()=>{state.view='list';render()};
  save.onclick=()=>{
    const candidate=state.form.slug.trim();
    if(!candidate){slugError.textContent='Ingresa un slug.';return}
    if(used(candidate,c.id)&&!state.form.auto){slugError.textContent='El slug indicado ya está en uso.';return}
    const old=c.slug;
    c.slug=candidate;c.title=state.form.title;c.desc=state.form.desc;
    if(old&&old!==candidate)c.history.push({old,date:new Date().toISOString().slice(0,10)});
    state.view='list';render();
  };
}
function renderHistory(){
  const c=categories.find(x=>x.id===state.id);
  app.innerHTML=head('Historial · '+c.name,'Consulta las resoluciones anteriores del slug.')+
  `<section class="panel">
    <p>Slug actual: <span class="mono">${esc(c.slug||'Pendiente')}</span></p>
    ${c.history.length?`<div class="tablewrap"><table><thead><tr><th>Slug anterior</th><th>Resuelve a</th><th>Fecha</th></tr></thead><tbody>${c.history.map(h=>`<tr><td class="mono">${esc(h.old)}</td><td class="mono">${esc(c.slug)}</td><td>${h.date}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin historial de cambios.</div>'}
    <div class="notice soft" style="margin-top:16px">Marketplace utiliza esta resolución para responder la redirección permanente en la URL pública.</div>
    <button class="btn" id="back" style="margin-top:16px">Volver</button>
  </section>`;
  back.onclick=()=>{state.view='list';render()};
}
render();
</script>
</body></html>
