<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de categorías y subcategorías</title><style>
:root{--a:#f3f4f6;--b:#D1D5DB;--c:#d1d5db;--m:#6b7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;min-height:44px}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.btn{border:1px solid var(--k);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--k);color:#fff}.panel{border:1px solid var(--c);padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{font-weight:600;display:block}.input,select,textarea{width:100%;border:1px solid var(--c);padding:10px;background:#fff}.tree{border:1px solid var(--c)}.node{padding:14px;border-bottom:1px solid var(--b);display:grid;grid-template-columns:1fr auto;gap:12px}.child{padding-left:38px;background:var(--a)}.status{border:1px solid var(--k);border-radius:999px;padding:2px 8px}.notice{border:2px solid var(--k);padding:14px;margin:14px 0}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--k);width:min(600px,calc(100vw - 32px));padding:20px}.cards{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head,.node{display:block}.head .row,.node .row{margin-top:10px}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}.child{padding-left:24px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Productos / Categorías</div></div></header><main class="wrap" id="app"></main><div class="overlay" id="deModal"><section class="dialog"><h2>Desactivar categoría</h2><p>Comprobaremos que no tenga subcategorías o productos activos.</p><div class="row"><button class="btn" id="deCancel">Cancelar</button><button class="btn primary" id="deGo">Continuar</button></div></section></div><script>
let occupiedSlugs=[];let cats=[{id:'fut',name:'Fútbol',slug:'futbol',parent:null,status:'active',products:12},{id:'bal',name:'Balones',slug:'balones',parent:'fut',status:'active',products:6},{id:'cal',name:'Calzado',slug:'calzado',parent:null,status:'active',products:0},{id:'bot',name:'Botines',slug:'botines',parent:'cal',status:'active',products:0},{id:'acc',name:'Accesorios',slug:'accesorios',parent:null,status:'inactive',products:0}];const s={view:'tree',id:null,form:null,pending:null,slugNotice:null,conflictUsed:false},app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function unique(base,id=null){let x=base,n=2;while(cats.some(c=>c.id!==id&&c.slug===x)||occupiedSlugs.includes(x))x=`${base}-${n++}`;return x}function head(t,a=''){return `<div class="head"><h1>${t}</h1><div class="row">${a}</div></div>`}function render(){if(s.view==='tree')tree();else if(s.view==='form')form();else if(s.view==='confirm')confirmSlug();else detail()}
function tree(){const roots=cats.filter(c=>!c.parent);app.innerHTML=head('Gestión de categorías','<button class="btn primary" data-a="new">Crear categoría</button>')+(s.pending?`<div class="notice"><strong>${esc(s.pending)}</strong></div>`:'')+`<div class="tree">${roots.map(r=>node(r)+cats.filter(c=>c.parent===r.id).map(c=>node(c,true)).join('')).join('')}</div>`;bind()}function node(c,child=false){return `<div class="node ${child?'child':''}"><div><strong>${esc(c.name)}</strong><div class="muted">${child?'Subcategoría':'Categoría raíz'} · /categoria/${esc(c.slug)}</div></div><div class="row"><span class="status">${c.status==='active'?'Activo':'Inactivo'}</span><button class="btn" data-a="detail" data-id="${c.id}">Ver</button>${c.status==='active'?`<button class="btn" data-a="de" data-id="${c.id}">Desactivar</button>`:`<button class="btn" data-a="react" data-id="${c.id}">Reactivar</button>`}</div></div>`}function blank(){return{name:'',desc:'',parent:''}}function form(){const f=s.form,editing=!!s.id;const cat=editing?cats.find(c=>c.id===s.id):null;const base=norm(f.name),slug=editing?cat.slug:unique(base);app.innerHTML=head(editing?'Editar categoría':'Crear categoría')+`<section class="panel"><div class="grid"><div><label>Nombre</label><input class="input" id="name" value="${esc(f.name)}"></div><div><label>Categoría padre</label><select id="parent"><option value="">Categoría raíz</option>${cats.filter(c=>!c.parent&&c.status==='active'&&c.id!==s.id).map(c=>`<option value="${c.id}" ${f.parent===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="wide"><label>Descripción</label><textarea id="desc">${esc(f.desc)}</textarea></div>${!editing?`<div class="wide"><strong>Slug que se propondrá</strong><div class="notice">/categoria/${esc(slug||'…')}${slug&&base&&slug!==base?'<br><strong>Se aplicó un sufijo porque el slug base ya existe.</strong>':''}</div></div>`:''}</div><div class="row"><button class="btn" data-a="back">Cancelar</button><button class="btn primary" id="review">${editing?'Guardar cambios':'Revisar creación'}</button></div></section>`;document.getElementById('name').oninput=e=>{s.form.name=e.target.value;render()};document.getElementById('parent').onchange=e=>s.form.parent=e.target.value;document.getElementById('desc').oninput=e=>s.form.desc=e.target.value;document.getElementById('review').onclick=()=>{if(!s.form.name.trim())return;if(editing){Object.assign(cat,{name:s.form.name, parent:s.form.parent||null});s.view='tree';render()}else{s.view='confirm';render()}};bind()}
function confirmSlug(){const base=norm(s.form.name),slug=unique(base);app.innerHTML=head('Confirmar creación')+`${s.slugNotice?`<div class="notice" role="status"><strong>${esc(s.slugNotice)}</strong></div>`:''}<section class="panel"><h2>${esc(s.form.name)}</h2><p>Revisa la URL pública antes de completar la creación.</p><div class="notice"><strong>/categoria/${esc(slug)}</strong>${slug!==base?'<p>El slug base ya estaba ocupado y se resolvió con un sufijo. No se aplicará hasta que confirmes.</p>':''}</div><div class="row"><button class="btn" data-a="editback">Volver y editar</button><button class="btn primary" id="confirmCreate">Confirmar creación</button></div></section>`;document.getElementById('confirmCreate').onclick=()=>{const simulate=new URLSearchParams(location.search).get('state')==='slug-conflict'&&!s.conflictUsed;if(simulate){occupiedSlugs.push(slug);s.conflictUsed=true;s.slugNotice='La URL dejó de estar disponible mientras confirmabas. Generamos una nueva propuesta; revísala antes de continuar.';render();return}s.slugNotice=null;cats.push({id:'c'+Date.now(),name:s.form.name,slug,parent:s.form.parent||null,status:'active',products:0});s.view='tree';s.form=null;render()};bind()}
function detail(){const c=cats.find(x=>x.id===s.id);app.innerHTML=head(c.name,'<button class="btn" data-a="edit">Editar</button>')+`<section class="panel"><p><strong>Estado:</strong> ${c.status==='active'?'Activo':'Inactivo'}</p><p><strong>Slug:</strong> /categoria/${esc(c.slug)}</p><p><strong>Padre:</strong> ${c.parent?esc(cats.find(x=>x.id===c.parent)?.name):'Categoría raíz'}</p><div class="row"><button class="btn" data-a="back">Volver</button></div></section>`;bind()}function bind(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,id=b.dataset.id;if(a==='new'){s.id=null;s.form=blank();s.slugNotice=null;s.conflictUsed=false;s.view='form';render()}if(a==='detail'){s.id=id;s.view='detail';render()}if(a==='edit'){const c=cats.find(x=>x.id===s.id);s.form={name:c.name,desc:'',parent:c.parent||''};s.view='form';render()}if(a==='back'){s.view='tree';render()}if(a==='editback'){s.view='form';render()}if(a==='de'){s.id=id;deModal.classList.add('open')}if(a==='react'){const c=cats.find(x=>x.id===id),p=c.parent?cats.find(x=>x.id===c.parent):null;if(p&&p.status!=='active'){s.pending='Reactiva primero la categoría padre.'}else c.status='active';render()}})}
deCancel.onclick=()=>deModal.classList.remove('open');deGo.onclick=()=>{deModal.classList.remove('open');const c=cats.find(x=>x.id===s.id);s.pending='Verificando dependencias… La categoría continúa activa.';render();setTimeout(()=>{const children=cats.some(x=>x.parent===c.id&&x.status==='active');if(children||c.products>0){s.pending='No se pudo desactivar: existen dependencias activas. No se registró ningún cambio.'}else{c.status='inactive';s.pending='Desactivación confirmada.'}render()},900)};render();
</script></body></html>
