<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de marcas</title><style>
:root{--a:#f3f4f6;--b:#D1D5DB;--c:#d1d5db;--m:#6b7280;--k:#111827}*{box-sizing:border-box}body{margin:0;color:var(--k);font:16px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;min-height:44px}.top{border-bottom:1px solid var(--c)}.topin,.wrap{max-width:1200px;margin:auto;padding:16px 24px}.topin,.head,.row{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:700}.muted{color:var(--m)}.wrap{padding-top:32px}.head h1{font-size:clamp(26px,4vw,36px);margin:0}.btn{border:1px solid var(--k);background:#fff;padding:10px 14px;border-radius:4px}.primary{background:var(--k);color:#fff}.panel{border:1px solid var(--c);padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{font-weight:600;display:block}.input,select,textarea{width:100%;border:1px solid var(--c);padding:10px;background:#fff}.error{font-size:13px;font-weight:700}.tablewrap{overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:left}th{background:var(--a)}.notice{border:2px solid var(--k);padding:14px;margin:12px 0}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.dialog{background:#fff;border:2px solid var(--k);width:min(600px,calc(100vw - 32px));padding:20px}.cards{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.desktop{display:none}.cards{display:block}}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.topin,.head{display:block}.row{flex-wrap:wrap}.row>.btn{flex:1 1 100%}}
</style></head><body><header class="top"><div class="topin"><div class="brand">PO Productos y ofertas</div><div class="muted">Productos / Marcas</div></div></header><main class="wrap" id="app"></main><div class="overlay" id="modal"><section class="dialog"><h2>Desactivar marca</h2><p>Comprobaremos que no tenga productos activos.</p><div class="row"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="go">Continuar</button></div></section></div><script>
const countries={PE:'Perú',US:'Estados Unidos',DE:'Alemania',IT:'Italia',CL:'Chile'};let brands=[{id:'nike',name:'Nike',country:'US',active:true,products:4},{id:'adidas',name:'Adidas',country:'DE',active:true,products:0},{id:'wilson',name:'Wilson',country:'US',active:false,products:0}];const s={view:'list',id:null,form:null,msg:null},app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=x=>x.trim().toLowerCase();function head(t,a=''){return `<div class="head"><h1>${t}</h1><div>${a}</div></div>`}function render(){s.view==='list'?list():s.view==='form'?form():detail()}function list(){app.innerHTML=head('Gestión de marcas','<button class="btn primary" data-a="new">Crear marca</button>')+(s.msg?`<div class="notice">${esc(s.msg)}</div>`:'')+`<div class="desktop tablewrap"><table><thead><tr><th>Marca</th><th>País</th><th>Productos activos</th><th>Estado</th><th></th></tr></thead><tbody>${brands.map(b=>`<tr><td>${esc(b.name)}</td><td>${countries[b.country]||'Sin país'}</td><td>${b.products}</td><td>${b.active?'Activo':'Inactivo'}</td><td><button class="btn" data-a="detail" data-id="${b.id}">Ver</button></td></tr>`).join('')}</tbody></table></div><div class="cards">${brands.map(b=>`<article class="panel"><strong>${esc(b.name)}</strong><p>${b.active?'Activo':'Inactivo'}</p><button class="btn" data-a="detail" data-id="${b.id}">Ver</button></article>`).join('')}</div>`;bind()}function blank(){return{name:'',country:''}}function form(){const f=s.form;app.innerHTML=head(s.id?'Editar marca':'Crear marca')+`<form id="f" class="panel"><div class="grid"><div><label>Nombre</label><input class="input" id="name" value="${esc(f.name)}"><div class="muted">Único entre marcas activas e inactivas.</div><div class="error" id="en"></div></div><div><label>País de origen</label><select id="country"><option value="">Sin país</option>${Object.entries(countries).map(([k,v])=>`<option value="${k}" ${f.country===k?'selected':''}>${v} (${k})</option>`).join('')}</select></div><div class="wide"><label>Logo</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"><div class="muted">PNG, JPG/JPEG o WebP. Máximo 5 MB.</div><div class="error" id="el"></div></div></div><div class="row"><button type="button" class="btn" data-a="back">Cancelar</button><button class="btn primary">Guardar</button></div></form>`;bind();logo.onchange=e=>{const f=e.target.files?.[0];el.textContent='';if(f&&(f.size>5*1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type))){el.textContent='Usa PNG, JPG/JPEG o WebP de hasta 5 MB.';e.target.value=''}};document.getElementById('f').onsubmit=save}function save(e){e.preventDefault();const name=document.getElementById('name').value.trim();if(!name||brands.some(b=>b.id!==s.id&&norm(b.name)===norm(name))){en.textContent=name?'Ya existe una marca registrada con ese nombre.':'Ingresa un nombre.';return}let b=s.id?brands.find(x=>x.id===s.id):{id:'b'+Date.now(),active:true,products:0};b.name=name;b.country=country.value;if(!s.id)brands.push(b);s.view='list';render()}function detail(){const b=brands.find(x=>x.id===s.id);app.innerHTML=head(b.name,'<button class="btn" data-a="edit">Editar</button>')+`<section class="panel"><p>Estado: <strong>${b.active?'Activo':'Inactivo'}</strong></p><p>País: ${countries[b.country]||'Sin país'}</p><p>Productos activos: ${b.products}</p><div class="row"><button class="btn" data-a="back">Volver</button>${b.active?'<button class="btn primary" data-a="de">Desactivar</button>':'<button class="btn primary" data-a="react">Reactivar</button>'}</div></section>`;bind()}function bind(){document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{const a=x.dataset.a,id=x.dataset.id;if(a==='new'){s.id=null;s.form=blank();s.view='form';render()}if(a==='detail'){s.id=id;s.view='detail';render()}if(a==='edit'){const b=brands.find(y=>y.id===s.id);s.form={name:b.name,country:b.country};s.view='form';render()}if(a==='back'){s.view='list';render()}if(a==='de')modal.classList.add('open');if(a==='react'){brands.find(y=>y.id===s.id).active=true;s.view='list';render()}})}cancel.onclick=()=>modal.classList.remove('open');go.onclick=()=>{modal.classList.remove('open');const b=brands.find(y=>y.id===s.id);s.msg='Verificando productos activos… La marca continúa activa.';s.view='list';render();setTimeout(()=>{if(b.products){s.msg='No se puede desactivar: existen productos activos. No se realizó ningún cambio.'}else{b.active=false;s.msg='Desactivación confirmada.'}render()},800)};render();
</script></body></html>
