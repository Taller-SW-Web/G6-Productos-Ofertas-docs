      - discount_amount
      - result_amount
      - currency
    ValidarCuponRequest:
      type: object
      properties:
        coupon_code:
          type: string
        customer_ref:
          oneOf:
          - type: string
            format: uuid
            description: 'Referencia opaca del cliente: claim sub del token de acceso emitido por Seguridad.'
          - type: 'null'
          description: Security user sub. Opcional cuando el beneficio no tiene límite por cliente; si el cupón exige max_usos_por_cliente
            y falta, la evaluación devuelve CUSTOMER_REF_REQUERIDO. Nunca usar aquí el sub de un token de servicio.
        channel_id:
          $ref: '#/components/schemas/Canal'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineaCompra'
          minItems: 1
      required:
      - coupon_code
      - channel_id
      - lines
    BeneficioCupon:
      type: object
      properties:
        promotion_id:
          type: string
      required:
      - promotion_id
