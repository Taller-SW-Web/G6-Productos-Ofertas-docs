        técnica.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT humano emitido por Seguridad y Usuarios para operaciones administrativas cuando corresponda.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Identificador de correlación extremo a extremo.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Clave idempotente obligatoria para mutaciones de inventario iniciadas por Ventas/Postventa.
    Pagina:
      name: pagina
