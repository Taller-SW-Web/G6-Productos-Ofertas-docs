                      type: string
                      enum: &id694
                      - VIGENCIA_SUPERPUESTA
                  required:
                  - status
                  - code
        '422':
          description: Error
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 422
                    code:
                      type: string
                      enum: &id695
                      - PRECIO_INVALIDO
                      - OFERTA_INVALIDA
                      - SCOPE_PRECIO_INVALIDO
                  required:
                  - status
                  - code
      x-error-codes:
        '401': *id688
        '403': *id689
        '500': *id690
        '503': *id691
        '400': *id692
        '404': *id693
        '409': *id694
        '422': *id695
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramacionPrecioRequest'
components:
