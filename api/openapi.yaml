x-integration-decisions:
  service_audience: api-productos
  commercial_role: GESTOR_COMERCIAL
  inventory_owner: Productos y Ofertas
  order_owner: Ventas y Postventa
  inventory_orchestrator: Ventas y Postventa
  inventory_flow:
  - CREADO -> reserva
  - PAGADO -> consumo definitivo
  - PAGO_NO_COMPLETADO/anulación pre-consumo -> liberación
  - devolución/retorno físicamente reintegrable -> reintegro por Ventas/Postventa
  - venta Retail offline sincronizada -> conciliación solicitada por Ventas/Postventa
  channels_inventory_role: Marketplace y Chatbot solo consultan. Retail consulta y además puede reportar/resolver incidencias físicas;
    ninguna venta de canal reserva, consume, libera o reintegra stock directamente.
  packaging_owner: Despacho y Entrega
  inventory_balance_formula: available = max(on_hand - reserved - blocked, 0)
  retail_physical_incidents: Retail reporta hechos físicos; inventory-svc decide y persiste el efecto sobre blocked/on_hand.
  chatbot_a5: Closed. Chatbot uses published Productos routes. Recommendation route is GET /recomendaciones, not /recomendaciones/candidatos.
  chatbot_a6: Closed. Chatbot sends destino + lineas(sku,cantidad) to Despacho; Despacho calls /productos/datos-fisicos/consulta with
    modulo-despacho credentials. Chatbot does not calculate kg/m3.
  chatbot_a7: Closed. GET /productos supports q for free-text search.
  coupon_consumption_transport: Contrato asíncrono lógico consolidado en asyncapi/asyncapi.yaml 0.4.0. No se introduce endpoint HTTP
    público adicional.
  catalog_pricing_initialization: Catalog initializes the product-level base price via pricing.product.initialization.requested.
  catalog_inventory_initialization: Catalog initializes every sellable SKU via inventory.sku.initialization.requested.
  warehouse_transfer_reception: TRASLADO_ALMACEN_CENTRAL is received by a human inventory operator inside Productos y Ofertas. Retail
    initiates the transfer through incident resolution; Dispatch does not own stock re-entry.
  warehouse_transfer_authorization: No new global Security role. userBearer is mapped locally by sub to capabilities INVENTARIO_TRASLADOS_LEER
    and INVENTARIO_TRASLADOS_RECIBIR.
