        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tamanio
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoProducto'
        description: Filtro de backoffice/usuario autorizado. Las identidades de canal no pueden usarlo para ampliar visibilidad.
      - name: precioMin
        in: query
        schema:
          type: number
          minimum: 0
      - name: precioMax
        in: query
        schema:
          type: number
          minimum: 0
      - name: orden
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrdenCatalogo'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProductosComercial'
        '400':
          description: Solicitud inválida
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
