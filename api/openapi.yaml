      summary: Confirmar recepción total o parcial de un traslado
      description: Operación humana de Inventario. El origen ya descontó las unidades bloqueadas cuando creó el traslado. En destino,
        REINGRESAR_DISPONIBLE incrementa on_hand y available; REINGRESAR_BLOQUEADO incrementa on_hand y blocked; CONFIRMAR_MERMA no
        acredita stock. Si final_receipt=true y faltan unidades, el traslado queda COMPLETADO_CON_DISCREPANCIA.
      security:
      - userBearer: []
      x-required-local-capability: INVENTARIO_TRASLADOS_RECIBIR
      parameters:
      - name: trasladoId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepcionTrasladoInventarioRequest'
      responses:
        '200':
          description: Recepción aplicada idempotentemente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecepcionTrasladoInventarioResponse'
        '404':
          description: Traslado no encontrado
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 404
                    code:
                      type: string
                      enum:
                      - TRASLADO_NO_ENCONTRADO
                  required:
                  - status
                  - code
        '409':
          description: Conflicto de idempotencia o traslado cerrado/no recibible
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 409
                    code:
                      type: string
                      enum:
                      - IDEMPOTENCY_CONFLICT
                      - TRASLADO_NO_RECIBIBLE
                  required:
                  - status
                  - code
        '422':
          description: Recepción no procesable
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 422
                    code:
                      type: string
                      enum:
                      - CANTIDAD_RECIBIDA_EXCEDE_TRASLADO
                      - DISPOSICION_RECEPCION_INVALIDA
                  required:
                  - status
                  - code
        '401': *id710
        '403': *id711
        '500': *id712
        '503': *id713
      x-error-codes:
        '401':
        - TOKEN_INVALIDO
        '403':
        - SCOPE_INSUFICIENTE
        '404':
        - TRASLADO_NO_ENCONTRADO
        '409':
        - IDEMPOTENCY_CONFLICT
        - TRASLADO_NO_RECIBIBLE
        '422':
        - CANTIDAD_RECIBIDA_EXCEDE_TRASLADO
        - DISPOSICION_RECEPCION_INVALIDA
        '500':
        - ERROR_INTERNO
        '503':
        - SERVICIO_NO_DISPONIBLE
