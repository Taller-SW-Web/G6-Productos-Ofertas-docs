components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de servicio emitido por Seguridad y Usuarios. El receptor valida firma mediante JWKS, `iss`, `exp`, `tipo=servicio`,
        que `aud` contenga `api-productos` y el scope declarado en `x-required-scope`. En 0.3.7-p0 toda operación que admite `serviceBearer`
        declara un scope propio de `api-productos`; el `sub` identifica el `client_id` del módulo consumidor. `x-scope-registration-status`
        indica si la concesión ya fue registrada en Seguridad.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT humano emitido por Seguridad y Usuarios. La validación ordinaria se realiza localmente con JWKS; las operaciones
        comerciales comprueban `GESTOR_COMERCIAL` en `roles` cuando corresponda. Las mutaciones de precio marcadas con `x-auth-validation=introspection`
        requieren además introspección previa.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Identificador de correlación extremo a extremo.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Clave idempotente obligatoria para mutaciones de inventario iniciadas por Ventas/Postventa.
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamanio:
      name: tamanio
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    EstadoEntidadQuery:
      name: estado
      in: query
      schema:
        $ref: '#/components/schemas/EstadoEntidad'
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: string
    VarianteId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
    ComboId:
      name: comboId
      in: path
      required: true
      schema:
        type: string
    CuponId:
      name: cuponId
      in: path
      required: true
      schema:
        type: string
    PromocionId:
      name: promocionId
      in: path
      required: true
      schema:
        type: string
    ReglaId:
      name: reglaId
      in: path
      required: true
      schema:
        type: string
    CategoriaId:
      name: categoriaId
      in: path
      required: true
      schema:
        type: string
    CaracteristicaId:
      name: caracteristicaId
      in: path
      required: true
      schema:
        type: string
    ValorId:
      name: valorId
      in: path
      required: true
      schema:
        type: string
    TipoProductoId:
      name: tipoProductoId
      in: path
      required: true
      schema:
        type: string
    MarcaId:
      name: marcaId
      in: path
      required: true
      schema:
        type: string
    OperationIdPath:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkuPath:
      name: sku
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
    AuditId:
      name: auditId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
      required:
      - title
      - status
      - code
      description: Problema HTTP uniforme basado en RFC 7807. La lógica cliente debe usar code; title y detail son texto humano.
      x-error-catalog: api/catalogo-errores.md
    Canal:
      type: string
      enum:
      - MARKETPLACE
      - CHATBOT
      - RETAIL
      - VENTAS
    EstadoProducto:
      type: string
      enum:
      - BORRADOR
      - ACTIVO
      - INACTIVO
    EstadoStock:
      type: string
      enum:
      - DISPONIBLE
      - STOCK_BAJO
      - AGOTADO
    Atributo:
      type: object
      properties:
        caracteristica_id:
          type: string
        nombre:
          type: string
        valor_id:
          type:
          - string
          - 'null'
        valor: {}
      required:
      - caracteristica_id
      - nombre
      - valor
    Variante:
      type: object
      properties:
        variant_id:
          type: string
        sku:
          type: string
        status:
          type: string
          enum:
          - BORRADOR
          - ACTIVA
          - INACTIVA
        identifying_attributes:
          type: array
          items:
            $ref: '#/components/schemas/Atributo'
        non_identifying_attributes:
          type: array
          items:
            $ref: '#/components/schemas/Atributo'
        images:
          type: array
          items:
            type: string
            format: uri
        physical_profile:
          oneOf:
          - $ref: '#/components/schemas/DatosFisicosSku'
          - type: 'null'
        catalog_version:
          type: integer
          minimum: 0
      required:
      - variant_id
      - sku
      - status
    ProductoResumen:
      type: object
      properties:
        product_id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        categoria_id:
          type: string
        tipo_producto_id:
          type: string
        marca_id:
          type: string
        tiene_variantes:
          type: boolean
        sku_base:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/EstadoProducto'
        images:
          type: array
          items:
            type: string
            format: uri
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Atributo'
        catalog_version:
          type: integer
          minimum: 0
        perfil_fisico:
          oneOf:
          - $ref: '#/components/schemas/DatosFisicosSku'
          - type: 'null'
          description: Solo representa al producto simple; el producto con variantes no tiene perfil físico único.
        pricing_preparado:
          type: boolean
        inventario_inicializado:
          type: boolean
      required:
      - product_id
      - slug
      - name
      - categoria_id
      - tipo_producto_id
      - marca_id
      - tiene_variantes
      - status
    ProductoDetalle:
      allOf:
      - $ref: '#/components/schemas/ProductoResumen'
      - type: object
        properties:
          variants:
            type: array
            items:
              $ref: '#/components/schemas/Variante'
        required:
        - variants
    PaginaProductos:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductoResumen'
        pagina:
          type: integer
          minimum: 1
        tamanio:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
      required:
      - items
      - pagina
      - tamanio
      - total
    Categoria:
      type: object
      properties:
        categoria_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
      required:
      - categoria_id
      - name
      - status
    Marca:
      type: object
      properties:
        marca_id:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        logo_url:
          type:
          - string
          - 'null'
          format: uri
        country_code:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
      required:
      - marca_id
      - name
      - status
    Precio:
      type: object
      properties:
        sku:
          type: string
        precio_regular:
          type: number
          exclusiveMinimum: 0
        precio_oferta:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
        currency:
          type: string
          default: PEN
        channel_id:
          oneOf:
          - $ref: '#/components/schemas/Canal'
          - type: 'null'
          description: Canal efectivo de la vigencia resuelta. Es null cuando el precio efectivo corresponde al alcance global.
        valid_from:
          type: string
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
        price_version:
          type: integer
          minimum: 0
        vigencia_id:
          type: string
          minLength: 1
          description: Identificador de la vigencia temporal que respalda el precio resuelto, incluidas las consultas históricas as-of.
        origen:
          type: string
          enum:
          - PRODUCTO
          - SKU_OVERRIDE
          description: 'Origen efectivo del precio: PRODUCTO cuando el SKU usa o hereda el precio base del producto; SKU_OVERRIDE cuando
            existe un precio específico del SKU.'
      required:
      - sku
      - precio_regular
      - currency
      - channel_id
      - valid_from
      - price_version
      - vigencia_id
      - origen
    ConsultaPrecios:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Precio'
      required:
      - items
    LineaCompra:
      type: object
      properties:
        product_id:
          type:
          - string
          - 'null'
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
      - sku
      - quantity
    PromocionResumen:
      type: object
      properties:
        promotion_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
        valid_from:
          type: string
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Canal'
