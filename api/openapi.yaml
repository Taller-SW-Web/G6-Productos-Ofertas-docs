openapi: 3.1.0
info:
  title: API — Productos y Ofertas
  version: 0.5.0
  summary: Contrato HTTP de integración y administración del módulo Productos y Ofertas
  description: Contrato HTTP consolidado P0/P1/P2 del módulo Productos y Ofertas. P2 cierra la recepción de traslados internos de Inventario
    y la autorización local del operador de inventario. La topología RabbitMQ física se documenta en AsyncAPI 0.4.0 y api/rabbitmq-topologia.md.
servers:
- url: /api/v1
  description: Base relativa del módulo
tags:
- name: Productos
  description: Catálogo comercial, administración de productos y detalle.
- name: Variantes
  description: Administración de variantes y SKU vendibles.
- name: Taxonomía
  description: Categorías, marcas, características, tipos de producto y operaciones maestras.
- name: Precios
  description: Consulta, actualización, programación e importación de precios.
- name: Auditoría de precios
  description: Consulta y exportación append-only del historial de precios.
- name: Promociones
  description: Administración y evaluación de promociones.
- name: Cupones
  description: Administración y validación de cupones.
- name: Recomendaciones
  description: Cross-sell, upsell y reglas administrativas.
- name: Combos
  description: Administración y disponibilidad informativa de combos.
- name: Inventario
  description: Disponibilidad, reserva/consumo, umbrales y dashboard operativo.
- name: Carga masiva
  description: Importación/exportación general de catálogo por SKU.
- name: Despacho
  description: Datos físicos de SKU para Despacho.
- name: SEO
  description: Metadatos, slug e historial/resolución.
paths:
  /productos:
    get:
      tags:
      - Productos
      operationId: listarProductos
      summary: Listar y buscar productos comercialmente activos
      x-status: stable
      x-source-spec:
      - SPEC-003
      - SPEC-004
      x-consumers:
      - Marketplace
      - Chatbot
      - Retail
      - Ventas/Postventa
      x-service-audience: api-productos
      x-required-scope: catalogo:leer
      x-scope-registration-status: pending-security-registration
      security:
      - userBearer: []
      - serviceBearer: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: categoriaId
        in: query
        schema:
          type: string
      - name: marcaId
        in: query
        schema:
          type: string
      - name: canal
