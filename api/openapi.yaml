openapi: 3.1.0
info:
  title: API — Productos y Ofertas
  version: 0.3.5-p0
  summary: Contrato HTTP P0 de integración y administración del módulo Productos y Ofertas
  description: Contrato HTTP del módulo Productos y Ofertas. Conserva los endpoints P0 de integración y añade cobertura administrativa
    para las 16 funcionalidades documentadas. Las rutas cuya forma exacta no estaba prescrita por una SPEC se marcan x-status=provisional-internal
    y x-route-basis=derived-from-capability. Las SPEC siguen siendo la fuente de verdad de reglas de negocio; OpenAPI gobierna
    la interfaz HTTP.
servers:
- url: /api/v1
  description: Base relativa del módulo
tags:
- name: Productos
  description: Catálogo comercial, administración de productos y detalle.
- name: Variantes
  description: Administración de variantes y SKU vendibles.
- name: Taxonomía
  description: Categorías, marcas, características, tipos de producto y operaciones maestras.
- name: Precios
  description: Consulta, actualización, programación e importación de precios.
- name: Auditoría de precios
  description: Consulta y exportación append-only del historial de precios.
- name: Promociones
  description: Administración y evaluación de promociones.
- name: Cupones
  description: Administración y validación de cupones.
- name: Recomendaciones
  description: Cross-sell, upsell y reglas administrativas.
- name: Combos
  description: Administración y disponibilidad informativa de combos.
- name: Inventario
  description: Disponibilidad, reserva/consumo, umbrales y dashboard operativo.
- name: Carga masiva
  description: Importación/exportación general de catálogo por SKU.
- name: Despacho
  description: Datos físicos de SKU para Despacho.
- name: SEO
  description: Metadatos, slug e historial/resolución.
paths:
