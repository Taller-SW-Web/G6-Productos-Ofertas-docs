      properties:
        promotion_id:
          type:
          - string
          - 'null'
        original_amount:
          type: number
          minimum: 0
        discount_amount:
          type: number
          minimum: 0
        result_amount:
          type: number
          minimum: 0
        currency:
          type: string
          default: PEN
        reason:
          type:
          - string
          - 'null'
      required:
