        customer_ref:
          oneOf:
          - type: string
            format: uuid
            description: 'Referencia opaca del cliente: claim sub del token de acceso emitido por Seguridad.'
          - type: 'null'
          description: Security user sub. Opcional cuando el beneficio no tiene límite por cliente; si el cupón exige max_usos_por_cliente
            y falta, la evaluación devuelve CUSTOMER_REF_REQUERIDO. Nunca usar aquí el sub de un token de servicio.
