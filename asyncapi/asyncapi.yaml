x-contract-authority:
  http: api/openapi.yaml
  async: asyncapi/asyncapi.yaml
  business_rules: specs/
  human_integration_contract: Contrato_Api.md
x-delivery-policy:
  delivery: at-least-once
  global_ordering: false
  producer_pattern: transactional-outbox
  consumer_pattern: inbox-deduplication
  deduplication_key: message_id
  business_rejection_is_dlq: false
  ack_means_business_success: false
x-versioning:
  message_field: schema_version
  compatible_change: nuevo campo opcional sin cambiar semántica
  breaking_change: nueva versión de schema/mensaje antes de retirar la anterior
x-known-semantic-debt:
  - contract: inventory.consumption.rejected
    issue: OpenAPI P0 lo usa también como rechazo de RESERVAR. Se conserva para no romper el contrato actual; 
      operation_type distingue el caso.
    decision_needed: Evaluar en versión futura un resultado de rechazo específico para reserva.
x-deferred-contracts:
  - Nombres/payloads de la preparación inicial de precio desde Catálogo hacia Pricing.
  - Nombres/payloads de inicialización de SKU desde Catálogo hacia Inventario.
  - Comando externo homologado de consumo de cupón desde Ventas/Postventa.
  - Contrato asíncrono de reintegro de stock por devolución aceptada.
  - Exchanges, queues, binding keys físicos, retry queues y DLQ.
  - Permisos/scopes definitivos de los contratos externos aún marcados como provisionales.
x-payload-naming:
  envelope: Campos técnicos transversales definidos por Arquitectura.md conservan snake_case en inglés.
  data: Cuando una SPEC ya define nombres de negocio/campos, el payload conserva esa terminología (por ejemplo 
    tipo_precio, precio_anterior, cupon_id, operacion).
x-idempotency:
  http_identity:
    - Idempotency-Key
    - operation_id
  same_identity_same_semantics: replay-known-result-without-new-effects
  same_identity_different_semantics: HTTP 409 IDEMPOTENCY_CONFLICT
  deprecated_code: OPERACION_DUPLICADA
  correlation_id_is_not_idempotency_key: true
