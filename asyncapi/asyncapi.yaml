          format: date-time
      required:
        - order_id
        - reservation_id
        - operation_type
        - lines
        - completed_at
      additionalProperties: true
    InventoryConsumptionRejectedData:
      type: object
      description: Resultado asíncrono de rechazo de negocio para una reserva o confirmación ya admitida. operation_type
        distingue RESERVAR de CONFIRMAR_CONSUMO. Conflictos de idempotencia detectados durante la admisión HTTP se 
        responden como 409 IDEMPOTENCY_CONFLICT y no se publican como un segundo resultado asíncrono.
      properties:
        order_id:
          type: string
        reservation_id:
          oneOf:
            - type: string
            - type: 'null'
        operation_type:
          type: string
          enum:
            - RESERVAR
            - CONFIRMAR_CONSUMO
        detail:
          oneOf:
            - type: string
            - type: 'null'
          description: Detalle humano no estable; no usar para branching.
        rejected_at:
          type: string
          format: date-time
        code:
          type: string
          description: Código estable para lógica del consumidor.
          enum:
            - STOCK_INSUFICIENTE
            - SKU_NO_ENCONTRADO
            - SKU_INACTIVO
            - UBICACION_NO_ENCONTRADA
            - RESERVA_NO_ENCONTRADA
            - RESERVA_NO_ACTIVA
            - RESERVA_EXPIRADA
            - CANTIDAD_INVALIDA
      required:
        - order_id
        - operation_type
        - code
        - rejected_at
      additionalProperties: true
    PriceChangedData:
      type: object
      description: Contrato de auditoría de Pricing emitido exclusivamente después del commit.
      properties:
        sku:
          type: string
        product_id:
          type: string
        channel_id:
          oneOf:
            - type: string
            - type: 'null'
          description: Nulo significa precio global.
        valid_from:
          oneOf:
            - type: string
            - type: 'null'
          description: Inicio de vigencia cuando aplique.
        valid_until:
          oneOf:
            - type: string
            - type: 'null'
          description: Fin de vigencia cuando aplique.
        price_version:
          type: integer
          minimum: 0
        batch_id:
          oneOf:
            - type: string
            - type: 'null'
        timestamp:
          type: string
          description: Timestamp UTC del contrato de auditoría.
          format: date-time
        tipo_precio:
          type: string
          description: Tipo de precio.
          enum:
            - REGULAR
            - OFERTA
        precio_anterior:
          oneOf:
            - type: number
              minimum: 0
            - type: 'null'
          description: Nulo para CREACION.
        precio_nuevo:
          oneOf:
            - type: number
              minimum: 0
            - type: 'null'
          description: Nulo para RETIRO_OFERTA.
        variacion_porcentual:
          oneOf:
            - type: number
            - type: 'null'
          description: Nulo para CREACION y RETIRO_OFERTA.
        tipo_operacion:
          type: string
          enum:
            - CREACION
            - MODIFICACION
            - RETIRO_OFERTA
        moneda:
          type: string
          description: Moneda ISO 4217.
          minLength: 3
        canal_origen:
          type: string
          description: Canal/origen de la mutación, por ejemplo BACKOFFICE o BULK_IMPORT.
        motivo_cambio:
          type: string
          description: Motivo obligatorio del cambio.
        usuario_id:
          oneOf:
            - type: string
            - type: 'null'
        usuario_email:
          oneOf:
            - type: string
            - type: 'null'
        ip_origen:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - sku
        - product_id
        - tipo_precio
        - precio_anterior
        - precio_nuevo
        - variacion_porcentual
        - tipo_operacion
        - moneda
        - price_version
        - canal_origen
        - motivo_cambio
        - timestamp
      additionalProperties: true
