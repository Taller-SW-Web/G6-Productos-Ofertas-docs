  schemas:
    ActorContext:
      type: object
      description: Contexto mínimo del actor que originó la operación. No sustituye al token ni debe contener secretos.
      properties:
        user_id:
          oneOf:
            - type: string
            - type: 'null'
          description: Identificador opaco de usuario cuando la acción proviene de una persona.
        service_id:
          oneOf:
            - type: string
            - type: 'null'
          description: Identificador del servicio originador, por ejemplo modulo-ventas o bulk-svc.
        channel:
          oneOf:
            - type: string
            - type: 'null'
          description: Canal de negocio cuando aplique, por ejemplo BACKOFFICE, MARKETPLACE, CHATBOT o RETAIL.
      additionalProperties: true
    EnvelopeBase:
      type: object
      description: Envelope canónico de mensajería. message_id es la identidad de deduplicación y reemplaza 
        semánticamente los antiguos event_id/command_id cuando se use este contrato.
      properties:
        message_id:
          type: string
          description: Identificador global del mensaje.
          format: uuid
        kind:
          type: string
          description: Semántica del mensaje.
          enum:
            - command
            - event
            - result
        name:
          type: string
          description: Nombre contractual domain.entity.action.
        schema_version:
          type: integer
          description: Versión del payload del mensaje.
          minimum: 1
        operation_id:
          type: string
          description: Identificador idempotente de la operación de negocio.
          format: uuid
        correlation_id:
          type: string
          description: Identificador para correlacionar un flujo extremo a extremo.
          format: uuid
        causation_id:
          oneOf:
            - type: string
            - type: 'null'
          description: message_id que causó este mensaje cuando exista.
        occurred_at:
          type: string
          description: Fecha/hora UTC de emisión del hecho, comando o resultado.
          format: date-time
        producer:
          type: string
          description: Servicio productor.
        actor:
          $ref: '#/components/schemas/ActorContext'
        data:
          type: object
          description: Payload específico del contrato.
      required:
        - message_id
        - kind
        - name
        - schema_version
        - operation_id
        - correlation_id
        - occurred_at
        - producer
        - data
      additionalProperties: true
    ReservationLine:
      type: object
      properties:
        sku:
          type: string
          description: SKU vendible.
        location_id:
          oneOf:
            - type: string
            - type: 'null'
          description: Ubicación de inventario. Puede ser nula si la asignación ya fue resuelta por el dominio.
        quantity:
          type: integer
          description: Cantidad afectada.
          minimum: 1
      required:
        - sku
        - quantity
      additionalProperties: true
    StockSnapshot:
      type: object
      properties:
        sku:
          type: string
          description: SKU vendible.
        location_id:
          type: string
          description: Ubicación autoritativa del saldo.
        on_hand:
          type: integer
          description: Cantidad física registrada.
          minimum: 0
        reserved:
          type: integer
          description: Cantidad reservada.
          minimum: 0
        available:
          type: integer
          description: Cantidad disponible para nuevas operaciones.
          minimum: 0
        stock_version:
          type: integer
          description: Versión del saldo.
          minimum: 0
        updated_at:
          type: string
          description: Fecha/hora UTC de la versión publicada.
          format: date-time
        estado:
          type: string
          description: Estado derivado de disponibilidad.
          enum:
            - DISPONIBLE
            - STOCK_BAJO
            - AGOTADO
      required:
        - sku
        - location_id
        - on_hand
        - reserved
        - available
        - estado
        - stock_version
        - updated_at
      additionalProperties: true
    InventoryStockChangedData:
      type: object
      description: Hecho canónico para actualizar proyecciones de disponibilidad.
      allOf:
        - $ref: '#/components/schemas/StockSnapshot'
    InventoryStockAdjustedData:
      type: object
      properties:
        sku:
          type: string
        location_id:
          type: string
        previous_on_hand:
          type: integer
          minimum: 0
        new_on_hand:
          type: integer
          minimum: 0
        delta:
          type: integer
        previous_stock_version:
          type: integer
          minimum: 0
        stock_version:
          type: integer
          minimum: 0
        batch_id:
          oneOf:
            - type: string
            - type: 'null'
          description: Lote que originó el ajuste cuando aplica.
        row_id:
          oneOf:
            - type: string
            - type: 'null'
          description: Fila del lote cuando aplica.
        adjusted_at:
          type: string
          format: date-time
        motivo:
          type: string
          description: Motivo del ajuste, por ejemplo BULK_IMPORT.
      required:
        - sku
        - location_id
        - previous_on_hand
        - new_on_hand
        - delta
        - previous_stock_version
        - stock_version
        - motivo
        - adjusted_at
      additionalProperties: true
    ReservationCreatedData:
      type: object
      properties:
        reservation_id:
          type: string
          description: Identificador de la reserva.
        order_id:
          type: string
          description: Pedido de Ventas/Postventa.
        channel_id:
          type: string
          description: Canal de origen del pedido.
        expires_at:
          type: string
          description: Vencimiento de la reserva.
          format: date-time
        lines:
