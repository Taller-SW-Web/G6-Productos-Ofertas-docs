        - estado
        - lines
        - resolved_at
      additionalProperties: true
    InventoryConsumptionCompletedData:
      type: object
      description: Resultado dirigido a Ventas/Postventa para confirmar la aplicación definitiva del consumo.
      properties:
        order_id:
          type: string
        reservation_id:
          type: string
        operation_type:
          type: string
          enum:
            - CONFIRMAR_CONSUMO
        lines:
          type: array
          minItems: 1
