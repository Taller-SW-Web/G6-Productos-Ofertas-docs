asyncapi: 3.0.0
id: urn:taller-sw-web:productos-y-ofertas:asyncapi
info:
  title: Productos y Ofertas — Contrato asíncrono
  version: 0.2.1-p0
  description: Contrato canónico de mensajería del módulo Productos y Ofertas. Formaliza los nombres, envelopes y 
    payloads P0 documentados en Arquitectura.md, Contrato_Api.md y las SPECs. Los comandos HTTP 202 de Inventario se 
    documentan en OpenAPI; este archivo documenta sus resultados/eventos asíncronos. No fija exchanges, queues, DLQ ni 
    nombres físicos de infraestructura.
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}:{port}'
    protocol: amqp
    protocolVersion: 0-9-1
    description: Broker RabbitMQ. Host/puerto y topología física dependen del entorno.
    variables:
      host:
        default: localhost
        description: Host del broker por entorno.
      port:
        default: '5672'
        description: Puerto AMQP por entorno.
    tags:
      - name: RabbitMQ
    x-topology-status: pending-deployment-decision
tags:
  - name: Inventario
    description: Disponibilidad, reservas, consumo y ajustes.
  - name: Pricing
    description: Cambios de precio y coordinación Bulk.
  - name: Catálogo
    description: Productos, SKU y barreras de escritura.
  - name: Taxonomía
    description: Entidades maestras y baja segura.
  - name: Bulk
    description: Coordinación asíncrona por lote/fila.
  - name: Promociones
    description: Resultados de consumo de cupones.
