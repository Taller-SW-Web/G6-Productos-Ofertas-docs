                    status:
                      type: integer
                      const: 404
                    code:
                      type: string
                      enum:
                      - SKU_NO_ENCONTRADO
                  required:
                  - status
                  - code
        '500':
          description: Error interno; resultado puede ser incierto si ocurrió durante persistencia
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
