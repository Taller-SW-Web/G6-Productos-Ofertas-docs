          - NO_CONSUMPTION
        decided_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    ReservationStatusSnapshot:
      type: object
      additionalProperties: false
      properties:
        reservation_id:
          type: string
          format: uuid
        order_id:
          type: string
          minLength: 1
        estado_persistido:
          type: string
          enum:
          - ACTIVA
          - CONSUMIDA
          - LIBERADA
          - EXPIRADA
        expires_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        vigencia_efectiva:
          type: string
          enum:
          - VIGENTE
          - VENCIDA
          - NO_APLICA
        permite_pago:
          type: boolean
        permite_consumo_cupon:
          type: boolean
      required:
      - reservation_id
      - order_id
      - estado_persistido
      - expires_at
      - observed_at
      - vigencia_efectiva
      - permite_pago
      - permite_consumo_cupon
      description: Observación puntual de solo lectura; antes de una mutación irreversible Inventory vuelve a comprobar
        las precondiciones. Estados terminales usan NO_APLICA y ambos indicadores false.
      allOf:
      - if:
          properties:
            estado_persistido:
              const: ACTIVA
          required:
          - estado_persistido
        then:
          properties:
            vigencia_efectiva:
              enum:
              - VIGENTE
              - VENCIDA
      - if:
          properties:
            estado_persistido:
              const: ACTIVA
            vigencia_efectiva:
              const: VIGENTE
          required:
          - estado_persistido
          - vigencia_efectiva
        then:
          properties:
            permite_pago:
              const: true
            permite_consumo_cupon:
              const: true
      - if:
          properties:
            estado_persistido:
              const: ACTIVA
            vigencia_efectiva:
              const: VENCIDA
          required:
          - estado_persistido
          - vigencia_efectiva
        then:
          properties:
            permite_pago:
              const: false
            permite_consumo_cupon:
              const: false
      - if:
          properties:
            estado_persistido:
              enum:
              - CONSUMIDA
              - LIBERADA
              - EXPIRADA
          required:
          - estado_persistido
        then:
          properties:
            vigencia_efectiva:
              const: NO_APLICA
            permite_pago:
              const: false
            permite_consumo_cupon:
              const: false
    BulkContentIntegrity:
