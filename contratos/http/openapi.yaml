      description: 'Primera admisión durable tras commit conjunto de operación e intención Outbox: 202; replay idéntico:
        200 sin efecto nuevo; intención distinta: 409 IDEMPOTENCY_CONFLICT. 202 no implica efecto comercial completado.
        Idempotency-Key ausente/malformado o operation_id ausente/malformado: 400 VALIDACION; ambos UUID válidos
        pero distintos: 409 IDEMPOTENCY_CONFLICT. Reutilizar una identidad con fingerprint distinto también es 409.
        commercial_snapshot_ref es exactamente order_id. Baseline SEMIFINAL_G6, aceptación G5 asumida para planificación,
        homologación formal pendiente.'
      x-owner: promotions-svc
      x-contract-status: SEMIFINAL_G6
