openapi: 3.1.0
info:
  title: API — Productos y Ofertas
  version: 0.7.0-rc.2
  summary: Contrato HTTP de integración y administración del módulo Productos y Ofertas
  description: Baseline semifinal contractual H5 de G6. Estado SEMIFINAL_G6; las nuevas interfaces compartidas permanecen
    PENDIENTE_HOMOLOGACION_EXTERNA. La versión no acredita implementación, validación, habilitación, grants ni despliegue.
    Azure Service Bus Basic se reserva a mensajería interna G6; externos usan HTTP autenticado.
servers:
- url: /api/v1
  description: Base relativa del módulo
tags:
- name: Productos
  description: Catálogo comercial, administración de productos y detalle.
- name: Variantes
  description: Administración de variantes y SKU vendibles.
- name: Taxonomía
  description: Categorías, marcas, características, tipos de producto y operaciones maestras.
- name: Precios
  description: Consulta, actualización, programación e importación de precios.
- name: Auditoría de precios
  description: Consulta y exportación append-only del historial de precios.
- name: Promociones
  description: Administración y evaluación de promociones.
- name: Cupones
  description: Administración y validación de cupones.
- name: Recomendaciones
  description: Cross-sell, upsell y reglas administrativas.
- name: Combos
  description: Administración y disponibilidad informativa de combos.
- name: Inventario
  description: Disponibilidad, reserva/consumo, umbrales y dashboard operativo.
- name: Carga masiva
  description: Importación/exportación general de catálogo por SKU.
- name: Despacho
  description: Datos físicos de SKU para Despacho.
- name: SEO
  description: Metadatos, slug e historial/resolución.
paths:
  /productos/skus/{sku}/contexto:
    get:
      tags:
      - Productos
      operationId: obtenerContextoSku
      summary: Consultar contexto privado de SKU para Pricing
      description: 'Contrato interno de diseño aprobado por Marco para Pricing hacia Catálogo. No es una consulta
        comercial pública. El SKU viaja codificado en el path, sin modificar su valor. Reutiliza el resultado del
        puerto PricingCatalogContext: no calcula precios ni disponibilidad de inventario. Un SKU existente inactivo
        o inelegible devuelve 200 con los flags correspondientes en false; solo la inexistencia devuelve 404. Pricing
        traduce exclusivamente 404 SKU_NO_ENCONTRADO a null en su adaptador; fallos de red, 503 y errores de autorización
        no se convierten en ausencia. Identidad técnica compartida de G6 aprobada internamente por Marco: client_id=modulo-productos,
        tipo=servicio, aud=api-productos y scope existente catalogo:leer. G7 debe confirmar grant, emisión y provisión
        de credenciales. No identifica individualmente a catalog-svc ni a pricing-svc. El aislamiento se aplica
        mediante HTTP privado, restricción de red, autorización por operación y validación JWT; no se publica vía
        Gateway externo ni se aceptan cabeceras arbitrarias como prueba de identidad. No acredita credenciales,
        implementación, compatibilidad runtime ni pruebas integradas.'
      x-status: provisional-internal
      x-internal: true
      x-source-spec:
      - SPEC-003
      - SPEC-004
      - SPEC-013
      x-route-basis: derived-from-capability
      x-consumers:
      - Pricing
      - Promotions
      x-service-audience: api-productos
      x-required-scope: catalogo:leer
      x-scope-registration-status: pending-security-registration
      x-allowed-client-ids:
      - modulo-productos
      security:
      - serviceBearer: []
      parameters:
      - name: sku
        in: path
        required: true
        description: SKU opaco codificado correctamente en el path; conservar el valor original, incluidos ceros
          iniciales, sin recortarlo ni recodificarlo como identidad.
        schema:
          type: string
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Contexto del SKU existente, también si está inactivo o no es comercialmente elegible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingCatalogContext'
              examples:
                simple:
                  value:
                    sku: '000123'
                    productId: producto-ejemplo
                    isVariant: false
                    active: true
                    eligible: true
                variante:
                  value:
                    sku: SKU-V-001
                    productId: producto-padre-ejemplo
                    isVariant: true
                    active: true
                    eligible: true
                inactivo:
                  value:
                    sku: SKU-INACTIVO
                    productId: producto-ejemplo
                    isVariant: false
                    active: false
                    eligible: false
                inelegible:
                  value:
                    sku: SKU-V-002
                    productId: producto-padre-ejemplo
                    isVariant: true
                    active: true
                    eligible: false
        '401':
          description: Autenticación de servicio ausente o inválida, según el contrato de Seguridad existente.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 401
                    code:
                      type: string
                      const: TOKEN_INVALIDO
                  required:
                  - status
                  - code
        '403':
          description: Scope o identidad no autorizados; poseer catalogo:leer sin pertenecer a la allowlist de esta
            operación no concede acceso.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 403
                    code:
                      type: string
                      const: SCOPE_INSUFICIENTE
                  required:
                  - status
                  - code
        '404':
          description: SKU inexistente. El adaptador de Pricing traduce este resultado a null, sin ocultar errores
            técnicos o de autorización.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 404
                    code:
                      type: string
                      const: SKU_NO_ENCONTRADO
                  required:
                  - status
                  - code
              example:
                title: SKU no encontrado
                status: 404
                code: SKU_NO_ENCONTRADO
        '503':
          description: Error técnico o indisponibilidad; nunca se trata como SKU inexistente.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 503
                    code:
                      type: string
                      const: SERVICIO_NO_DISPONIBLE
                  required:
                  - status
                  - code
              example:
                title: Servicio no disponible
                status: 503
                code: SERVICIO_NO_DISPONIBLE
      x-error-codes:
        '401':
        - TOKEN_INVALIDO
        '403':
        - SCOPE_INSUFICIENTE
        '404':
        - SKU_NO_ENCONTRADO
        '503':
        - SERVICIO_NO_DISPONIBLE
  /productos/skus/contexto/lote:
    post:
      tags:
      - Productos
      operationId: obtenerContextosSkuLote
      summary: Consultar contextos privados de SKU para Pricing
      description: 'Operación únicamente de red privada G6; no debe publicarse ni registrarse en Gateway externo.
        Conserva la semántica individual de obtenerContextoSku: cada elemento distingue SKU encontrado de inexistente,
        y context conserva exactamente sku, productId, isVariant, active y eligible. Duplicados y orden de entrada
        se conservan. Inactividad e inelegibilidad son flags del contexto, no se convierten en SKU inexistente.
        Errores técnicos fallan toda la solicitud con 503. Es una consulta POST sin efectos comerciales y no admite
        reintentos automáticos implícitos.'
      x-status: provisional-internal
      x-internal: true
      x-consumers:
      - Pricing
      x-service-audience: api-productos
      x-required-scope: catalogo:leer
      x-scope-registration-status: pending-security-registration
      x-allowed-client-ids:
      - modulo-productos
      security:
      - serviceBearer: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - skus
              properties:
                skus:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[^\u0000]+$
      responses:
        '200':
          description: Un resultado por SKU en el mismo orden, incluidos duplicados.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - sku
                      - status
                      - context
                      properties:
                        sku:
                          type: string
                        status:
                          type: string
                          enum:
                          - FOUND
                          - SKU_NO_ENCONTRADO
                        context:
                          oneOf:
                          - $ref: '#/components/schemas/PricingCatalogContext'
                          - type: 'null'
        '400':
          description: Lote inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Token de servicio ausente o inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Cliente o scope no autorizado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Catálogo o persistencia no disponible; no representa SKU inexistente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-error-codes:
        '400':
        - VALIDACION
        '401':
        - TOKEN_INVALIDO
        '403':
        - SCOPE_INSUFICIENTE
        '503':
        - SERVICIO_NO_DISPONIBLE
  /productos/administracion:
    get:
      tags:
      - Productos
      operationId: listarProductosAdministracion
      summary: Listar productos para administración de Catálogo
      description: Requiere userBearer con rol GESTOR_COMERCIAL. Admite búsqueda q, estado, categoriaId, marcaId,
        pagina/tamanio, y los filtros repetibles de inclusión/exclusión de tipo de producto. Todos los filtros se
        aplican antes del conteo, orden estable (nombre e identidad del producto) y paginación; total y totalPaginas
        corresponden exactamente al universo filtrado. Máximo 100 IDs opacos por filtro; no descargar el catálogo
        completo en el navegador para reconstruir páginas.
      x-status: implemented-candidate
      x-required-role: GESTOR_COMERCIAL
      x-gateway-operation: true
      security:
      - userBearer: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: categoriaId
        in: query
        schema:
          type: string
      - name: marcaId
        in: query
        schema:
          type: string
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoProducto'
      - name: tipoProductoIdsIncluidos
        in: query
        style: form
        explode: true
        description: Repetible; hasta 100 IDs opacos exactos. Filtro antes del total y la página.
        schema:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
      - name: tipoProductoIdsExcluidos
        in: query
        style: form
        explode: true
        description: Repetible; hasta 100 IDs opacos exactos. Filtro antes del total y la página.
        schema:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanio'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página exacta de productos administrativos.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductoResumenAdministracion'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          description: Filtro o paginación inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: JWT humano inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Rol GESTOR_COMERCIAL requerido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Error interno
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Catálogo no disponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-error-codes:
        '400':
        - VALIDACION
        '401':
        - TOKEN_INVALIDO
        '403':
        - SCOPE_INSUFICIENTE
        '500':
        - ERROR_INTERNO
        '503':
        - SERVICIO_NO_DISPONIBLE
  /productos/administracion/{productoId}:
    get:
      tags:
      - Productos
      operationId: obtenerProductoAdministracion
      summary: Obtener un producto para administración de Catálogo
      description: Contrato candidato para la ruta existente en Gateway y Catálogo. Lee un producto por UUID, incluidos
        borradores e inactivos. No aplica elegibilidad comercial ni admite parámetros de consulta.
      x-status: implemented-candidate
      x-required-role: GESTOR_COMERCIAL
      x-gateway-operation: true
      security:
      - userBearer: []
      parameters:
      - name: productoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Detalle administrativo del producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoAdministracionDetalle'
        '400':
          description: Identificador, consulta o correlación inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: JWT humano ausente o inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Identidad o rol no autorizado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Producto inexistente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Error interno
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Seguridad, Gateway o persistencia no disponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-error-codes:
        '400':
        - VALIDACION
        '401':
        - TOKEN_INVALIDO
        '403':
        - SCOPE_INSUFICIENTE
        '404':
        - PRODUCTO_NO_ENCONTRADO
        '500':
        - ERROR_INTERNO
        '503':
        - SERVICIO_NO_DISPONIBLE
  /productos/administracion/skus/resolver:
    post:
      tags:
      - Productos
      operationId: resolverSkusAdministracion
      summary: Resolver SKU de Combos en lote
      description: Consulta lógica de solo lectura para usuarios G6. Requiere JWT humano userBearer y rol GESTOR_COMERCIAL;
        nunca usa identidad técnica ni expone credenciales de servicio al navegador. Acepta SKU opacos exactos,
        incluidos ceros iniciales y caracteres especiales; preserva orden y duplicados. Distingue ELEGIBLE, INACTIVO,
        NO_ELEGIBLE y NO_ENCONTRADO. No ejecuta escritura comercial ni habilita reintentos automáticos inseguros.
        Máximo 100 entradas por solicitud.
      x-status: provisional
      x-required-role: GESTOR_COMERCIAL
      x-gateway-operation: true
      x-consumers:
      - Frontend Combos
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - skus
              properties:
                skus:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[^\u0000]+$
      responses:
        '200':
          description: Resolución autoritativa de cada SKU, en el orden solicitado.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - sku
                      - resultado
                      - productId
                      - nombre
                      - productoPadre
                      - variante
                      - estado
                      - tipoProductoId
                      properties:
                        sku:
                          type: string
                        resultado:
                          type: string
                          enum:
                          - ELEGIBLE
                          - INACTIVO
                          - NO_ELEGIBLE
                          - NO_ENCONTRADO
                        productId:
                          type:
                          - string
                          - 'null'
                        nombre:
                          type:
                          - string
                          - 'null'
                        productoPadre:
                          oneOf:
                          - type: object
                            required:
                            - productId
                            - nombre
                            - estado
                            - tieneVariantes
                            properties:
                              productId:
                                type: string
                              nombre:
                                type: string
                              estado:
                                type: string
                                enum:
                                - BORRADOR
                                - ACTIVO
                                - INACTIVO
                              tieneVariantes:
                                type: boolean
                          - type: 'null'
                        variante:
                          oneOf:
                          - type: object
                            required:
                            - variantId
                            - sku
                            - estado
                            properties:
                              variantId:
                                type: string
                              sku:
                                type: string
                              estado:
                                type: string
                                enum:
                                - BORRADOR
                                - ACTIVA
                                - INACTIVA
                          - type: 'null'
                        estado:
                          type:
                          - string
                          - 'null'
                          enum:
                          - BORRADOR
                          - ACTIVO
                          - INACTIVO
                          - ACTIVA
                          - INACTIVA
                          - null
                        tipoProductoId:
                          type:
                          - string
                          - 'null'
        '400':
          description: Lote o correlación inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: JWT humano ausente o inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: El usuario no tiene GESTOR_COMERCIAL
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Persistencia de Catálogo no disponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-error-codes:
        '400':
        - VALIDACION
        '401':
        - TOKEN_INVALIDO
        '403':
        - SCOPE_INSUFICIENTE
        '503':
        - SERVICIO_NO_DISPONIBLE
  /productos:
    get:
      tags:
      - Productos
      operationId: listarProductos
      summary: Listar y buscar productos comercialmente activos
      x-status: stable
      x-source-spec:
      - SPEC-003
      - SPEC-004
      x-consumers:
      - Marketplace
      - Chatbot
      - Retail
      - Ventas/Postventa
      x-service-audience: api-productos
      x-required-scope: catalogo:leer
      x-scope-registration-status: pending-security-registration
      security:
      - userBearer: []
      - serviceBearer: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: categoriaId
        in: query
        schema:
          type: string
      - name: marcaId
        in: query
        schema:
          type: string
      - name: tipoProductoIdsIncluidos
        in: query
        description: Repetible, máximo 100 identificadores opacos exactos; incluir solo estos tipos. El proveedor
          filtra antes de contar, ordenar y paginar.
        schema:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
        style: form
        explode: true
      - name: tipoProductoIdsExcluidos
        in: query
        description: Repetible, máximo 100 identificadores opacos exactos; excluir estos tipos. Se compone con los
          demás filtros antes de total y paginación.
        schema:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
        style: form
        explode: true
      - name: canal
        in: query
        schema:
          $ref: '#/components/schemas/Canal'
        description: Contexto comercial. Obligatorio semánticamente para consumidores módulo-a-módulo de canal.
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tamanio
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoProducto'
        description: Filtro de backoffice/usuario autorizado. Las identidades de canal no pueden usarlo para ampliar
          visibilidad.
      - name: precioMin
        in: query
        schema:
          type: number
          minimum: 0
        description: Extremo inclusivo en PEN del precio efectivo vigente de Pricing. Se aplica por SKU elegible
          antes de paginar; negativos, no finitos o precioMin > precioMax producen 400 VALIDACION.
      - name: precioMax
        in: query
        schema:
          type: number
          minimum: 0
        description: Extremo inclusivo en PEN del precio efectivo vigente de Pricing. Se aplica por SKU elegible
          antes de paginar; negativos, no finitos o precioMin > precioMax producen 400 VALIDACION.
      - name: orden
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrdenCatalogo'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProductosComercial'
        '400':
          description: Solicitud inválida
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 400
                    code:
                      type: string
                      enum: &id001
                      - VALIDACION
                  required:
                  - status
                  - code
              examples:
                validacion:
                  summary: Datos de entrada inválidos
                  value:
                    type: /errores/validacion
                    title: Datos de entrada inválidos
                    status: 400
                    code: VALIDACION
                    correlationId: 0c0d092e-6192-47c1-8d18-5ed0e2aa4518
        '401':
          description: No autenticado
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    status:
                      type: integer
                      const: 401
                    code:
                      type: string
                      enum: &id002
                      - TOKEN_INVALIDO
                  required:
                  - status
                  - code
              examples:
                token_invalido:
                  summary: Token ausente o inválido
                  value:
                    type: /errores/token-invalido
                    title: Token ausente o inválido
