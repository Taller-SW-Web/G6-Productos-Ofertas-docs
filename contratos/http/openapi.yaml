components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Audiencia api-productos; validar firma, issuer, expiración, tipo, client_id, scope y allowlist
        por operación. Autorización propuesta; grants G7 pendientes.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT humano emitido por Seguridad y Usuarios. La validación ordinaria se realiza localmente con
        JWKS; las operaciones comerciales comprueban `GESTOR_COMERCIAL` en `roles` cuando corresponda. Las mutaciones
        de precio marcadas con `x-auth-validation=introspection` requieren además introspección previa.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Identificador de correlación extremo a extremo.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: Clave de intención. En un mismo consumidor, reutilizarla con misma operación y mismo payload
        semántico devuelve el resultado original, sin nuevos efectos; reutilizarla con distinta operación o payload
        devuelve 409 IDEMPOTENCY_CONFLICT. Debe mantenerse en los reintentos.
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamanio:
      name: tamanio
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    EstadoEntidadQuery:
      name: estado
      in: query
      schema:
        $ref: '#/components/schemas/EstadoEntidad'
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: string
    VarianteId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
    ComboId:
      name: comboId
      in: path
      required: true
      schema:
        type: string
    CuponId:
      name: cuponId
      in: path
      required: true
      schema:
        type: string
    PromocionId:
      name: promocionId
      in: path
      required: true
      schema:
        type: string
    ReglaId:
      name: reglaId
      in: path
      required: true
      schema:
        type: string
    CategoriaId:
      name: categoriaId
      in: path
      required: true
      schema:
        type: string
    CaracteristicaId:
      name: caracteristicaId
      in: path
      required: true
      schema:
        type: string
    ValorId:
      name: valorId
      in: path
      required: true
      schema:
        type: string
    TipoProductoId:
      name: tipoProductoId
      in: path
      required: true
      schema:
        type: string
    MarcaId:
      name: marcaId
      in: path
      required: true
      schema:
        type: string
    OperationIdPath:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkuPath:
      name: sku
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
    AuditId:
      name: auditId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ConsultaOperacionInventario:
      type: object
      description: Estado durable por operation_id, sin divulgar existencias físicas.
      properties:
        operation_id:
          type: string
          format: uuid
        order_id:
          type: string
          minLength: 1
        operation_type:
          type: string
          enum:
          - RESERVAR
          - CONFIRMAR_CONSUMO
          - LIBERAR
          - REINTEGRAR
          - CONCILIAR_OFFLINE
        status:
          type: string
          enum:
          - ACCEPTED
          - PROCESSING
          - COMPLETED
          - REJECTED
          - REQUIRES_REVIEW
        reservation_id:
          type:
          - string
          - 'null'
          format: uuid
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        result_code:
          type:
          - string
          - 'null'
        accepted_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - operation_id
      - order_id
      - operation_type
      - status
      - accepted_at
      allOf:
      - if:
          properties:
            status:
              const: REJECTED
          required:
          - status
        then:
          required:
          - result_code
          properties:
            result_code:
              type: string
              minLength: 1
              pattern: \S
      additionalProperties: false
    FulfillmentComercial:
      type: object
      properties:
        mode:
          type: string
          enum:
          - ENVIO_DOMICILIO
          - RETIRO_TIENDA
          - VENTA_TIENDA
        fulfillment_ref:
          type:
          - string
          - 'null'
          description: Referencia pública/opaca de cumplimiento; no equivale al location_id interno.
          minLength: 1
      required:
      - mode
      additionalProperties: false
    VerificarCantidadComercialRequest:
      type: object
      properties:
        channel_id:
          $ref: '#/components/schemas/CanalComercial'
          description: Canal comercial solicitante. Debe coincidir con el client_id del token (modulo-marketplace
            -> MARKETPLACE, modulo-chatbot -> CHATBOT, modulo-retail -> RETAIL).
        fulfillment:
          $ref: '#/components/schemas/FulfillmentComercial'
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              sku:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
            required:
            - sku
            - quantity
            additionalProperties: false
      required:
      - channel_id
      - fulfillment
      - lines
      additionalProperties: false
    VerificarCantidadComercialResponse:
      type: object
      properties:
        evaluated_at:
          type: string
          format: date-time
        binding:
          type: boolean
          const: false
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              sku:
                type: string
              requested_quantity:
                type: integer
                minimum: 1
              result:
                type: string
                enum:
                - SUFICIENTE
                - INSUFICIENTE
                - INDETERMINADO
              reason_code:
                type:
                - string
                - 'null'
            required:
            - sku
            - requested_quantity
            - result
            additionalProperties: false
      required:
      - evaluated_at
      - binding
      - items
      additionalProperties: false
    MetaPaginacion:
      type: object
      properties:
        pagina: {type: integer, minimum: 1}
        tamanio: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        totalPaginas: {type: integer, minimum: 0}
      required: [pagina, tamanio, total, totalPaginas]
      additionalProperties: false
    SaldoFisicoAdministrativo:
      type: object
      properties:
        sku: {type: string, minLength: 1}
        ubicacion:
          type: object
          properties:
            locationId: {type: string, format: uuid}
            codigo: {type: string}
            nombre: {type: string}
            tipo: {type: string}
            activa: {type: boolean}
          required: [locationId, codigo, nombre, tipo, activa]
          additionalProperties: false
        skuActivo: {type: [boolean, 'null']}
        onHand: {type: integer, minimum: 0}
        reserved: {type: integer, minimum: 0}
        blocked: {type: integer, minimum: 0}
        available: {type: integer, minimum: 0}
        umbralEfectivo: {type: integer, minimum: 0}
        estado: {type: string, enum: [DISPONIBLE, STOCK_BAJO, AGOTADO]}
        stockVersion: {type: integer, minimum: 0, maximum: 9007199254740991}
        actualizadoEn: {type: string, format: date-time}
      required: [sku, ubicacion, skuActivo, onHand, reserved, blocked, available, umbralEfectivo, estado, stockVersion, actualizadoEn]
      additionalProperties: false
    ListadoSaldosFisicosAdministrativos:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SaldoFisicoAdministrativo'}}
        meta: {$ref: '#/components/schemas/MetaPaginacion'}
      required: [items, meta]
      additionalProperties: false
    AlertaStockAdministrativa:
      type: object
      properties:
        alertaId: {type: string, pattern: '^.+:[0-9a-fA-F-]{36}:(AGOTADO|STOCK_BAJO)$'}
        sku: {type: string, minLength: 1}
        ubicacion:
          type: object
          properties:
            locationId: {type: string, format: uuid}
            codigo: {type: string}
            nombre: {type: string}
            tipo: {type: string}
          required: [locationId, codigo, nombre, tipo]
          additionalProperties: false
        estado: {type: string, enum: [AGOTADO, STOCK_BAJO]}
        available: {type: integer, minimum: 0}
        umbralEfectivo: {type: integer, minimum: 0}
        observadoEn: {type: string, format: date-time}
        targetRoute: {type: string, pattern: '^/inventario\\?sku=.+&locationId=[0-9a-fA-F-]{36}$'}
      required: [alertaId, sku, ubicacion, estado, available, umbralEfectivo, observadoEn, targetRoute]
      additionalProperties: false
    ListadoAlertasOperativas:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AlertaStockAdministrativa'}}
        meta: {$ref: '#/components/schemas/MetaPaginacion'}
      required: [items, meta]
      additionalProperties: false
    UbicacionInventario:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        type: {type: string}
        active: {type: boolean}
      required: [id, code, name, type, active]
      additionalProperties: false
    ListadoUbicacionesInventario:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/UbicacionInventario'}}
        meta: {$ref: '#/components/schemas/MetaPaginacion'}
      required: [items, meta]
      additionalProperties: false
    SkusVendiblesFiltrados:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              sku: {type: string, minLength: 1}
              productoId: {type: string, minLength: 1}
              categoriaId: {type: [string, 'null']}
              marcaId: {type: [string, 'null']}
            required: [sku, productoId, categoriaId, marcaId]
            additionalProperties: false
        nextCursor: {type: [string, 'null']}
      required: [items, nextCursor]
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
      required:
      - title
      - status
      - code
      description: Problema HTTP uniforme basado en RFC 7807. La lógica cliente debe usar code; title y detail son
        texto humano.
      x-error-catalog: api/catalogo-errores.md
    CanalComercial:
      type: string
      enum:
      - MARKETPLACE
      - CHATBOT
      - RETAIL
      description: 'Canales autorizados para consultar proyecciones comerciales de inventario. Para clientes externos,
        el canal solicitado debe corresponder al client_id autenticado: modulo-marketplace -> MARKETPLACE, modulo-chatbot
        -> CHATBOT, modulo-retail -> RETAIL. El consumidor funcional previsto para la autorización interna del GET
        es Promotions, mediante la identidad compartida G6 modulo-productos. El JWT no identifica individualmente
        al bounded context; la política de Inventory restringe operación, cliente, scope y canal. Red privada y
        configuración de despliegue aíslan adicionalmente el origen. Combos conserva las reglas DEC-G6-INT-11; esta
        adenda no le concede capacidades. El POST verificador conserva exclusivamente los clientes comerciales indicados
        en su operación. Reglas deterministas de error: - 400 + VALIDACION: el valor de canal o channel_id no pertenece
        al enum MARKETPLACE, CHATBOT, RETAIL, o existe un error de formato de la solicitud. - 403 + SCOPE_INSUFICIENTE:
        el canal solicitado es válido, pero no corresponde al client_id autenticado, o la identidad carece de autorización
        para la operación.'
    Canal:
      type: string
      description: Identificador comercial canónico de Pricing. El alcance global se expresa omitiendo canal y persiste
        como channel_id null; no es client_id de Seguridad.
      enum:
      - MARKETPLACE
      - CHATBOT
      - RETAIL
      - VENTAS
    EstadoProducto:
      type: string
      enum:
      - BORRADOR
      - ACTIVO
      - INACTIVO
    EstadoStock:
      type: string
      enum:
      - DISPONIBLE
      - STOCK_BAJO
      - AGOTADO
    Atributo:
      type: object
      properties:
        caracteristica_id:
          type: string
        nombre:
          type: string
        valor_id:
          type:
          - string
          - 'null'
        valor: {}
      required:
      - caracteristica_id
      - nombre
      - valor
    Variante:
      type: object
      properties:
        variant_id:
          type: string
        sku:
          type: string
        status:
          type: string
          enum:
          - BORRADOR
          - ACTIVA
          - INACTIVA
        identifying_attributes:
          type: array
          items:
            $ref: '#/components/schemas/Atributo'
        non_identifying_attributes:
          type: array
          items:
            $ref: '#/components/schemas/Atributo'
        images:
          type: array
          items:
            type: string
            format: uri
        physical_profile:
          oneOf:
          - $ref: '#/components/schemas/DatosFisicosSku'
          - type: 'null'
        catalog_version:
          type: integer
          minimum: 0
      required:
      - variant_id
      - sku
      - status
    ProductoResumen:
      type: object
      properties:
        product_id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        categoria_id:
          type: string
        tipo_producto_id:
          type: string
        marca_id:
          type: string
        tiene_variantes:
          type: boolean
        sku_base:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/EstadoProducto'
        images:
          type: array
          items:
            type: string
            format: uri
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Atributo'
        catalog_version:
          type: integer
          minimum: 0
        perfil_fisico:
          oneOf:
          - $ref: '#/components/schemas/DatosFisicosSku'
          - type: 'null'
          description: Solo representa al producto simple; el producto con variantes no tiene perfil físico único.
        pricing_preparado:
          type: boolean
        inventario_inicializado:
          type: boolean
      required:
      - product_id
      - slug
      - name
      - categoria_id
      - tipo_producto_id
      - marca_id
      - tiene_variantes
      - status
    ProductoDetalle:
      allOf:
      - $ref: '#/components/schemas/ProductoResumen'
      - type: object
        properties:
          variants:
            type: array
            items:
              $ref: '#/components/schemas/Variante'
        required:
        - variants
    PaginaProductos:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductoResumen'
        pagina:
          type: integer
          minimum: 1
        tamanio:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
      required:
      - items
      - pagina
      - tamanio
      - total
    Categoria:
      type: object
      properties:
        categoria_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
      required:
      - categoria_id
      - name
      - status
    Marca:
      type: object
      properties:
        marca_id:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        logo_url:
          type:
          - string
          - 'null'
          format: uri
        country_code:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
      required:
      - marca_id
      - name
      - status
    Precio:
      type: object
      properties:
        sku:
          type: string
        precio_regular:
          type: number
          exclusiveMinimum: 0
        precio_oferta:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
        currency:
          type: string
          default: PEN
        channel_id:
          oneOf:
          - $ref: '#/components/schemas/Canal'
          - type: 'null'
          description: Canal efectivo de la vigencia resuelta. Es null cuando el precio efectivo corresponde al
            alcance global.
        valid_from:
          type: string
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
        price_version:
          type: integer
          minimum: 0
        vigencia_id:
          type: string
          minLength: 1
          description: Identificador de la vigencia temporal que respalda el precio resuelto, incluidas las consultas
            históricas as-of.
        origen:
          type: string
          enum:
          - PRODUCTO
          - SKU_OVERRIDE
          description: 'Origen efectivo del precio: PRODUCTO cuando el SKU usa o hereda el precio base del producto;
            SKU_OVERRIDE cuando existe un precio específico del SKU.'
      required:
      - sku
      - precio_regular
      - currency
      - channel_id
      - valid_from
      - price_version
      - vigencia_id
      - origen
    ConsultaPrecios:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Precio'
      required:
      - items
    LineaCompra:
      type: object
      properties:
        product_id:
          type:
          - string
          - 'null'
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
      - sku
      - quantity
    PromocionResumen:
      type: object
      properties:
        promotion_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVA
          - INACTIVA
        valid_from:
          type: string
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Canal'
      required:
      - promotion_id
      - name
      - status
      - valid_from
      - channels
    EvaluacionPromocionesRequest:
      type: object
      properties:
        channel_id:
          $ref: '#/components/schemas/Canal'
        at:
          type:
          - string
          - 'null'
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineaCompra'
          minItems: 1
        coupon_code:
          type:
          - string
          - 'null'
        customer_ref:
          oneOf:
          - type: string
            format: uuid
            description: 'Referencia opaca del cliente: claim sub del token de acceso emitido por Seguridad.'
          - type: 'null'
          description: Security user sub. Opcional cuando el beneficio no tiene límite por cliente; si el cupón
            exige max_usos_por_cliente y falta, la evaluación devuelve CUSTOMER_REF_REQUERIDO. Nunca usar aquí el
            sub de un token de servicio.
      required:
      - channel_id
      - lines
    EvaluacionPromocionesResponse:
      type: object
      properties:
        promotion_id:
          type:
          - string
          - 'null'
        original_amount:
          type: number
          minimum: 0
        discount_amount:
          type: number
          minimum: 0
        result_amount:
          type: number
          minimum: 0
        currency:
          type: string
          default: PEN
        reason:
          type:
          - string
          - 'null'
      required:
      - original_amount
      - discount_amount
      - result_amount
      - currency
    ValidarCuponRequest:
      type: object
      properties:
        coupon_code:
          type: string
        customer_ref:
          oneOf:
          - type: string
            format: uuid
            description: 'Referencia opaca del cliente: claim sub del token de acceso emitido por Seguridad.'
          - type: 'null'
          description: Security user sub. Opcional cuando el beneficio no tiene límite por cliente; si el cupón
            exige max_usos_por_cliente y falta, la evaluación devuelve CUSTOMER_REF_REQUERIDO. Nunca usar aquí el
            sub de un token de servicio.
        channel_id:
          $ref: '#/components/schemas/Canal'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineaCompra'
          minItems: 1
      required:
      - coupon_code
      - channel_id
      - lines
    BeneficioCupon:
      type: object
      properties:
        promotion_id:
          type: string
      required:
      - promotion_id
    ValidarCuponResponse:
      type: object
      properties:
        valid:
          type: boolean
        rejection_reason:
          type:
          - string
          - 'null'
          description: Texto humano opcional. Los consumidores no deben ramificar por este campo; usar code.
        benefit:
          oneOf:
          - $ref: '#/components/schemas/BeneficioCupon'
          - type: 'null'
        discount_amount:
          type: number
          minimum: 0
        result_amount:
          type: number
          minimum: 0
        currency:
          type: string
          default: PEN
        code:
          oneOf:
          - $ref: '#/components/schemas/CodigoRechazoCupon'
          - type: 'null'
          description: Nulo cuando valid=true; código estable cuando valid=false.
      required:
      - valid
      - discount_amount
      - result_amount
      - currency
      allOf:
      - if:
          properties:
            valid:
              const: false
          required:
          - valid
        then:
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/CodigoRechazoCupon'
      - if:
          properties:
            valid:
              const: true
          required:
          - valid
        then:
          properties:
            code:
              type: 'null'
    Recomendacion:
      type: object
      description: Proyección por product_id, sin SKU seleccionado ni garantía para checkout. availability se agrega
        solo desde SKU elegibles con disponibilidad comercial positiva, sin sumar ubicaciones; candidatos sin positividad
        demostrada se excluyen. current_price es el mínimo efectivo («desde») de los SKU elegibles con disponibilidad
        positiva para el mismo canal e instante UTC; se excluyen candidatos sin precio válido. Nunca se interpreta
        INDETERMINADO como AGOTADO.
      properties:
        product_id:
          type: string
        type:
          type: string
          enum:
          - CROSS_SELL
          - UPSELL
        rule_priority:
          type: integer
          minimum: 0
        presentation_order:
          type: integer
          minimum: 1
        current_price:
          type:
          - number
          - 'null'
          minimum: 0
          description: Campo opcional/anulable por compatibilidad. Cuando se informa, la regla H4 exige el mínimo
            precio efectivo («desde») de los SKU elegibles con disponibilidad positiva; oferta vigente o, si no
            existe, precio regular, con moneda homogénea y mismo instante at.
        availability:
          $ref: '#/components/schemas/EstadoStock'
      required:
      - product_id
      - type
      - rule_priority
      - presentation_order
      - availability
    RecomendacionesResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recomendacion'
      required:
      - recommendations
    ComponenteCombo:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
      - sku
      - quantity
    Combo:
      type: object
      properties:
        combo_id:
          type: string
        status:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
        price:
          type: number
          exclusiveMinimum: 0
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponenteCombo'
          minItems: 2
        informative_availability:
          type:
          - integer
          - 'null'
          minimum: 0
        calculated_at:
          type:
          - string
          - 'null'
          format: date-time
        freshness:
          type:
          - string
          - 'null'
        name:
          type: string
        description:
          oneOf:
          - type: string
          - type: 'null'
        version:
          type: integer
          minimum: 0
      required:
      - combo_id
      - status
      - price
      - components
    DisponibilidadStock:
      type: object
      properties:
        sku:
          type: string
        location_id:
          type:
          - string
          - 'null'
        on_hand:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/EstadoStock'
        threshold:
          type:
          - integer
          - 'null'
          minimum: 0
        blocked:
          type: integer
          minimum: 0
          description: Unidades físicamente existentes pero temporalmente no vendibles por incidencia/cuarentena.
      required:
      - sku
      - on_hand
      - reserved
      - blocked
      - available
      - status
      description: Saldo autoritativo por SKU/ubicación. available = max(on_hand - reserved - blocked, 0).
    ConsultaDisponibilidadResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisponibilidadStock'
      required:
      - items
    LineaInventario:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        location_id:
          type:
          - string
          - 'null'
      required:
      - sku
      - quantity
    CrearReservaRequest:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
