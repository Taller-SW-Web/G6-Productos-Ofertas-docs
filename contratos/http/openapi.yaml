  /combos/administracion:
    post:
      tags:
      - Combos
      operationId: crearComboAdministracion
      summary: Crear combo con identidad administrativa e idempotencia recuperable
      description: Operación de creación administrativa para userBearer con rol GESTOR_COMERCIAL. Conserva POST
        /combos para consumidores existentes. Idempotency-Key acepta de 1 a 128 caracteres ASCII [A-Za-z0-9._:-],
        con alcance por actor autenticado y fingerprint del contenido semántico. Repetir la misma clave y payload
        recupera el mismo recurso; reutilizar la clave con otra operación o payload devuelve 409. Ante timeout/respuesta
        perdida, el cliente conserva la clave y consulta/reintenta con la misma intención para reconciliar; no genera
        una nueva clave ni repite una creación incierta. Rechazo definitivo y resultado incierto no son equivalentes.
      x-status: implemented-candidate
      x-required-role: GESTOR_COMERCIAL
      x-gateway-operation: true
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComboCreateRequest'
      responses:
        '201':
          description: Combo creado o recurso original recuperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Combo'
        '400':
          description: Cuerpo o Idempotency-Key inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: JWT humano inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Rol GESTOR_COMERCIAL requerido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Clave idempotente reutilizada con contenido distinto
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: SKU componente inexistente, inactivo o no elegible según provider
