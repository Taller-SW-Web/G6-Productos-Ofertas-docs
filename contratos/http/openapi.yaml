    get:
      operationId: obtenerContenidoCargaMasivaInternoH5
      tags:
      - Carga masiva
      summary: Obtener contenido JSON inmutable mediante claim-check
      description: Acceso técnico privado para catalog-svc. contentId es UUID opaco, no URL ni ruta física. Devuelve
        bytes UTF-8 originales application/json sin parsear ni reserializar, Content-Length y SHA-256 de bytes originales
        en hex minúsculo. Catalog verifica Content-Length, SHA-256 y content_ref.byte_length sobre los bytes recibidos,
        valida el documento y su integridad antes de aplicar filas. No anónimo, no enumeración entre trabajos, no revela
        configuración privada. Retener mientras existan comandos, entregas, resultados o conciliaciones pendientes
        y al menos 30 días tras resultado terminal conciliado; política contractual propuesta G6 pendiente de acreditación
        operativa, no configuración Supabase aplicada. No exponer por Gateway público ni fachada APIM.
      x-owner: bulk-svc
      x-consumer: catalog-svc
      x-internal: true
