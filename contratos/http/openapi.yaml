    OperacionMaestra:
      type: object
      description: 'Representación pública candidata de baja maestra, pendiente de homologación de los cambios compartidos
        y de comprobación de consumidores; no acredita compatibilidad runtime. status describe el ciclo de la operación
        y result únicamente el check de Catálogo. Un result CLEAR aislado no completa la baja ni libera la barrera:
        se requiere la decisión final de Taxonomía y su evento correlacionado en Catálogo.'
      properties:
        operation_id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum:
          - CATEGORY
          - BRAND
          - CHARACTERISTIC_VALUE
          - PRODUCT_TYPE
          - PRODUCT_TYPE_CHARACTERISTIC
        entity_id:
          type: string
        version:
          type: integer
          minimum: 0
          description: Versión autoritativa correlacionada. En PRODUCT_TYPE_CHARACTERISTIC es el schema_version
            del tipo capturado al admitir, no una versión de fila; schema_version del envelope y schema_version_resultante
            son valores distintos.
        status:
          type: string
          enum:
          - PENDING_DEACTIVATION
          - COMPLETED
          - REJECTED
          description: PENDING_DEACTIVATION indica espera de resolución; COMPLETED solo corresponde a baja confirmada
            por Taxonomía; REJECTED conserva el maestro activo. REQUESTED/IN_PROGRESS internos se mapean a PENDING_DEACTIVATION,
            y FAILED técnico a REJECTED con razón TECHNICAL_FAILURE en el protocolo final. No se modifica el enum
            físico ni se incorpora esa razón al enum HTTP ErrorCode mediante este mapeo.
        result:
          description: 'Resultado del check, distinto del estado final: CLEAR permite evaluar la confirmación y
            no equivale a COMPLETED; IN_USE exige rechazo. null representa ausencia de resultado de check, por ejemplo
            ante timeout o fallo técnico; no se fabrica IN_USE para esos casos.'
          oneOf:
          - type: string
            enum:
            - CLEAR
            - IN_USE
          - type: 'null'
        code:
          oneOf:
          - $ref: '#/components/schemas/ErrorCode'
          - type: 'null'
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
      required:
      - operation_id
      - entity_type
      - entity_id
      - version
      - status
      - updated_at
