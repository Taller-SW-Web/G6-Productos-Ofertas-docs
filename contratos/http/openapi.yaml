    CouponOperationSnapshot:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        operation_type:
          type: string
          enum:
          - CONSUMIR_CUPON
          - RESTAURAR_CUPON
        status:
          type: string
          enum:
          - ACCEPTED
          - PROCESSING
          - COMPLETED
          - REJECTED
        order_id:
          type: string
          minLength: 1
        accepted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        result:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CouponOperationResult'
      required:
      - operation_id
      - operation_type
      - status
      - order_id
      - accepted_at
      - updated_at
      - completed_at
      - result
      allOf:
      - if:
          properties:
            status:
              enum:
              - ACCEPTED
              - PROCESSING
          required:
          - status
        then:
          properties:
            completed_at:
              type: 'null'
            result:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - COMPLETED
              - REJECTED
          required:
          - status
        then:
          properties:
            completed_at:
              type: string
              format: date-time
            result:
              $ref: '#/components/schemas/CouponOperationResult'
      - if:
          properties:
            status:
              const: REJECTED
          required:
          - status
        then:
          properties:
            result:
              properties:
                result_code:
                  type: string
                  minLength: 1
                  pattern: \S
              required:
              - result_code
      - if:
          properties:
            operation_type:
              const: CONSUMIR_CUPON
            status:
              enum:
              - COMPLETED
              - REJECTED
          required:
          - operation_type
          - status
        then:
          properties:
            result:
              required:
              - order_id
              - coupon_code
              - reservation_id
              - commercial_snapshot_ref
              - decided_at
      - if:
          properties:
            operation_type:
              const: RESTAURAR_CUPON
            status:
              enum:
              - COMPLETED
              - REJECTED
          required:
          - operation_type
          - status
        then:
          properties:
            result:
              required:
              - order_id
              - consumption_operation_id
              properties:
                consumption_operation_id:
                  type: string
                  format: uuid
      - if:
          properties:
            operation_type:
              const: RESTAURAR_CUPON
            status:
              const: COMPLETED
          required:
          - operation_type
          - status
        then:
          properties:
            result:
              required:
              - order_id
              - consumption_operation_id
              - restored
              - outcome
              - completed_at
      - if:
          properties:
            operation_type:
              const: RESTAURAR_CUPON
            status:
              const: REJECTED
          required:
          - operation_type
          - status
        then:
          properties:
            result:
              required:
              - order_id
              - consumption_operation_id
