      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID requerido. Ausente o malformado produce 400 VALIDACION; con otro UUID válido que el body produce 409 IDEMPOTENCY_CONFLICT. Reutilizar sin cambios al reintentar.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponConsumptionRequest'
      responses:
        '202':
          description: Primera admisión durable; no confirma el efecto final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponOperationSnapshot'
          headers:
            Location:
              description: URL del GET de operación con order_id.
              schema:
                type: string
                format: uri-reference
            Retry-After:
              description: Segundos antes del siguiente sondeo.
              schema:
                type: integer
