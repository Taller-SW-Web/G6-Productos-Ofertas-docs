        '200':
          description: Replay idéntico; snapshot durable vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponOperationSnapshot'
        '409':
          description: Header y body tienen UUID válidos distintos, o identidad reutilizada con fingerprint distinto.
