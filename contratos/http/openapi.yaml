    BulkContentRowV2:
      type: object
      additionalProperties: false
      properties:
        row_number:
          type: integer
          minimum: 2
        row_operation_id:
          type: string
          format: uuid
        producto_id:
          type:
          - string
          - 'null'
        sku_base:
          type: string
          minLength: 1
        product:
          type: object
        variant_id:
          type:
          - string
          - 'null'
          minLength: 1
        variant:
          oneOf:
          - type: object
          - type: 'null'
        sku_variante:
          type:
          - string
          - 'null'
          minLength: 1
          description: Selector de variante requerido para ACTUALIZACION de una variante cuando no hay variant_id.
      required:
      - row_number
      - row_operation_id
      - producto_id
      - sku_base
      - product
      - variant
      allOf:
      - if:
          properties:
            producto_id:
              type: 'null'
          required:
          - producto_id
        then:
          properties:
            product:
              $ref: '#/components/schemas/ProductoCreateRequest'
            variant_id:
              type: 'null'
            variant:
              oneOf:
              - $ref: '#/components/schemas/VarianteCreateRequest'
              - type: 'null'
            sku_variante:
              type: 'null'
      - if:
          properties:
            producto_id:
              type: string
          required:
          - producto_id
        then:
          properties:
            product:
              allOf:
              - $ref: '#/components/schemas/ProductoUpdateRequest'
              - required:
                - catalogVersion
            variant:
              oneOf:
              - allOf:
                - $ref: '#/components/schemas/VarianteUpdateRequest'
                - required:
                  - catalogVersion
              - type: 'null'
          allOf:
          - if:
              properties:
                variant:
                  type: object
              required:
              - variant
            then:
              anyOf:
              - properties:
                  variant_id:
                    type: string
                    minLength: 1
                required:
                - variant_id
              - properties:
                  sku_variante:
                    type: string
                    minLength: 1
                required:
                - sku_variante
            else:
              properties:
                variant_id:
                  type: 'null'
                sku_variante:
                  type: 'null'
  headers:
