      x-runtime-status: PENDIENTE_IMPLEMENTACION
      parameters:
      - name: contentId
        in: path
        required: true
        description: Identificador opaco del objeto inmutable.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Bytes UTF-8 originales del documento JSON; no reserializar antes de verificar su integridad.
          headers:
            Content-Length:
              schema:
                type: integer
                minimum: 1
            X-Content-SHA256:
              description: SHA-256 de los bytes originales, hexadecimal minúsculo.
              schema:
                type: string
                pattern: ^[a-f0-9]{64}$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkContentDocument'
        '404':
          description: Contenido inexistente o no visible; respuesta uniforme.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Almacenamiento no disponible.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400': *id712
        '401': *id713
        '403': *id714
        '429': *id715
        '500': *id716
      security:
      - serviceBearer: []
      x-service-audience: api-productos
      x-required-scope: carga-masiva:contenidos:leer
      x-allowed-client-ids:
