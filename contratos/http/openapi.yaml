        permite proponer a modulo-productos en este GET para los canales MARKETPLACE, CHATBOT y RETAIL, con identidad
        G6 compartida que no distingue criptográficamente promotions-svc de otros bounded contexts G6. Inventory
        restringe por operación, cliente, scope inventario:disponibilidad:leer y enum de canal; los clientes externos
        conservan la correspondencia modulo-marketplace -> MARKETPLACE, modulo-chatbot -> CHATBOT y modulo-retail
        -> RETAIL. La red privada y la configuración de despliegue aíslan adicionalmente el origen. Esta precisión
        no concede a Combos nuevas capacidades ni altera DEC-G6-INT-11, y no acredita grant G7 ni homologación externa.
