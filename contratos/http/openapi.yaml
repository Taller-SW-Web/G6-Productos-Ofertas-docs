  /productos/datos-fisicos/consulta:
    post:
      tags:
      - Despacho
      operationId: consultarDatosFisicos
      summary: Consultar en lote peso y dimensiones físicas por SKU
      x-status: provisional
      x-source-external: G2-Despacho-Specs/integraciones/api-contract.md §5.2
      x-allowed-client-ids: &id729
      - modulo-despacho
      x-service-audience: api-productos
      x-required-scope: productos:fisicos:leer
      x-scope-registration-status: pending-security-registration
      security:
      - serviceBearer: []
      description: 'Productos es dueño del peso y las dimensiones físicas de cada SKU vendible; Despacho es dueño
        del empaque y calcula el peso y volumen operativos. El request contiene de 1 a 100 SKU únicos y opacos:
        conservar literalmente caracteres, mayúsculas y ceros iniciales. En una respuesta 200, cada SKU solicitado
        aparece exactamente una vez, y solo una vez, entre productos y noEncontrados; no se admiten omisiones ni
        SKU inesperados. noEncontrados significa que la identidad SKU no existe en el dominio consultable; no oculta
        estados INACTIVO o BORRADOR. estado representa el estado efectivo del SKU para esta integración: una variante
        ACTIVA adopta el estado del padre ACTIVO, INACTIVO o BORRADOR; una variante INACTIVA o BORRADOR conserva
        su estado. Un producto simple conserva su estado. Esto no modifica estados persistidos ni reglas de activación/reactivación.
        La operación no cambia inventario, precio ni pedidos. Para F-01, G2 permite cotización exacta solo con estado
        ACTIVO y perfil válido; INACTIVO o BORRADOR produce en G2 422 DESP_ERROR_PRODUCTO_NO_ELEGIBLE. Para F-02,
        esos estados no son por sí solos motivo de rechazo si Ventas solicita el despacho de un pedido declarado
        pagado, preparado y listo para entrega, y se cumplen perfil válido y las demás validaciones. Esta excepción
        no habilita ventas ni cambia la activación comercial G6. Un BORRADOR puede carecer de perfil completo. Si
        falta o es inválido el peso, una dimensión o actualizadoEn de un SKU existente, G6 responde 422 DATOS_FISICOS_INCOMPLETOS
        para el lote, nunca 200 parcial, con details.skusAfectados. Si se solicita el sku_base de un producto con
        variantes, existe identidad de catálogo pero no una unidad física consultable: G6 rechaza el lote completo
        con 422 SKU_INVALIDO y details.skusAfectados obligatorio para este caso, con todos y únicamente esos SKU
        base, no vacío, sin duplicados, preservados literalmente y en orden de solicitud. No se inventa perfil físico
        del padre. Los errores estructurales ordinarios SKU_INVALIDO no requieren ese detalle. En todo error que
        incluya skusAfectados, todos y únicamente los SKU deben corresponder a la condición del código devuelto.
        Para lotes mixtos, se aplican en orden lógico: validaciones estructurales; fallo técnico observable (503
        SERVICIO_NO_DISPONIBLE); sku_base no físico (422 SKU_INVALIDO); perfil incompleto (422 DATOS_FISICOS_INCOMPLETOS)
        si no hay sku_base no físico; y 200 íntegro si no hay errores. No se garantiza detectar fallos técnicos
        que el proveedor no pueda observar. Fallos técnicos responden 503. No incluir detalles SQL o internos.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaDatosFisicosRequest'
      responses:
        '200':
          description: Clasificación completa de SKU existentes con perfil físico válido y SKU inexistentes. Cada
            SKU solicitado figura exactamente una vez entre ambas listas; estados comerciales no se convierten en
            noEncontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaDatosFisicosResponse'
        '422':
          description: SKU estructuralmente inválido (sin requerir detalles) o sku_base no físico de producto con
            variantes (details.skusAfectados obligatorio y limitado a esos SKU); o perfil físico incompleto/inválido
            (details.skusAfectados obligatorio).
          content:
            application/problem+json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        type: integer
                        const: 422
                      code:
                        type: string
                        const: SKU_INVALIDO
                    required:
                    - status
                    - code
                  not:
                    required:
                    - details
                - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        type: integer
                        const: 422
                      code:
                        type: string
                        const: SKU_INVALIDO
                      details:
                        $ref: '#/components/schemas/DetallesDatosFisicosIncompletos'
                    required:
                    - status
                    - code
                    - details
                - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      status:
                        type: integer
                        const: 422
                      code:
                        type: string
                        const: DATOS_FISICOS_INCOMPLETOS
                      details:
                        $ref: '#/components/schemas/DetallesDatosFisicosIncompletos'
                    required:
                    - status
                    - code
                    - details
              examples:
                sku_invalido:
                  summary: Error estructural ordinario; details no es obligatorio
                  value:
                    type: /errores/sku-invalido
                    title: SKU inválido
                    status: 422
                    code: SKU_INVALIDO
                    correlationId: 0c0d092e-6192-47c1-8d18-5ed0e2aa4518
