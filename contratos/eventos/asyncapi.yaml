asyncapi: 3.0.0
id: urn:taller-sw-web:productos-y-ofertas:asyncapi
info:
  title: Productos y Ofertas — Contrato asíncrono
  version: 0.6.0-rc.3
  description: >-
    Candidata documental incompatible por reconciliar los nombres de exchanges y colas
    de infraestructura base con la observación histórica de RabbitMQ Oracle del
    2026-10-19. Conserva los 40 mensajes/canales, payloads, esquemas, operaciones,
    productores, consumidores, routing keys lógicas y vhost de 0.6.0-rc.2. Solo
    cambian referencias físicas base y metadatos documentales. La observación no
    acredita homologación bilateral, despliegue, conectividad AMQP ni integración E2E.
    Retry/DLX permanece como diseño candidato no aprobado, no aprovisionado y bloqueado.
defaultContentType: application/json
x-delivery-semantics: at-least-once
x-physical-topology-status: base-observed-not-homologated
x-physical-topology-status-description: >-
  Los nombres y tipos de la infraestructura base fueron observados en una auditoría
  Oracle del 2026-10-19. Este estado no certifica el estado actual del servidor, la
  correspondencia individual de bindings, conectividad, entrega, ACK, homologación,
  despliegue ni pruebas E2E.
x-external-homologation-status: pending
x-retry-dlx-status: blocked-not-provisioned
