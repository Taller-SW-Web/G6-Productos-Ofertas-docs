      x-consumers:
      - catalog-svc
      x-status: p1-closed
      x-deduplication-key: message_id
      x-business-idempotency-key: operation_id
      payload:
        allOf:
        - $ref: '#/components/schemas/MessageEnvelope'
        - type: object
          properties:
            operation_id:
              type: string
              format: uuid
            causation_id:
              type: string
              minLength: 1
            producer:
              type: string
              const: inventory-svc
            kind:
              type: string
              const: result
            name:
              type: string
              const: inventory.sku.initialization.rejected
            data:
              $ref: '#/components/schemas/InventorySkuInitializationResultData'
          required:
          - operation_id
          - causation_id
          - producer
          - kind
          - name
          - data
      x-exchange: po.results.x
      x-routing-key: inventory.sku.initialization.rejected
servers:
  rabbitmq:
    host: '{host}:{port}'
    protocol: amqp
    protocolVersion: 0.9.1
    description: Broker RabbitMQ del Marketplace Multicanal.
    variables:
      host:
        default: rabbitmq
      port:
        default: '5672'
    x-vhost: /marketplace
x-rabbitmq-policy:
  main_queue_type: quorum
  retry_queue_type: quorum
  dlq_type: quorum
  publisher_confirms: true
  consumer_ack: manual
  default_prefetch: 20
  application_retry_attempts: 3
  retry_delay_ms: 30000
  unroutable_publish: mandatory=true + alternate exchange po.unrouted.x
  business_rejection_rule: Business rejections are acknowledged and translated to contract results/events; they are not sent to retry/DLQ.
x-rabbitmq-topology:
  vhost: /marketplace
  exchanges:
    po.commands.x:
      type: topic
      durable: true
      alternate_exchange: po.unrouted.x
    po.events.x:
      type: topic
      durable: true
      alternate_exchange: po.unrouted.x
    po.results.x:
      type: topic
      durable: true
      alternate_exchange: po.unrouted.x
    po.retry.x:
      type: direct
      durable: true
    po.dlx.x:
      type: direct
      durable: true
    po.unrouted.x:
      type: fanout
      durable: true
  queues:
    po.catalog.q:
      consumer: catalog-svc
      type: quorum
      durable: true
      prefetch: 20
      bindings:
      - exchange: po.commands.x
        routing_key: catalog.bulk.upsert.requested
      - exchange: po.commands.x
        routing_key: taxonomy.master.deactivation.check.requested
      - exchange: po.events.x
        routing_key: taxonomy.category.updated
      - exchange: po.events.x
        routing_key: taxonomy.characteristic-value.updated
      - exchange: po.events.x
        routing_key: taxonomy.master.deactivated
      - exchange: po.events.x
        routing_key: taxonomy.product-type-schema.changed
      - exchange: po.results.x
        routing_key: inventory.sku.initialization.completed
      - exchange: po.results.x
        routing_key: inventory.sku.initialization.rejected
      - exchange: po.results.x
        routing_key: pricing.product.initialization.completed
      - exchange: po.results.x
        routing_key: pricing.product.initialization.rejected
      - exchange: po.results.x
        routing_key: taxonomy.master.deactivation.rejected
      retry_queue: po.catalog.q.retry
      dlq: po.catalog.q.dlq
    po.catalog.q.retry:
      consumer: catalog-svc
      type: quorum
      durable: true
      binding:
        exchange: po.retry.x
        routing_key: po.catalog.q
      message_ttl_ms: 30000
      dead_letter_exchange: ''
      dead_letter_routing_key: po.catalog.q
    po.catalog.q.dlq:
      consumer: catalog-svc
      type: quorum
      durable: true
      binding:
        exchange: po.dlx.x
        routing_key: po.catalog.q
      manual_recovery: true
    po.gateway.q:
      consumer: api-gateway/bff
      type: quorum
      durable: true
      prefetch: 20
      bindings:
      - exchange: po.events.x
        routing_key: catalog.product.deactivated
      - exchange: po.events.x
        routing_key: inventory.reservation.consumed
      - exchange: po.events.x
        routing_key: inventory.reservation.created
      - exchange: po.events.x
        routing_key: inventory.reservation.expired
      - exchange: po.events.x
        routing_key: inventory.reservation.released
      - exchange: po.events.x
        routing_key: inventory.stock.adjusted
      - exchange: po.events.x
        routing_key: inventory.stock.changed
      - exchange: po.events.x
        routing_key: pricing.price.changed
      - exchange: po.events.x
        routing_key: taxonomy.category.updated
      - exchange: po.events.x
        routing_key: taxonomy.master.deactivated
      retry_queue: po.gateway.q.retry
      dlq: po.gateway.q.dlq
    po.gateway.q.retry:
      consumer: api-gateway/bff
      type: quorum
      durable: true
      binding:
        exchange: po.retry.x
        routing_key: po.gateway.q
      message_ttl_ms: 30000
      dead_letter_exchange: ''
      dead_letter_routing_key: po.gateway.q
    po.gateway.q.dlq:
      consumer: api-gateway/bff
      type: quorum
      durable: true
      binding:
        exchange: po.dlx.x
        routing_key: po.gateway.q
      manual_recovery: true
    po.promotions.q:
      consumer: promotions-svc
      type: quorum
      durable: true
      prefetch: 20
      bindings:
      - exchange: po.commands.x
        routing_key: promotions.coupon.consumption.requested
      - exchange: po.commands.x
        routing_key: promotions.coupon.restoration.requested
      - exchange: po.events.x
        routing_key: catalog.product.deactivated
      - exchange: po.events.x
        routing_key: catalog.sku.deactivated
      - exchange: po.events.x
        routing_key: inventory.stock.changed
      - exchange: po.events.x
        routing_key: pricing.price.changed
      retry_queue: po.promotions.q.retry
      dlq: po.promotions.q.dlq
    po.promotions.q.retry:
      consumer: promotions-svc
      type: quorum
      durable: true
      binding:
        exchange: po.retry.x
        routing_key: po.promotions.q
      message_ttl_ms: 30000
      dead_letter_exchange: ''
