    po.price-audit.q:
      consumer: price-audit-svc
      type: quorum
      durable: true
      prefetch: 20
      bindings:
      - exchange: po.events.x
        routing_key: pricing.price.changed
      retry_queue: po.price-audit.q.retry
      dlq: po.price-audit.q.dlq
    po.price-audit.q.retry:
      consumer: price-audit-svc
      type: quorum
      durable: true
      binding:
        exchange: po.retry.x
        routing_key: po.price-audit.q
      message_ttl_ms: 30000
