components:
  schemas:
    MessageEnvelope:
      type: object
      properties:
        message_id:
          type: string
          minLength: 1
        schema_version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
          minLength: 1
        causation_id:
          type:
          - string
          - 'null'
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
        producer:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - event
          - command
          - result
        name:
          type: string
          minLength: 1
        data:
          type: object
      required:
      - message_id
      - schema_version
      - occurred_at
      - correlation_id
      - producer
      - kind
      - name
      - data
    GenericData:
      type: object
      description: Payload específico del mensaje. Para mensajes P1 críticos se especializa mediante schemas dedicados.
      additionalProperties: true
    CouponConsumptionRequestedData:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
        coupon_code:
          type: string
          minLength: 1
        customer_ref:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        channel_id:
          type: string
          enum:
          - MARKETPLACE
          - CHATBOT
          - RETAIL
        effective_at:
          type: string
          format: date-time
      required:
      - order_id
      - coupon_code
      - channel_id
      - effective_at
    CouponRestorationRequestedData:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
        cancellation_reason:
          type: string
          minLength: 1
        cancelled_at:
          type: string
          format: date-time
      required:
      - order_id
      - cancellation_reason
      - cancelled_at
    CouponRestorationResultData:
      type: object
      properties:
        order_id:
          type: string
        cupon_id:
          type:
          - string
          - 'null'
        restored:
          type: boolean
        outcome:
          type: string
          enum:
          - RESTORED
          - POLICY_KEEPS_CONSUMPTION
          - NO_CONSUMPTION
        completed_at:
          type: string
          format: date-time
      required:
      - order_id
      - restored
      - outcome
      - completed_at
    PricingProductInitializationRequestedData:
      type: object
      properties:
        product_id:
          type: string
        sku_base:
          type: string
        precio_regular:
          type: number
          exclusiveMinimum: 0
        moneda:
          type: string
          minLength: 3
          maxLength: 3
        channel_id:
          type: 'null'
        motivo_cambio:
          type: string
          const: ALTA_PRODUCTO
      required:
      - product_id
      - sku_base
      - precio_regular
      - moneda
      - channel_id
      - motivo_cambio
    PricingProductInitializationResultData:
      type: object
      properties:
        product_id:
          type: string
        sku_base:
          type: string
        status:
          type: string
          enum:
          - READY
          - REJECTED
        price_version:
          type:
          - integer
          - 'null'
          minimum: 1
        vigencia_id:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        completed_at:
          type: string
          format: date-time
      required:
      - product_id
      - sku_base
      - status
      - completed_at
    InventorySkuInitializationRequestedData:
      type: object
      properties:
        sku:
          type: string
        product_id:
          type: string
        variant_id:
          type:
          - string
          - 'null'
        default_location_id:
          type:
          - string
          - 'null'
      required:
      - sku
      - product_id
    InventorySkuInitializationResultData:
      type: object
      properties:
        sku:
          type: string
        product_id:
          type: string
        variant_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - INITIALIZED
          - REJECTED
        code:
          type:
          - string
          - 'null'
        completed_at:
          type: string
          format: date-time
      required:
      - sku
      - product_id
      - status
      - completed_at
