    po.bulk.q:
      consumer: bulk-svc
      type: quorum
      durable: true
      prefetch: 20
      bindings:
      - exchange: po.events.x
        routing_key: inventory.stock.adjusted
      - exchange: po.results.x
        routing_key: catalog.bulk.upsert.completed
      - exchange: po.results.x
        routing_key: catalog.bulk.upsert.rejected
      - exchange: po.results.x
        routing_key: inventory.bulk.stock.adjust.completed
      - exchange: po.results.x
        routing_key: inventory.bulk.stock.adjust.rejected
      - exchange: po.results.x
        routing_key: pricing.bulk.price.apply.completed
      - exchange: po.results.x
        routing_key: pricing.bulk.price.apply.rejected
      retry_queue: po.bulk.q.retry
      dlq: po.bulk.q.dlq
    po.bulk.q.retry:
      consumer: bulk-svc
      type: quorum
      durable: true
      binding:
        exchange: po.retry.x
        routing_key: po.bulk.q
      message_ttl_ms: 30000
      dead_letter_exchange: ''
      dead_letter_routing_key: po.bulk.q
    po.bulk.q.dlq:
      consumer: bulk-svc
      type: quorum
      durable: true
      binding:
        exchange: po.dlx.x
        routing_key: po.bulk.q
      manual_recovery: true
    po.unrouted.q:
      consumer: platform/operations
      type: quorum
      durable: true
      binding:
        exchange: po.unrouted.x
        routing_key: '#'
      purpose: Detectar publicaciones sin binding; no es una cola de negocio.
  retry_flow:
  - Consumer receives from main quorum queue with manual ack.
  - 'Transient technical failure: republish the same envelope to po.retry.x with routing key equal to the main queue name and x-retry-count
    + 1; ack original.'
  - Retry queue waits 30000 ms and dead-letters directly back to the main queue through the default exchange.
  - After 3 application retries, publish to po.dlx.x with routing key equal to the main queue name; ack original.
  - Malformed/schema-unsupported poison messages go directly to DLQ.
  - Business rejections are acked and emit their domain rejected result when the contract defines one.
  outbox_inbox:
    publisher: Transactional Outbox before publish; mark published only after publisher confirm.
    consumer: Inbox/deduplication by message_id before side effects; business operation_id remains idempotency key.
