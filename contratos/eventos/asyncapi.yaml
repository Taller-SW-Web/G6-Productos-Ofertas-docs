x-transport:
  provider: Azure Service Bus
  tier: Basic
  scope: mensajería interna G6
  max_message_size_bytes_including_properties: 262144
  topics: false
  duplicate_detection: false
  delivery: at-least-once
  outbox: transaccional SQL y entrega por destinatario
  inbox: deduplicación durable antes de complete
  dlq: solo poison/permanent technical failures; rechazos de negocio producen resultados durables
  max_complete_message_size_bytes: 262144
  message_size_includes_properties_and_encoding: true
  sessions: false
  delivery_model: '#/x-delivery-model'
x-blocked-contracts:
- inventory.bulk.stock.adjust.requested
- pricing.bulk.price.apply.requested
x-delivery-model:
  delivery: at-least-once
  exactly_once: false
  outbox:
    write: business state and delivery intent in one local SQL transaction
    fanout: one durable delivery per recipient
    stable_message_id: reuse the same MessageId during retries
    mark_sent: only after positive SDK send result
  inbox:
    deduplication_key: message_id
    settlement: persist inbox, business effect and durable result before completeMessage
    redelivery: must not repeat the business effect
  dlq:
    purpose: poison messages and permanent technical failures with sanitized diagnostics
    business_rejection: persist terminal business result and settle; do not use DLQ
    recovery: supervised and reconciled; never treat blocked feature as implemented
