asyncapi: 3.0.0
id: urn:taller-sw-web:productos-y-ofertas:asyncapi
info:
  title: Productos y Ofertas — Contrato asíncrono
  version: 0.5.0
  description: 'Contrato asíncrono consolidado P0/P1/P2. Formaliza la obligatoriedad de operation_id y causation_id en los mensajes de inicialización y preparación para correlación estricta y descarte de resultados stale. Fija la topología física RabbitMQ para los 39 mensajes lógicos existentes:
    exchanges, queues, bindings, retry y DLQ. Los nombres lógicos y routing keys se conservan.'
defaultContentType: application/json
x-delivery-semantics: at-least-once
x-physical-topology-status: confirmed
