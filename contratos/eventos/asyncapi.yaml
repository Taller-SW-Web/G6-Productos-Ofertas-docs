      bindings:
      - exchange: po.events.x
        routing_key: catalog.product.deactivated
      - exchange: po.events.x
        routing_key: catalog.sku.deactivated
      - exchange: po.events.x
        routing_key: inventory.stock.changed
      retry_queue: po.combos.q.retry
      dlq: po.combos.q.dlq
    po.combos.q.retry:
      consumer: combos-svc
      type: quorum
      durable: true
      binding:
        exchange: po.retry.x
        routing_key: po.combos.q
      message_ttl_ms: 30000
      dead_letter_exchange: ''
      dead_letter_routing_key: po.combos.q
    po.combos.q.dlq:
      consumer: combos-svc
      type: quorum
      durable: true
      binding:
        exchange: po.dlx.x
        routing_key: po.combos.q
      manual_recovery: true
    po.inventory.q:
      consumer: inventory-svc
      type: quorum
      durable: true
      prefetch: 20
      bindings:
      - exchange: po.commands.x
        routing_key: inventory.bulk.stock.adjust.requested
      - exchange: po.commands.x
        routing_key: inventory.sku.initialization.requested
      - exchange: po.events.x
