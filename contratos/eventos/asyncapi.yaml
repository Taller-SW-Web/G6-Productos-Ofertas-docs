    - $ref: '#/channels/g6_promotions_commands/messages/PromotionsCouponConsumptionRequested'
    - $ref: '#/channels/g6_promotions_commands/messages/PromotionsCouponRestorationRequested'
    x-consumer: promotions-svc
    x-runtime-status: PENDIENTE_IMPLEMENTACION
components:
  schemas:
    MessageEnvelope:
      type: object
      properties:
        message_id:
          type: string
          minLength: 1
        schema_version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
          minLength: 1
        causation_id:
          type:
          - string
          - 'null'
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
        producer:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - event
          - command
          - result
        name:
          type: string
          minLength: 1
        data:
          type: object
      required:
      - message_id
      - schema_version
      - occurred_at
      - correlation_id
      - producer
      - kind
      - name
      - data
    GenericData:
      type: object
      description: Payload específico del mensaje. Para mensajes P1 críticos se especializa mediante schemas dedicados.
      additionalProperties: true
    CatalogProductDeactivatedData:
      type: object
      properties:
        product_id:
          type: string
          minLength: 1
        product_version:
          type: integer
          minimum: 1
          description: Versión autoritativa del producto
          distinta de schema_version del envelope.: null
        changed_at:
          type: string
          format: date-time
      required:
      - product_id
      - product_version
      - changed_at
      additionalProperties: false
    CatalogSkuDeactivatedData:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
        product_id:
          type: string
          minLength: 1
        sku_version:
          type: integer
          minimum: 1
          description: Versión autoritativa del SKU
          distinta de schema_version del envelope.: null
        changed_at:
          type: string
          format: date-time
      required:
      - sku
      - product_id
      - sku_version
      - changed_at
      additionalProperties: false
    PricingPriceChangedData:
      type: object
      properties:
        target_type:
          type: string
          enum:
          - PRODUCTO
          - SKU
        product_id:
          type: string
          minLength: 1
        sku:
          type:
          - string
          - 'null'
        channel_id:
          oneOf:
          - type: string
            enum:
            - MARKETPLACE
            - CHATBOT
            - RETAIL
            - VENTAS
          - type: 'null'
        currency:
          type: string
          minLength: 3
          maxLength: 3
        price_type:
          type: string
          enum:
          - REGULAR
          - OFERTA
        previous_price:
          type:
          - string
          - 'null'
          pattern: ^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.(?:0*[1-9][0-9]*))$
        new_price:
          type:
          - string
          - 'null'
          pattern: ^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.(?:0*[1-9][0-9]*))$
        operation:
          type: string
          enum:
          - CREACION
          - MODIFICACION
          - RETIRO_OFERTA
        reason:
          type: string
          minLength: 1
        price_version:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date-time
        batch_id:
          type:
          - string
          - 'null'
          format: uuid
        actor:
          type: object
          properties:
            user_id:
              type:
              - string
              - 'null'
            email:
              type:
              - string
              - 'null'
              format: email
            ip:
              type:
              - string
              - 'null'
          required:
          - user_id
          - email
          - ip
          additionalProperties: false
      required:
      - target_type
      - product_id
      - sku
      - channel_id
      - currency
      - price_type
      - previous_price
      - new_price
      - operation
      - reason
      - price_version
      - valid_from
      - batch_id
      - actor
      additionalProperties: false
      allOf:
      - if:
          properties:
            target_type:
              const: PRODUCTO
          required:
          - target_type
        then:
          properties:
            sku:
              type: 'null'
      - if:
          properties:
            target_type:
              const: SKU
          required:
          - target_type
        then:
          properties:
            sku:
              type: string
              minLength: 1
      - if:
          properties:
            operation:
              const: CREACION
          required:
          - operation
        then:
          properties:
            previous_price:
              type: 'null'
            new_price:
              type: string
              pattern: ^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.(?:0*[1-9][0-9]*))$
      - if:
          properties:
            operation:
              const: MODIFICACION
          required:
          - operation
        then:
          properties:
            previous_price:
              type: string
              pattern: ^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.(?:0*[1-9][0-9]*))$
            new_price:
              type: string
              pattern: ^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.(?:0*[1-9][0-9]*))$
      - if:
          properties:
            operation:
              const: RETIRO_OFERTA
          required:
          - operation
        then:
          properties:
            price_type:
              const: OFERTA
            new_price:
              type: 'null'
      - if:
          properties:
            target_type:
              const: PRODUCTO
            price_type:
              const: OFERTA
          required:
          - target_type
          - price_type
        then:
          properties:
            sku:
              type: 'null'
      description: Evento post-commit de transición efectiva. PRODUCTO exige sku=null; SKU identifica su sku. CREACION
        exige previous_price=null y nuevo positivo; MODIFICACION ambos precios; RETIRO_OFERTA exige new_price=null.
        schema_version envelope permanece 1 para corte coordinado. price_version es versión de dominio, no secuencia
        global.
    InventoryStockChangedData:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
        location_id:
          type: string
          format: uuid
        on_hand:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        estado:
          type: string
          enum:
          - DISPONIBLE
          - STOCK_BAJO
          - AGOTADO
        stock_version:
          type: integer
          minimum: 1
          description: Versión autoritativa del saldo para el par (sku, location_id); no existe una versión global
            por SKU.
        updated_at:
          type: string
          format: date-time
      required:
      - sku
      - location_id
      - on_hand
      - reserved
      - blocked
      - available
      - estado
      - stock_version
      - updated_at
      additionalProperties: false
      description: 'Snapshot de saldo por (sku, location_id), emitido en la transacción de Inventory. Los consumidores
        comerciales no agregan ubicaciones ni toman estado del snapshot como disponibilidad vigente: solo invalidan
        sus proyecciones y consultan después la disponibilidad comercial autoritativa. stock_version es local al
        par y no ordena saldos de otras ubicaciones.'
    CatalogBulkUpsertRequestedData:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        batch_operation_id:
          type: string
          format: uuid
        template_version:
          type: integer
          const: 2
        mode:
          type: string
          enum:
          - ALTA
          - ACTUALIZACION
        rows:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              row_number:
                type: integer
                minimum: 2
              row_operation_id:
                type: string
                format: uuid
              producto_id:
                type:
                - string
                - 'null'
              sku_base:
                type: string
                minLength: 1
              product:
                type: object
              variant_id:
                type:
                - string
                - 'null'
              variant:
                oneOf:
                - type: object
                - type: 'null'
            required:
            - row_number
            - row_operation_id
            - producto_id
            - sku_base
            - product
            - variant_id
            - variant
            additionalProperties: false
      required:
      - batch_id
      - batch_operation_id
      - template_version
      - mode
      - rows
      additionalProperties: false
      description: 'product y variant se validan según mode: ALTA usa exclusivamente ProductoCreateRequest y VarianteCreateRequest;
        ACTUALIZACION usa exclusivamente ProductoUpdateRequest y VarianteUpdateRequest. La variante puede ser null
        para un producto simple; en actualización de variante, variant_id es obligatorio.'
      allOf:
      - if:
          properties:
            mode:
              const: ALTA
          required:
          - mode
        then:
          properties:
            rows:
              items:
                properties:
                  producto_id:
                    type: 'null'
                  variant_id:
                    type: 'null'
                  product:
                    $ref: ../http/openapi.yaml#/components/schemas/ProductoCreateRequest
                  variant:
                    oneOf:
                    - $ref: ../http/openapi.yaml#/components/schemas/VarianteCreateRequest
                    - type: 'null'
      - if:
          properties:
            mode:
              const: ACTUALIZACION
          required:
          - mode
        then:
          properties:
            rows:
              items:
                properties:
                  producto_id:
                    type: string
                    minLength: 1
                  product:
                    $ref: ../http/openapi.yaml#/components/schemas/ProductoUpdateRequest
                  variant:
                    oneOf:
                    - $ref: ../http/openapi.yaml#/components/schemas/VarianteUpdateRequest
                    - type: 'null'
                allOf:
                - if:
                    properties:
                      variant:
                        type: object
                    required:
                    - variant
                  then:
                    properties:
                      variant_id:
                        type: string
                        minLength: 1
                  else:
                    properties:
                      variant_id:
                        type: 'null'
      examples:
      - batch_id: 7ef62d29-ef0d-4d0d-9a83-c057e03a570f
        batch_operation_id: d240bffd-f952-4558-a0d6-2f8d2e35c4a4
        template_version: 2
        mode: ALTA
        rows:
        - row_number: 2
          row_operation_id: 5ad03a54-1b9b-4e84-9e09-162dbbd4e7d1
          producto_id: null
          sku_base: SKU-BASE-001
          product:
            nombre: Producto de ejemplo
            descripcion: Descripción
            categoriaId: cat-001
            tipoProductoId: tipo-001
            marcaId: marca-001
            precioBaseInicial: 19.9
            skuBase: SKU-BASE-001
            tieneVariantes: false
          variant_id: null
          variant: null
      x-negative-examples:
      - name: update-without-product-id
        detail: ACTUALIZACION requiere producto_id y variant_id cuando se actualiza una variante; rechazar antes
          de publicar.
      - name: duplicate-row-identity-with-different-payload
        detail: Misma row_operation_id con payload semántico distinto produce IDEMPOTENCY_CONFLICT.
    CatalogBulkUpsertRequestedDataV2:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        batch_operation_id:
          type: string
          format: uuid
        template_version:
          type: integer
          const: 2
        mode:
          type: string
          enum:
          - ALTA
          - ACTUALIZACION
        rows:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              row_number:
                type: integer
                minimum: 2
              row_operation_id:
                type: string
                format: uuid
              producto_id:
                type:
                - string
                - 'null'
              sku_base:
                type: string
                minLength: 1
              product:
                type: object
              variant_id:
                type:
                - string
                - 'null'
                minLength: 1
              variant:
                oneOf:
                - type: object
                - type: 'null'
              sku_variante:
                type:
                - string
                - 'null'
                minLength: 1
                description: Selector opaco para ACTUALIZACION; Catalog resuelve y bloquea la variante dentro del
                  producto y de la transaccion.
            required:
            - row_number
            - row_operation_id
            - producto_id
            - sku_base
            - product
            - variant
            additionalProperties: false
      required:
      - batch_id
      - batch_operation_id
      - template_version
      - mode
      - rows
      additionalProperties: false
      description: 'Comando v2 aprobado internamente el 2026-11-03. ACTUALIZACION de variante requiere variant_id
        o sku_variante; si ambos existen deben corresponder a la misma variante del producto. Catalog resuelve y
        bloquea dentro de la transaccion, verifica producto.catalogVersion y variante.catalogVersion independientes,
        y evita objetivos duplicados en la familia. ALTA conserva variant.sku del DTO; sku_variante externo debe
        estar ausente o null. Simple conserva variant=null y selectores ausentes o null. No requiere consulta HTTP
        previa, permisos nuevos ni cambios de PricingCatalogContext. El payload original no se reemplaza por el
        ID resuelto; replay consulta resultado persistido antes de revalidar versiones. Variante ausente/ajena:
        VARIANTE_NO_ENCONTRADA; selectores contradictorios: VALIDACION; version obsoleta: VERSION_CONFLICT. Misma
        identidad con otra intencion: IDEMPOTENCY_CONFLICT. Rechazo de negocio revierte la familia; fallo tecnico
        revierte el chunk sin resultado terminal. template_version sigue siendo 2. La aprobacion no acredita implementacion,
        grants ni despliegue.'
      allOf:
      - if:
          properties:
            mode:
              const: ALTA
          required:
          - mode
        then:
          properties:
            rows:
              items:
                properties:
                  producto_id:
                    type: 'null'
                  variant_id:
                    type: 'null'
                  product:
                    $ref: ../http/openapi.yaml#/components/schemas/ProductoCreateRequest
                  variant:
                    oneOf:
                    - $ref: ../http/openapi.yaml#/components/schemas/VarianteCreateRequest
                    - type: 'null'
                  sku_variante:
                    type: 'null'
      - if:
          properties:
            mode:
              const: ACTUALIZACION
          required:
          - mode
        then:
          properties:
            rows:
              items:
                properties:
                  producto_id:
                    type: string
                    minLength: 1
                  product:
                    allOf:
                    - $ref: ../http/openapi.yaml#/components/schemas/ProductoUpdateRequest
                    - required:
                      - catalogVersion
                  variant:
                    oneOf:
                    - allOf:
                      - $ref: ../http/openapi.yaml#/components/schemas/VarianteUpdateRequest
                      - required:
                        - catalogVersion
                    - type: 'null'
                allOf:
                - if:
                    properties:
                      variant:
                        type: object
                    required:
                    - variant
                  then:
                    anyOf:
                    - properties:
                        variant_id:
                          type: string
                          minLength: 1
                      required:
                      - variant_id
                    - properties:
                        sku_variante:
                          type: string
                          minLength: 1
                      required:
                      - sku_variante
                  else:
                    properties:
                      variant_id:
                        type: 'null'
                      sku_variante:
                        type: 'null'
    CatalogBulkUpsertCompletedData:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        batch_operation_id:
          type: string
          format: uuid
        results:
          type: array
          items:
            type: object
            properties:
              row_number:
                type: integer
                minimum: 2
              row_operation_id:
                type: string
                format: uuid
              product_id:
                type:
                - string
                - 'null'
              sku_base:
                type: string
                minLength: 1
              status:
                type: string
                enum:
                - COMPLETED
                - REJECTED
              code:
                type:
                - string
                - 'null'
            required:
            - row_number
            - row_operation_id
            - product_id
            - sku_base
            - status
            - code
            additionalProperties: false
      required:
      - batch_id
      - batch_operation_id
      - results
      additionalProperties: false
      description: completed significa que el comando se procesó; puede contener filas rechazadas.
      examples:
      - batch_id: 7ef62d29-ef0d-4d0d-9a83-c057e03a570f
        batch_operation_id: d240bffd-f952-4558-a0d6-2f8d2e35c4a4
        results:
        - row_number: 2
          row_operation_id: 5ad03a54-1b9b-4e84-9e09-162dbbd4e7d1
          product_id: prod-001
          sku_base: SKU-BASE-001
          status: COMPLETED
          code: null
        - row_number: 3
          row_operation_id: 3cf6bd6d-74bc-42db-8f1a-87269dcf91e7
          product_id: null
          sku_base: SKU-BASE-002
          status: REJECTED
          code: VALIDACION
      x-negative-examples:
      - name: completed-without-row-results
        detail: No reportar éxito de lote como éxito de todas las filas o dominios; results debe describir cada
          fila procesada.
    CatalogBulkUpsertRejectedData:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        batch_operation_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
          description: Sin SQL
          secretos ni trazas.: null
      required:
      - batch_id
      - batch_operation_id
      - code
      - detail
      additionalProperties: false
      examples:
      - batch_id: 7ef62d29-ef0d-4d0d-9a83-c057e03a570f
        batch_operation_id: d240bffd-f952-4558-a0d6-2f8d2e35c4a4
        code: VALIDACION
        detail: El comando no cumple el contrato de entrada.
      x-negative-examples:
      - name: detail-with-sql-or-secret
        detail: No incluir SQL, secretos ni trazas en detail.
    MasterDeactivationIdentityData:
      type: object
      properties:
        entity_type:
          type: string
          enum:
          - CATEGORY
          - BRAND
          - PRODUCT_TYPE
          - CHARACTERISTIC_VALUE
        entity_id:
          type: string
          minLength: 1
          description: Identidad opaca del maestro, preservada sin transformación.
        version:
          type: integer
          minimum: 0
          description: Versión autoritativa capturada por Taxonomy al admitir la baja; no es schema_version del
            envelope.
      required:
      - entity_type
      - entity_id
      - version
      additionalProperties: true
    MasterDeactivationAssociationData:
      type: object
      properties:
        entity_type:
          type: string
          const: PRODUCT_TYPE_CHARACTERISTIC
        entity_id:
          type: string
          minLength: 1
        tipo_producto_id:
          type: string
          minLength: 1
          description: Identificador del tipo de producto autoritativo de la asociación.
        caracteristica_id:
          type: string
          minLength: 1
          description: Identificador de la característica autoritativo de la asociación.
        version:
          type: integer
          minimum: 0
          description: schema_version autoritativa del tipo capturada y proporcionada por Taxonomy al admitir la
            operación; Catalog la conserva y verifica. No es schema_version del envelope ni una versión de fila
            de asociación.
      required:
      - entity_type
      - entity_id
      - tipo_producto_id
      - caracteristica_id
      - version
      additionalProperties: true
    MasterDeactivationData:
      oneOf:
      - $ref: '#/components/schemas/MasterDeactivationIdentityData'
      - $ref: '#/components/schemas/MasterDeactivationAssociationData'
    MasterDeactivationCheckedData:
      allOf:
      - $ref: '#/components/schemas/MasterDeactivationData'
      - type: object
        properties:
          result:
            type: string
            enum:
            - CLEAR
            - IN_USE
        required:
        - result
    MasterDeactivationCompletedData:
      oneOf:
      - $ref: '#/components/schemas/MasterDeactivationIdentityData'
      - allOf:
        - $ref: '#/components/schemas/MasterDeactivationAssociationData'
        - type: object
          properties:
            schema_version_resultante:
              type: integer
              minimum: 1
              description: Evolución confirmada del esquema posterior a la versión capturada; no se equipara a la
                versión de la fila de asociación.
          required:
          - schema_version_resultante
    MasterDeactivationRejectedData:
      allOf:
      - $ref: '#/components/schemas/MasterDeactivationData'
      - type: object
        properties:
          reason:
            type: string
            minLength: 1
        required:
        - reason
    CouponConsumptionRequestedData:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
        coupon_code:
          type: string
          minLength: 1
        customer_ref:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        channel_id:
          type: string
          enum:
          - MARKETPLACE
          - CHATBOT
          - RETAIL
        reservation_id:
          type: string
          format: uuid
        commercial_snapshot_ref:
          type: string
          minLength: 1
        effective_at:
          type: string
          format: date-time
      required:
      - order_id
      - coupon_code
      - channel_id
      - effective_at
      - reservation_id
      - commercial_snapshot_ref
    CouponRestorationRequestedData:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
        consumption_operation_id:
          type: string
          format: uuid
        cancellation_reason:
          type: string
          minLength: 1
        cancelled_at:
          type: string
          format: date-time
      required:
      - cancellation_reason
      - cancelled_at
      - consumption_operation_id
      - order_id
    CouponRestorationResultData:
      type: object
      properties:
        order_id:
          type: string
        cupon_id:
