    PricingProductInitializationRequestedData:
      type: object
      properties:
        product_id:
          type: string
        sku_base:
          type: string
        precio_regular:
          type: number
          exclusiveMinimum: 0
        moneda:
          type: string
          minLength: 3
          maxLength: 3
        channel_id:
          type: 'null'
        motivo_cambio:
          type: string
          const: ALTA_PRODUCTO
      required:
      - product_id
      - sku_base
      - precio_regular
      - moneda
      - channel_id
      - motivo_cambio
    PricingProductInitializationResultData:
      type: object
      properties:
        product_id:
          type: string
        sku_base:
          type: string
        status:
          type: string
          enum:
          - READY
          - REJECTED
        price_version:
          type:
          - integer
