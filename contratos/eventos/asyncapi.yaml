    validación, grants, habilitación ni despliegue. RabbitMQ se conserva en el snapshot H4. Entrega at-least-once,
    Outbox por destinatario, Inbox antes de settlement y DLQ supervisada; no exactly-once.
defaultContentType: application/json
x-delivery-semantics: at-least-once
