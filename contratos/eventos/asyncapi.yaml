servers:
  rabbitmq:
    host: '{host}:{port}'
    protocol: amqp
    protocolVersion: 0.9.1
    description: Broker RabbitMQ de G6 Productos y Ofertas.
    variables:
      host:
        default: rabbitmq
      port:
        default: '5672'
    x-vhost: g6-productos-ofertas
x-rabbitmq-policy:
  main_queue_type: quorum
  retry_queue_type: quorum
  dlq_type: quorum
  publisher_confirms: true
  consumer_ack: manual
  default_prefetch: 20
  application_retry_attempts: 3
  retry_delay_ms: 30000
  unroutable_publish: mandatory=true + alternate exchange po.sin-ruta.x
  unroutable_publish_behavior: >-
    If the primary exchange cannot route a message but po.sin-ruta.x routes it to
    po.sin-ruta.q, RabbitMQ considers it routed and does not send basic.return;
    if the alternate exchange also cannot route it, mandatory=true causes
    basic.return. Publisher confirms are an independent signal.
  business_rejection_rule: Business rejections are acknowledged and translated to contract results/events; they are not sent to retry/DLQ.
  retry_dlx_status: blocked-not-provisioned
  retry_dlx_approval: not-approved
x-rabbitmq-topology:
  vhost: g6-productos-ofertas
  observation:
    source: Oracle RabbitMQ audit dated 2026-10-19; historical, not necessarily current server state
    rabbitmq_version: 4.2.9
    observed_binding_count: 57
    exact_binding_mapping_status: PENDIENTE_VERIFICACION
    note: The observed count does not establish exact correspondence with AsyncAPI bindings; no binding definition export is available here.
  external_homologation_status: pending
  retry_dlx_status: blocked-not-provisioned
  exchanges:
    po.comandos.x:
      type: topic
      durable: true
      status: base-observed-not-homologated
      alternate_exchange: po.sin-ruta.x
    po.eventos.x:
      type: topic
      durable: true
      status: base-observed-not-homologated
      alternate_exchange: po.sin-ruta.x
    po.resultados.x:
      type: topic
      durable: true
      status: base-observed-not-homologated
      alternate_exchange: po.sin-ruta.x
    po.retry.x:
      type: direct
      durable: true
      status: candidate-not-approved
      provisioned: false
    po.dlx.x:
      type: direct
      durable: true
      status: candidate-not-approved
      provisioned: false
    po.sin-ruta.x:
      type: fanout
      durable: true
      status: base-observed-not-homologated
  queues:
    po.catalogo.q:
      consumer: catalog-svc
      type: quorum
      durable: true
      status: base-observed-not-homologated
      prefetch: 20
      bindings:
      - exchange: po.comandos.x
        routing_key: catalog.bulk.upsert.requested
      - exchange: po.comandos.x
        routing_key: taxonomy.master.deactivation.check.requested
      - exchange: po.eventos.x
        routing_key: taxonomy.category.updated
      - exchange: po.eventos.x
        routing_key: taxonomy.characteristic-value.updated
      - exchange: po.eventos.x
        routing_key: taxonomy.master.deactivated
      - exchange: po.eventos.x
        routing_key: taxonomy.product-type-schema.changed
      - exchange: po.resultados.x
        routing_key: inventory.sku.initialization.completed
      - exchange: po.resultados.x
        routing_key: inventory.sku.initialization.rejected
      - exchange: po.resultados.x
        routing_key: pricing.product.initialization.completed
      - exchange: po.resultados.x
        routing_key: pricing.product.initialization.rejected
      - exchange: po.resultados.x
        routing_key: taxonomy.master.deactivation.rejected
      retry_queue: po.catalogo.q.retry
      dlq: po.catalogo.q.dlq
    po.catalogo.q.retry:
      consumer: catalog-svc
      type: quorum
      durable: true
      status: candidate-not-provisioned
      binding:
        exchange: po.retry.x
        routing_key: po.catalogo.q
      message_ttl_ms: 30000
      dead_letter_exchange: ''
      dead_letter_routing_key: po.catalogo.q
    po.catalogo.q.dlq:
      consumer: catalog-svc
      type: quorum
      durable: true
      status: candidate-not-provisioned
      binding:
        exchange: po.dlx.x
        routing_key: po.catalogo.q
      manual_recovery: true
    po.pasarela.q:
      consumer: api-gateway/bff
      type: quorum
      durable: true
      status: base-observed-not-homologated
      prefetch: 20
      bindings:
      - exchange: po.eventos.x
        routing_key: catalog.product.deactivated
      - exchange: po.eventos.x
        routing_key: inventory.reservation.consumed
      - exchange: po.eventos.x
        routing_key: inventory.reservation.created
      - exchange: po.eventos.x
        routing_key: inventory.reservation.expired
      - exchange: po.eventos.x
