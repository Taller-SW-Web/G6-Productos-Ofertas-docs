components:
  schemas:
    MessageEnvelope:
      type: object
      properties:
        message_id:
          type: string
          minLength: 1
        schema_version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
          minLength: 1
        causation_id:
          type:
          - string
          - 'null'
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
        producer:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - event
          - command
          - result
        name:
          type: string
          minLength: 1
        data:
          type: object
      required:
      - message_id
      - schema_version
      - occurred_at
      - correlation_id
      - producer
      - kind
      - name
      - data
    GenericData:
      type: object
      description: Payload específico del mensaje. Para mensajes P1 críticos se especializa mediante schemas dedicados.
      additionalProperties: true
    MasterDeactivationIdentityData:
      type: object
      properties:
        entity_type:
          type: string
          enum: [CATEGORY, BRAND, PRODUCT_TYPE, CHARACTERISTIC_VALUE]
        entity_id:
          type: string
          minLength: 1
          description: Identidad opaca del maestro, preservada sin transformación.
        version:
          type: integer
          minimum: 0
          description: Versión autoritativa capturada por Taxonomy al admitir la baja; no es schema_version del envelope.
      required: [entity_type, entity_id, version]
      additionalProperties: true
    MasterDeactivationAssociationData:
      type: object
      properties:
        entity_type:
          type: string
          const: PRODUCT_TYPE_CHARACTERISTIC
        entity_id:
          type: string
          minLength: 1
        tipo_producto_id:
          type: string
          minLength: 1
          description: Identificador del tipo de producto autoritativo de la asociación.
        caracteristica_id:
          type: string
          minLength: 1
          description: Identificador de la característica autoritativo de la asociación.
        version:
          type: integer
          minimum: 0
          description: schema_version autoritativa del tipo capturada y proporcionada por Taxonomy al admitir la operación; Catalog la conserva y verifica. No es schema_version del envelope ni una versión de fila de asociación.
      required: [entity_type, entity_id, tipo_producto_id, caracteristica_id, version]
      additionalProperties: true
    MasterDeactivationData:
      oneOf:
      - $ref: '#/components/schemas/MasterDeactivationIdentityData'
      - $ref: '#/components/schemas/MasterDeactivationAssociationData'
    MasterDeactivationCheckedData:
      allOf:
      - $ref: '#/components/schemas/MasterDeactivationData'
      - type: object
        properties:
          result:
            type: string
            enum: [CLEAR, IN_USE]
        required: [result]
    MasterDeactivationCompletedData:
      oneOf:
      - $ref: '#/components/schemas/MasterDeactivationIdentityData'
      - allOf:
        - $ref: '#/components/schemas/MasterDeactivationAssociationData'
        - type: object
          properties:
            schema_version_resultante:
              type: integer
              minimum: 1
              description: Evolución confirmada del esquema posterior a la versión capturada; no se equipara a la versión de la fila de asociación.
          required: [schema_version_resultante]
    MasterDeactivationRejectedData:
      allOf:
      - $ref: '#/components/schemas/MasterDeactivationData'
      - type: object
        properties:
          reason:
            type: string
            minLength: 1
        required: [reason]
    CouponConsumptionRequestedData:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
        coupon_code:
          type: string
          minLength: 1
        customer_ref:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        channel_id:
          type: string
          enum:
          - MARKETPLACE
          - CHATBOT
          - RETAIL
        reservation_id:
          type: string
          format: uuid
        commercial_snapshot_ref:
          type: string
          minLength: 1
        effective_at:
          type: string
          format: date-time
      required:
      - order_id
      - coupon_code
      - channel_id
      - effective_at
      - reservation_id
      - commercial_snapshot_ref
    CouponRestorationRequestedData:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
        consumption_operation_id:
          type: [string, 'null']
          format: uuid
          description: Referencia de consumo original; opcional solo en transición, pendiente de conciliación por G5/G6.
        cancellation_reason:
          type: string
          minLength: 1
        cancelled_at:
          type: string
          format: date-time
      required:
      - order_id
      - cancellation_reason
      - cancelled_at
    CouponRestorationResultData:
      type: object
      properties:
        order_id:
          type: string
        cupon_id:
          type:
          - string
          - 'null'
        consumption_operation_id:
          type: [string, 'null']
          format: uuid
        restored:
          type: boolean
        outcome:
          type: string
          enum:
          - RESTORED
          - POLICY_KEEPS_CONSUMPTION
          - NO_CONSUMPTION
        completed_at:
          type: string
          format: date-time
      required:
      - order_id
      - restored
      - outcome
      - completed_at
    CouponRestorationRejectedData:
      type: object
      description: Rechazo definitivo de restauración, separado de los outcomes de restauración completada.
      properties:
        order_id: {type: string, minLength: 1}
        consumption_operation_id:
          type: [string, 'null']
          format: uuid
          description: Referencia del consumo original, opcional durante la transición con Ventas.
        result_code: {type: string, minLength: 1, pattern: '\S'}
        completed_at: {type: string, format: date-time}
      required: [order_id, result_code, completed_at]
    PricingProductInitializationRequestedData:
      type: object
      properties:
        product_id:
          type: string
        sku_base:
          type: string
        precio_regular:
          type: number
          exclusiveMinimum: 0
        moneda:
          type: string
          minLength: 3
          maxLength: 3
        channel_id:
          type: 'null'
        motivo_cambio:
          type: string
          const: ALTA_PRODUCTO
      required:
      - product_id
      - sku_base
      - precio_regular
      - moneda
      - channel_id
      - motivo_cambio
    PricingProductInitializationResultData:
      type: object
      properties:
        product_id:
          type: string
        sku_base:
          type: string
        status:
          type: string
          enum:
          - READY
          - REJECTED
        price_version:
          type:
          - integer
          - 'null'
          minimum: 1
        vigencia_id:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        completed_at:
          type: string
          format: date-time
      required:
      - product_id
      - sku_base
      - status
      - completed_at
    InventorySkuInitializationRequestedData:
      type: object
      properties:
        sku:
          type: string
        product_id:
          type: string
        variant_id:
          type:
          - string
          - 'null'
        default_location_id:
          type:
          - string
          - 'null'
      required:
      - sku
      - product_id
    InventorySkuInitializationResultData:
      type: object
      properties:
        sku:
          type: string
        product_id:
          type: string
        variant_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - INITIALIZED
          - REJECTED
        code:
          type:
          - string
          - 'null'
        completed_at:
          type: string
          format: date-time
      required:
      - sku
      - product_id
      - status
      - completed_at
    InventoryReservationCreatedData:
      type: object
      properties:
        order_id: {type: string, minLength: 1}
        reservation_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              sku: {type: string, minLength: 1}
              quantity: {type: integer, minimum: 1}
            required: [sku, quantity]
      required: [order_id, reservation_id, expires_at, decided_at, lines]
    InventoryReservationRejectedData:
      type: object
      properties:
        order_id: {type: string, minLength: 1}
        result_code: {type: string, minLength: 1}
        decided_at: {type: string, format: date-time}
      required: [order_id, result_code, decided_at]
    InventoryReservationTransitionData:
      type: object
      properties:
        order_id: {type: string, minLength: 1}
        reservation_id: {type: string, format: uuid}
        decided_at: {type: string, format: date-time}
        reason_code: {type: [string, 'null']}
      required: [order_id, reservation_id, decided_at]
    InventoryConsumptionResultData:
      type: object
      properties:
        order_id: {type: string, minLength: 1}
        reservation_id: {type: string, format: uuid}
        decided_at: {type: string, format: date-time}
        result_code: {type: [string, 'null']}
      required: [order_id, reservation_id, decided_at]
    InventoryConsumptionRejectedData:
      type: object
      description: Rechazo definitivo de consumo posterior a admisión, con causa funcional obligatoria.
      properties:
        order_id: {type: string, minLength: 1}
        reservation_id: {type: string, format: uuid}
        decided_at: {type: string, format: date-time}
        result_code: {type: string, minLength: 1, pattern: '\S'}
      required: [order_id, reservation_id, decided_at, result_code]
    CouponConsumptionResultData:
      type: object
      properties:
        order_id: {type: string, minLength: 1}
        coupon_code: {type: string, minLength: 1}
        reservation_id: {type: string, format: uuid}
        commercial_snapshot_ref: {type: string, minLength: 1}
        result_code: {type: [string, 'null']}
        consumption_id: {type: [string, 'null'], format: uuid}
        decided_at: {type: string, format: date-time}
      required: [order_id, coupon_code, reservation_id, commercial_snapshot_ref, decided_at]
    CouponConsumptionRejectedData:
      type: object
      description: Rechazo de consumo de cupón; el código de negocio es obligatorio y no representa consumo exitoso.
      properties:
        order_id: {type: string, minLength: 1}
        coupon_code: {type: string, minLength: 1}
        reservation_id: {type: string, format: uuid}
        commercial_snapshot_ref: {type: string, minLength: 1}
        result_code: {type: string, minLength: 1, pattern: '\S'}
        consumption_id: {type: [string, 'null'], format: uuid}
        decided_at: {type: string, format: date-time}
      required: [order_id, coupon_code, reservation_id, commercial_snapshot_ref, decided_at, result_code]
