      dead_letter_routing_key: po.price-audit.q
    po.price-audit.q.dlq:
      consumer: price-audit-svc
      type: quorum
      durable: true
      binding:
        exchange: po.dlx.x
        routing_key: po.price-audit.q
      manual_recovery: true
    po.sales.q:
      consumer: modulo-ventas
      type: quorum
      durable: true
      prefetch: 20
      bindings:
      - exchange: po.events.x
        routing_key: inventory.reservation.consumed
      - exchange: po.events.x
        routing_key: inventory.reservation.created
      - exchange: po.events.x
        routing_key: inventory.reservation.expired
      - exchange: po.events.x
        routing_key: inventory.reservation.released
      - exchange: po.results.x
        routing_key: inventory.consumption.completed
      - exchange: po.results.x
        routing_key: inventory.consumption.rejected
      - exchange: po.results.x
        routing_key: promotions.coupon.consumption.completed
      - exchange: po.results.x
        routing_key: promotions.coupon.consumption.rejected
      - exchange: po.results.x
        routing_key: promotions.coupon.restoration.completed
      - exchange: po.results.x
        routing_key: promotions.coupon.restoration.rejected
      retry_queue: po.sales.q.retry
      dlq: po.sales.q.dlq
    po.sales.q.retry:
      consumer: modulo-ventas
      type: quorum
      durable: true
      binding:
        exchange: po.retry.x
